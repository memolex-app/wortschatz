/* ---------- Synchronisation entre appareils (Supabase, sans bibliothèque) ----------
   Chaque mot est une ligne ; les réglages une ligne « _settings ». La copie du téléphone reste la référence :
   à chaque modification, la carte reçoit une heure (mt). Quand deux appareils ont changé le même mot,
   la version la plus récente gagne. Un mot supprimé ici laisse une trace (tomb) jusqu'à ce que le serveur l'ait reçue. */
const APP_VER="2.1.3";
{ const e=document.getElementById('appVer'); if(e) e.textContent='version '+APP_VER; }
const SB_URL="https://rbgxotiadewxlyvvrdhp.supabase.co", SB_KEY="sb_publishable_ikHUtYnxyFpCnIobNeRx6Q_5wH6duiZ", SB_TABLE="memolex", SYNC_KEY="mx-sync";
let SY=(()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ return {}; } })();
SY.dirty=SY.dirty||{}; SY.tomb=SY.tomb||{};
let SYNCING=false, SYNC_T=null, SYNC_AGAIN=false;
const syPut=()=>{ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch(e){} };
class SyErr extends Error{ constructor(m,code){ super(m); this.code=code; } }
async function sbReq(path,o={},auth){
  const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},o.headers||{});
  if(auth){ if(!SY.tok) throw new SyErr(T('sbReq.non_connecte'),'auth'); if(Date.now()>(SY.exp||0)-60e3) await sbRefresh(); h.Authorization='Bearer '+SY.tok; }
  let r; try{ r=await fetch(SB_URL+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}); }catch(e){ throw new SyErr(T('sbReq.hors_ligne'),'net'); }
  if(r.status===401 && auth && !o.retried){ await sbRefresh(); return sbReq(path,Object.assign({retried:true},o),auth); }
  if(!r.ok){ let m=''; try{ const j=await r.json(); m=j.msg||j.message||j.error_description||j.error||''; }catch(e){} throw new SyErr(m||(T('sbReq.erreur')+r.status), r.status); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
function sbSession(j){ SY.tok=j.access_token; SY.ref=j.refresh_token; SY.exp=Date.now()+(j.expires_in||3600)*1000; if(j.user){ SY.uid=j.user.id; SY.email=j.user.email||SY.email; } syPut(); }
async function sbRefresh(){ if(!SY.ref) throw new SyErr(T('sbRefresh.session_expiree'),'auth'); let j;
  try{ j=await sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SY.ref}},false); }
  catch(e){ if(e.code==='net') throw e; syOutLocal(); throw new SyErr(T('sbRefresh.session_expiree_reconnecte_toi'),'auth'); }
  sbSession(j); }
function syOutLocal(){ SY={dirty:{},tomb:{}}; syPut(); syUi(); }

/* --- signaler une carte : file locale, envoi à Supabase (table memolex_report) --- */
const REPORT_REASONS=[['trad',T('REPORT_REASONS.traduction_incorrecte')],['exemple',T('REPORT_REASONS.phrase_d_exemple_douteuse')],['chunk',T('REPORT_REASONS.expression_a_retenir_fausse')],['gram',T('REPORT_REASONS.article_pluriel_nature_ou_cas')],['offensif',T('REPORT_REASONS.contenu_choquant_ou_offensant')],['autre',T('REPORT_REASONS.autre')]];
const RQ_KEY='mx-reports', RDONE_KEY='mx-reported';
const rqGet=k=>{ try{ return JSON.parse(localStorage.getItem(k))||(k===RQ_KEY?[]:{}); }catch(e){ return k===RQ_KEY?[]:{}; } };
const rqSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
function reportedKey(c){ return langOf(c)+'|'+dkey(c); }
function flagHTML(c){ const done=rqGet(RDONE_KEY)[reportedKey(c)];
  return `<div class="flagrow">${done?`<button class="flagbtn" disabled>${T('done.signale_merci')}</button>`:`<button class="flagbtn" data-flag aria-label="${T('done.signaler_une_erreur_sur_cette')}">${T('done.signaler_une_erreur')}</button>`}</div>`; }
function reportSnapshot(c){
  const k=dkey(c), ch=CHDATA&&CHDATA[k], ex=(EXDATA&&EXDATA[k])||[];
  return { key:k, de:c.de, art:c.art||'', pl:c.pl||'', fr:c.fr, pos:posOf(c)||'', lvl:c.lvl||'', src:c.src||'own', frOwn:!!c.frOwn,
    chunk:ch?[ch[0],ch[1]]:null, ex:ex.slice(0,4).map(e=>[e[0],e[1],e[3]||'']), def:c.def||'', ownEx:c.ex||'', dir };
}
let reportCard=null;
function openReport(c){
  reportCard=c; document.querySelector('.rsheet')?.remove();
  const o=document.createElement('div'); o.className='rsheet'; o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true'); o.setAttribute('aria-labelledby','rTitle');
  o.innerHTML=`<div class="rbox"><h2 id="rTitle">${T('openReport.signaler_une_erreur')}</h2><p class="rword">${deWord(c)} · ${esc(c.fr)}</p>
    <div class="rreasons" role="radiogroup">${REPORT_REASONS.map(([v,l])=>`<label><input type="radio" name="rreason" value="${v}"> ${esc(l)}</label>`).join('')}</div>
    <textarea id="rComment" maxlength="1000" placeholder="${T('openReport.precise_si_tu_veux_facultatif')}"></textarea>
    <div class="ract"><button class="btn ghost" data-rcancel>${T('first.annuler')}</button><button class="btn" data-rsend disabled>${T('openReport.envoyer')}</button></div>
    <p class="hint" style="margin:0">${T('openReport.le_signalement_contient_la_carte')}</p></div>`;
  document.body.appendChild(o);
  const upd=()=>{ const r=o.querySelector('input[name=rreason]:checked'); const t=o.querySelector('#rComment').value.trim(); o.querySelector('[data-rsend]').disabled=!r||(r.value==='autre'&&!t); };
  o.addEventListener('change',upd); o.addEventListener('input',upd);
  o.addEventListener('click',e=>{ if(e.target===o) closeReport(); });
}
function closeReport(){ document.querySelector('.rsheet')?.remove(); reportCard=null; }
function sendReport(){
  const o=document.querySelector('.rsheet'), c=reportCard; if(!o||!c) return;
  const r=o.querySelector('input[name=rreason]:checked'); if(!r) return;
  const comment=o.querySelector('#rComment').value.trim().slice(0,1000);
  const q=rqGet(RQ_KEY); q.push({ lang:langOf(c), reason:r.value, comment, card:reportSnapshot(c), app_ver:APP_VER, client_id:clientId(), at:new Date().toISOString() }); rqSet(RQ_KEY,q.slice(-50));
  const d=rqGet(RDONE_KEY); d[reportedKey(c)]=Date.now(); rqSet(RDONE_KEY,d);
  closeReport(); toast(T('comment.merci_signalement_enregistre')); renderReview(); flushReports();
}
function clientId(){ let id; try{ id=localStorage.getItem('mx-cid'); if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()); localStorage.setItem('mx-cid',id); } }catch(e){ id='?'; } return id; }
let REP_FLUSHING=false;
async function flushReports(){
  if(REP_FLUSHING || !navigator.onLine) return; const q=rqGet(RQ_KEY); if(!q.length) return; REP_FLUSHING=true;
  try{
    while(true){ const cur=rqGet(RQ_KEY); if(!cur.length) break; const it=cur[0];
      const h={apikey:SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'};
      if(SY.tok && Date.now()<(SY.exp||0)-60e3) h.Authorization='Bearer '+SY.tok;
      let r; try{ r=await fetch(SB_URL+'/rest/v1/memolex_report',{method:'POST',headers:h,body:JSON.stringify({lang:it.lang,reason:it.reason,comment:it.comment,card:it.card,app_ver:it.app_ver,client_id:it.client_id})}); }catch(e){ break; }
      if(r.ok || (r.status>=400 && r.status<500 && r.status!==401 && r.status!==429)){ if(!r.ok) console.warn(T('flushReports.signalement_refuse'), r.status); rqSet(RQ_KEY, rqGet(RQ_KEY).slice(1)); continue; }
      break;
    }
  } finally { REP_FLUSHING=false; }
}
window.addEventListener('online', ()=>flushReports());
setTimeout(()=>flushReports(), 4000);
document.addEventListener('click', e=>{ const t=e.target.closest('button'); if(!t) return;
  if('flag' in t.dataset){ const cc=session&&(session.view!=null?session.hist[session.view]?.before:cards.get(session.ids[0])); if(cc) openReport(cc); return; }
  if('rcancel' in t.dataset){ closeReport(); return; }
  if('rsend' in t.dataset){ sendReport(); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.querySelector('.rsheet')) closeReport(); });

/* --- ce qui change ici est noté pour le prochain envoi --- */
function syMark(id){ if(!SY.tok) return; if(id) SY.dirty[id]=1; syPut(); clearTimeout(SYNC_T); SYNC_T=setTimeout(()=>syncNow(true),2500); syUi(); }
const stamp = c => ({...c, mt:Date.now()});

/* --- réception : la version la plus récente gagne --- */
function syApply(rows){
  let n=0;
  for(const r of rows){
    const rmt=(r.data && r.data.mt)||0;
    if(r.id==='_settings'){ if(!r.deleted && r.data){ const more=mergeAct(r.data.act); const act=settings.act, best=Math.max(settings.bestStreak||0, r.data.bestStreak||0);
        if(rmt>(settings.mt||0) && !SY.dirty._settings){ settings={...settings,...r.data, act, bestStreak:best}; try{ localStorage.setItem('mx-settings', JSON.stringify(settings)); }catch(e){} n++; if(more) actDirty(); }
        else { settings.bestStreak=best; if(more || JSON.stringify(act)!==JSON.stringify(r.data.act||{})) actDirty(); } } continue; }
    const loc=cards.get(r.id);
    if(r.deleted){
      if(loc && (loc.mt||0)<=rmt){ cards.delete(r.id); delete SY.dirty[r.id]; n++; }
      continue;
    }
    if(SY.tomb[r.id] && SY.tomb[r.id]>=rmt) continue;          // supprimé ici après : la suppression partira
    if(!loc || (loc.mt||0)<rmt){ const {id,...d}=r.data; cards.set(r.id,{...d,id:r.id}); delete SY.dirty[r.id]; delete SY.tomb[r.id]; n++; }
  }
  return n;
}
async function syPull(){
  let n=0, off=0, max=SY.cur||null;
  for(;;){
    const q=`/rest/v1/${SB_TABLE}?select=id,data,deleted,srv_at&order=srv_at.asc,id.asc&limit=1000&offset=${off}`+(SY.cur?'&srv_at=gt.'+encodeURIComponent(new Date(Date.parse(SY.cur)-5000).toISOString()):''); // 5 s de recouvrement : un envoi encore en cours ailleurs n'est pas manqué
    const rows=await sbReq(q,{},true)||[]; if(!rows.length) break;
    n+=syApply(rows); rows.forEach(r=>{ if(!max || r.srv_at>max) max=r.srv_at; });
    if(rows.length<1000) break; off+=1000;
  }
  if(max) SY.cur=max; return n;
}
/* --- envoi : les mots modifiés ici, par paquets --- */
async function syPush(){
  const ids=Object.keys(SY.dirty); if(!ids.length) return 0;
  const snap=new Map();
  const rows=ids.map(id=>{
    if(id==='_settings'){ snap.set(id,settings.mt||0); return {user_id:SY.uid,id,data:settings,deleted:false}; }
    const c=cards.get(id);
    if(c){ snap.set(id,c.mt||0); return {user_id:SY.uid,id,data:c,deleted:false}; }
    const t=SY.tomb[id]||Date.now(); snap.set(id,t); return {user_id:SY.uid,id,data:{mt:t},deleted:true};
  });
  for(let i=0;i<rows.length;i+=200){
    await sbReq(`/rest/v1/${SB_TABLE}?on_conflict=user_id,id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:rows.slice(i,i+200)},true);
  }
  // une carte modifiée pendant l'envoi reste à envoyer
  for(const [id,m] of snap){ const now = id==='_settings' ? (settings.mt||0) : cards.has(id) ? (cards.get(id).mt||0) : (SY.tomb[id]||0);
    if(now===m){ delete SY.dirty[id]; if(!cards.has(id)) delete SY.tomb[id]; } }
  return rows.length;
}
async function syncNow(quiet){
  if(!SY.tok) return false;
  if(SYNCING){ SYNC_AGAIN=true; return false; }
  SYNCING=true; syUi(quiet?null:T('pend.synchronisation'));
  try{
    if(!SY.init){ // premier passage sur cet appareil : tout ce qu'il contient part aussi
      [...cards.keys()].forEach(id=>SY.dirty[id]=1); SY.dirty._settings=1; SY.init=1; SY.cur=null;
    }
    const got=await syPull();
    if(got){ saveLocal(); synced=false; await syncFromSources(); refresh(); }
    const sent=await syPush();
    SY.last=Date.now(); SY.err=''; syPut();
    syUi(quiet?null:`${T('sent.synchronise',[got||sent?` ${T('sent.envoye_recu',[sent,got])}`:''])}`);
    return true;
  }catch(e){
    SY.err = e.code==='net' ? T('sent.hors_ligne_la_synchro_reprendra') : e.code==='auth' ? T('sbRefresh.session_expiree_reconnecte_toi') : (e.message||T('sent.la_synchro_a_echoue')); syPut();
    syUi(quiet?null:SY.err); return false;
  }finally{
    SYNCING=false; syUi();
    if(SYNC_AGAIN){ SYNC_AGAIN=false; setTimeout(()=>syncNow(true),300); }
  }
}

/* --- connexion par lien reçu par e-mail (compte propre à Memolex) --- */
const sbSendLink=email=>sbReq('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:{email,create_user:true}},false);
async function authHash(){
  const h=location.hash; if(!/access_token=|error_code=/.test(h)) return;
  const q=new URLSearchParams(h.slice(1)); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(q.get('error_code')||q.get('error')){ toast(q.get('error_code')==='otp_expired'?T('authHash.ce_lien_a_expire_ou'):T('authHash.la_connexion_a_echoue_demande')); return; }
  const old=SY; SY={dirty:{},tomb:{},tok:q.get('access_token'),ref:q.get('refresh_token'),exp:Date.now()+(+q.get('expires_in')||3600)*1000};
  try{ const u=await sbReq('/auth/v1/user',{},true);
    if(old.uid===u.id) SY=Object.assign(old,{tok:SY.tok,ref:SY.ref,exp:SY.exp}); else SY.uid=u.id;
    SY.email=u.email; syPut(); toast(T('authHash.connecte')+u.email); syncNow(false);
  }catch(e){ SY=old; syPut(); toast(e.code==='net'?T('authHash.hors_ligne_rouvre_le_lien'):T('authHash.la_connexion_a_echoue_demande_2')); }
  syUi();
}

/* --- interface : l'état en haut, le panneau du compte dans le Guide --- */
function syWhen(t){ const m=Math.round((Date.now()-t)/60000); return m<1?T('syWhen.a_l_instant'):m<60?`${T('syWhen.il_y_a_min',[m])}`:new Date(t).toLocaleString(LOC(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function syUi(msg){
  const top=$('#sync');
  if(top){ const pend=Object.keys(SY.dirty).length;
    top.textContent = !SY.tok ? T('pend.sur_cet_appareil_synchroniser') : SYNCING ? T('pend.synchronisation') : SY.err ? SY.err : pend ? `${T('pend.changement_a_envoyer',[pend])}` : SY.last ? T('pend.synchronise')+syWhen(SY.last) : T('pend.synchronisation_prete');
    top.dataset.state = !SY.tok ? 'off' : SYNCING ? 'busy' : SY.err ? 'err' : pend ? 'pend' : 'ok'; }
  const box=$('#acct'); if(!box) return;
  if(msg!=null) box.dataset.msg=msg;
  box.innerHTML = SY.tok
    ? `<p>${T('pend.connecte',[esc(SY.email||'')])}</p><p class="hint">${SY.err?esc(SY.err):SY.last?T('pend.derniere_synchro')+syWhen(SY.last):T('pend.pas_encore_synchronise')}</p>
       <div class="row"><button type="button" class="btn" data-sygo ${SYNCING?'disabled':''}>${SYNCING?T('pend.synchronisation'):T('pend.synchroniser_maintenant')}</button><button type="button" class="btn ghost" data-syout>${T('pend.se_deconnecter')}</button></div>
       <p class="hint">${T('pend.tes_mots_ta_progression_et')}</p>`
    : `<p class="hint">${T('pend.connecte_toi_pour_retrouver_tes')}</p>
       <label for="syEmail">${T('pend.adresse_e_mail')}<input type="email" id="syEmail" autocomplete="email" placeholder="toi@exemple.fr"></label>
       <button type="button" class="btn" data-sylink>${T('pend.m_envoyer_le_lien_de')}</button>`;
  if(box.dataset.msg) box.insertAdjacentHTML('beforeend',`<p class="hint" aria-live="polite"><b>${esc(box.dataset.msg)}</b></p>`);
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if('sylink' in b.dataset){ const em=($('#syEmail')?.value||'').trim(); if(!/^\S+@\S+\.\S+$/.test(em)){ toast(T('pend.saisis_une_adresse_e_mail')); return; }
    b.disabled=true; try{ await sbSendLink(em); syUi(`${T('pend.lien_envoye_a_ouvre_l',[em])}`); }catch(err){ syUi(err.code==='net'?T('pend.hors_ligne_reessaie_une_fois'):(err.message||T('pend.le_lien_n_a_pas'))); } b.disabled=false; return; }
  if('sygo' in b.dataset){ syncNow(false); return; }
  if('syout' in b.dataset){ try{ await sbReq('/auth/v1/logout',{method:'POST'},true); }catch(err){} syOutLocal(); syUi(T('pend.deconnecte_tes_mots_restent_sur')); return; }
});
addEventListener('online',()=>{ if(SY.tok) syncNow(true); });
document.addEventListener('visibilitychange',()=>{ if(!SY.tok) return; if(document.visibilityState==='hidden'){ if(Object.keys(SY.dirty).length) syncNow(true); } else if(Date.now()-(SY.last||0)>20e3) syncNow(true); });
setInterval(()=>{ if(!SYNCING) syUi(); }, 60e3);

refresh();
useLocal();
authHash(); addEventListener('hashchange', authHash);
if(SY.tok) syncNow(true);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
