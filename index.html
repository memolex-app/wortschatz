<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memolex</title>
<meta name="theme-color" content="#1c1a2b">
<meta name="description" content="Vocabulaire allemand et italien depuis le français, par répétition espacée, hors ligne.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}.reinf{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb, var(--bg) 70%, transparent);animation:reinfIn .22s ease-out}
.reinf.out{opacity:0;transition:opacity .25s}
.reinf-box{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:6px;padding:22px 26px;max-width:calc(100% - 48px)}
.reinf-box b{font-size:1.5rem;letter-spacing:.02em}
.reinf-box span{font-size:1rem}
.reinf-box small{font-size:.85rem;opacity:.75}
@keyframes reinfIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reinf{animation:none}}
.flagrow{display:flex;justify-content:flex-end;margin-top:.9rem}
.flagbtn{font-size:.8rem;color:var(--muted);background:none;border:0;padding:.3rem .2rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.flagbtn[disabled]{text-decoration:none;cursor:default}
.rsheet{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb, var(--bg) 70%, transparent)}
.rbox{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:6px 6px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.rbox h2{margin:0;font-size:1.15rem}
.rbox .rword{margin:0;color:var(--muted);font-size:.9rem}
.rreasons{display:flex;flex-direction:column;gap:6px}
.rbox .rreasons label{display:flex;flex-direction:row;justify-content:flex-start;text-align:left;gap:10px;align-items:center;font-weight:500;margin:0;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:.95rem}
.rbox .rreasons input{width:18px;height:18px;flex:none;margin:0;padding:0;accent-color:var(--accent);appearance:auto;-webkit-appearance:radio;box-shadow:none;border:0;background:none}
.rbox .rreasons label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.rbox textarea{width:100%;box-sizing:border-box;min-height:70px;font:inherit;font-size:.95rem;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
.rbox .ract{display:flex;gap:8px;justify-content:flex-end}
@media (min-width:600px){.rsheet{align-items:center}.rbox{border-radius:6px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : une colonne étroite, pensée téléphone ; la carte est une « fenêtre » d'ordinateur 1980, onglets en bas comme une barre des tâches */
:root{
  --bg:#e6e0d0; --surface:#f8f4e8; --ink:#1c1a2b; --muted:#5d586b; --line:#b9b1a0;
  --hi:#ffffff; --lo:#9a927f;
  --accent:#1d5f6b; --accent-ink:#ffffff;
  --der:#2353b8; --die:#c3302c; --das:#257a36;
  --der-bg:#dfe6f6; --die-bg:#f7e1dd; --das-bg:#dcefdc;
  --ok:#257a36; --bad:#c3302c; --learn:#b06a08;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131f; --surface:#221f31; --ink:#f1e8d3; --muted:#a8a1b6; --line:#3d3952;
  --hi:#3f3a58; --lo:#08070d;
  --accent:#4ec2bd; --accent-ink:#15131f;
  --der:#7fa6ff; --die:#ff8478; --das:#72d08a;
  --der-bg:#1d2a4c; --die-bg:#43201f; --das-bg:#18372a;
  --ok:#72d08a; --bad:#ff8478; --learn:#f0b44c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131f; --surface:#221f31; --ink:#f1e8d3; --muted:#a8a1b6; --line:#3d3952;
  --hi:#3f3a58; --lo:#08070d;
  --accent:#4ec2bd; --accent-ink:#15131f;
  --der:#7fa6ff; --die:#ff8478; --das:#72d08a;
  --der-bg:#1d2a4c; --die-bg:#43201f; --das-bg:#18372a;
  --ok:#72d08a; --bad:#ff8478; --learn:#f0b44c; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 96px;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.appver{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;color:var(--muted);text-align:right;margin:0 0 2px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1 .pair{font-family:var(--f-body);font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sync{font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* review */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;box-shadow:0 6px 24px -14px rgba(20,30,60,.35)}
.prompt-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.postag{display:inline-block;margin-top:.5rem;padding:.1rem .55rem;border:1px solid var(--line, currentColor);border-radius:999px;font-size:.75rem;font-style:italic;color:var(--muted)}
.word{font-family:var(--f-display);font-size:clamp(1.8rem,8vw,2.6rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.art{font-weight:800}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}
.plural{color:var(--muted);font-size:1rem}
.example{font-style:italic;color:var(--muted);max-width:40ch;overflow-wrap:anywhere}
.tex{display:flex;flex-direction:column;gap:2px;max-width:40ch;margin-top:6px;padding:10px 14px;border-radius:12px;background:var(--bg);text-align:left;width:100%;box-sizing:border-box}
.tex .tde{margin:0;font-size:1.02rem;overflow-wrap:anywhere}
.tex .tde mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.tex .tsense{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tex.chunk{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.tex.chunk .tde{font-weight:600}
.tex.own .tde{font-size:.95rem}
.moreex{width:100%;max-width:40ch;margin-top:6px}
.moreex>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px;min-height:44px;box-sizing:border-box;color:var(--muted);font-size:.85rem;border-radius:12px;-webkit-tap-highlight-color:transparent}
.moreex>summary::-webkit-details-marker{display:none}
.moreex>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.moreex .chev{display:inline-block;font-size:1.2rem;line-height:1;transform:translateY(-3px);transition:transform .2s}
.moreex[open] .chev{transform:rotate(180deg) translateY(-3px)}
.wordline{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.saybtn{flex:none;font-size:1.05rem;line-height:1;width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:inherit;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.tde .saybtn{width:1.9rem;height:1.9rem;font-size:.85rem;margin-left:.4rem;vertical-align:middle}
.saybtn.on{animation:sayPulse .5s ease-out}
@keyframes sayPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.saybtn.on{animation:none}}
.tex .tfr{margin:0;color:var(--muted);font-size:.9rem;font-style:italic;overflow-wrap:anywhere}
.credits{max-height:320px;overflow-y:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.guide details summary{cursor:pointer;font-weight:700;color:var(--accent)}
.answer{display:flex;flex-direction:column;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.verdict{font-weight:700;font-size:.9rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.artpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.artpick button{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding:10px 18px;border-radius:999px;border:2px solid currentColor;background:transparent;cursor:pointer}
.artpick .b-der{color:var(--der)} .artpick .b-die{color:var(--die)} .artpick .b-das{color:var(--das)}
.artpick button:hover{background:var(--bg)}
.casepick{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.casepick .prompt-label{text-align:center}
.artpick .b-case{color:var(--accent);font-size:.95rem;padding:10px 14px}
.artpick .b-case[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.casepick .btn[disabled]{opacity:.45;cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-weight:400;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.grades .g1{border-color:var(--bad)} .grades .g4{border-color:var(--ok)}
.btn{font:inherit;font-weight:700;padding:13px 18px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dir{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;padding:6px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{color:var(--ink);font-size:1.3rem}

/* list */
.search{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:none}
.item .de{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .fr{color:var(--muted);font-size:.92rem;min-width:0;overflow-wrap:anywhere;grid-column:1}
.item .meta{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.new{background:var(--der-bg);color:var(--der)} .pill.known{background:var(--das-bg);color:var(--das)}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer;padding:0;text-decoration:underline}
.link.danger{color:var(--bad)}

/* levels */
.panel{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.level{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.level b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;color:var(--accent);line-height:1.1}
.level span{font-weight:700;font-size:.9rem}
.level small{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.level .meter{display:block;width:100%;margin-top:6px;height:5px}
.level:hover:not(:disabled){border-color:var(--accent)}
.level:disabled{opacity:.55;cursor:default}
.empty .levels{max-width:360px}
.levels-wrap{display:flex;flex-direction:column;gap:12px;width:100%}
.empty .levels-wrap{max-width:360px;align-items:stretch}
.level[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.packs{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.packs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.packs-head b{font-family:var(--f-display);font-size:1.05rem}
.packs-head small{color:var(--muted);font-size:.78rem}
.packs .btn{align-self:flex-start}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--accent)}
.confirm p{margin:0}
.dupbox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--accent);text-align:left}
.dupbox p{margin:0}
.dupitem{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.dupitem .de{font-weight:700}
.dupitem small{color:var(--muted);font-size:.78rem}
.meter{position:relative;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
/* barre de session : le remplissage suit la carte affichée, la boule reste sur la carte en cours */
.smeter{position:relative;height:6px;background:var(--line);border-radius:999px;margin:4px 6px}
.smeter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:999px;transition:width .2s}
.smeter b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ok);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ok)}
.sizes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;max-width:380px}
.sizes .size{flex:1 1 80px;max-width:110px}
.size:disabled{opacity:.35;cursor:not-allowed}
.size:disabled small{font-size:.66rem}
.size{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.size b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.size small{color:var(--muted);font-size:.72rem;white-space:nowrap}
.size[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.size[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.size:disabled{opacity:.4;cursor:default}
.dir small.hint{font-size:.76rem}
/* lessons & chips */
.lesson{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lesson-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lesson-head b{font-family:var(--f-display);font-size:1.1rem}
.lesson-head small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.chip{font:inherit;font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled,.btn:disabled{opacity:.5;cursor:default}
.pill.lvl{background:transparent;border:1px solid var(--line);font-weight:700}
.stsel{width:auto;font:inherit;font-size:.74rem;font-weight:700;padding:3px 24px 3px 10px;border-radius:999px;border:1px solid var(--line);background-color:var(--bg);color:var(--muted);cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.stsel.st-new{background-color:var(--der-bg);color:var(--der);border-color:transparent}
.stsel.st-known{background-color:var(--das-bg);color:var(--das);border-color:transparent}
.stsel.st-learn{color:var(--learn)}
.item .meta .when{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* filters & legend */
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:10px;align-items:baseline}
.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;min-width:56px}
.chip .cnt{font-weight:400;opacity:.7;margin-left:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-der{background:var(--der)} .d-die{background:var(--die)} .d-das{background:var(--das)} .d-none{background:var(--ink)}
.item .src{font-size:.78rem;opacity:.75}
/* guide */
.guide{display:flex;flex-direction:column;gap:14px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.guide h2{font-size:1.15rem;font-weight:700}
.guide p{margin:0;max-width:65ch}
.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.grades-doc{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.grades-doc dt{font-weight:700}
.grades-doc dt.bad{color:var(--bad)} .grades-doc dt.good{color:var(--ok)}
.grades-doc dd{margin:0;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tbl tr.rec td{background:var(--das-bg);font-weight:700}
.advice{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.advice b:first-child{font-family:var(--f-display);color:var(--accent)}
/* sessions */
.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sess{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.sess b{font-family:var(--f-display);font-size:1.1rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted)}
.sess span{font-weight:700;font-size:.82rem}
.sess small{font-size:.72rem;color:var(--muted)}
.sess.done b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sess.now{border-color:var(--accent)}
.sess.now b{border-color:var(--accent);color:var(--accent)}
.sess.todo{opacity:.6}
/* end-of-day & practice */
.more{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.more .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.more .btn small{font-weight:400;font-size:.78rem;opacity:.8}
.grades.two-col{grid-template-columns:1fr 1fr}
.cardnav{position:relative}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:2rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* téléphone : les flèches vont dans les coins hauts de la carte, zone vide, pour ne jamais couvrir le texte */
.navbtn.prev{left:8px} .navbtn.next{right:8px}
@media (max-width:719px){ .navbtn{top:8px;transform:none;width:40px;height:40px;font-size:1.6rem;box-shadow:none} }
.navbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:720px){ .navbtn.prev{left:-62px} .navbtn.next{right:-62px} }
.card.past{border-style:dashed}
.grades button.chosen{outline:3px solid var(--ink);outline-offset:1px}
.practice-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.practice-bar b{color:var(--accent)}
/* batches */
.batches summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;list-style:none;flex-wrap:wrap}
.batches summary::-webkit-details-marker{display:none}
.batches summary b{font-family:var(--f-display)}
.batches[open] summary{margin-bottom:4px}
.batch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.batch div{display:flex;flex-direction:column;min-width:0}
.batch small{color:var(--muted);font-size:.78rem}
/* forms */
form{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}
input,textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:140px;resize:vertical;font-size:.92rem}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.85em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}

/* dictionnaire */
.dict-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dict-head small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
#dq{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;font-size:1.05rem}
#dq:focus{outline:2px solid var(--accent);outline-offset:1px}
.dict .umlauts{justify-content:flex-start}
.dres,.dsense{display:flex;flex-direction:column;gap:6px}
.dres:empty{display:none}
.dgroup{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:4px}
.dhit{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.dhit:hover,.dhit:focus-visible{border-color:var(--accent)}
.dhit .dw{min-width:0;overflow-wrap:anywhere;font-size:1.02rem}
.dhit .dfr{grid-column:1;color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.dhit .dmeta{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.dhit .dmeta small{color:var(--muted);font-size:.74rem}
.dsn{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.dsn span{font-weight:700;overflow-wrap:anywhere}
.dsn small{color:var(--muted);font-size:.8rem;font-style:italic;overflow-wrap:anywhere}
.dhit .ddef{grid-column:1;color:var(--muted);font-size:.8rem;font-style:italic;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dnote{margin:-2px 0 2px}
.dsn small b{font-style:normal;font-weight:700}
.fnote{color:var(--muted);font-size:.95rem;margin-top:-6px;max-width:34ch;overflow-wrap:anywhere}
.fnote.cue{font-size:.85rem;margin-top:0}
.fnote.cue b{color:var(--accent);font-weight:700}
.fnote.gram{margin-top:0;font-size:.88rem}
.plprev{margin:-6px 0 0}
.plprev:empty{display:none}
.dhit .dest{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.est{border-style:dashed}
#fEst:empty{display:none}
.dsn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* cas des prépositions */
.word .inote{font-size:.5em;font-weight:500;color:var(--muted);white-space:nowrap}
.pcase{font-size:.6em;font-weight:700;color:var(--muted);white-space:nowrap;vertical-align:.15em}
.prepnote{max-width:34rem;margin:.6rem auto 0;text-align:left;font-size:.95rem;line-height:1.45;color:var(--muted)}
.prepnote p{margin:.25rem 0}
.prepnote b{color:var(--ink)}
.prepnote span{color:var(--ink);font-style:italic}
/* progression */
.progress{display:flex;flex-direction:column;gap:8px;margin-top:-6px}
.progress:empty{display:none}
.pbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.pbar i{display:block;height:100%}
.p-new{background:var(--muted)} .p-learn{background:var(--learn)} .p-rev{background:var(--der)} .p-known{background:var(--ok)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px}
.pk{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:none;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pk i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pk b{color:var(--ink);font-variant-numeric:tabular-nums}
.pk:hover{color:var(--ink)}
/* lettres allemandes */
.umlauts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
form .umlauts{justify-content:flex-start}
.uml{font:inherit;font-weight:700;font-size:1.05rem;min-width:44px;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.uml:active{background:var(--accent);color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{font:inherit;font-weight:700;font-size:.8rem;padding:14px 2px;background:none;border:none;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ===== Habillage rétro-futuriste : fenêtres à biseaux, bandes années 70, police machine pour les étiquettes ===== */
/* bandes 70s réutilisées sur le logo, la barre de titre de la carte et la barre d'onglets */
:root{ --stripes:linear-gradient(180deg,var(--der) 0 25%,var(--die) 25% 50%,var(--das) 50% 75%,var(--learn) 75% 100%);
  --hstripes:linear-gradient(90deg,var(--der) 0 25%,var(--die) 25% 50%,var(--das) 50% 75%,var(--learn) 75%);
  --bevel:inset -2px -2px 0 var(--lo), inset 2px 2px 0 var(--hi);
  --sunken:inset 2px 2px 0 var(--lo), inset -2px -2px 0 var(--hi); }
body{-webkit-tap-highlight-color:transparent}

/* en-tête : logo avec quatre bandes */
header h1{font-style:italic;letter-spacing:-.03em;align-items:center}
header h1::before{content:"";width:22px;height:26px;background:var(--stripes);transform:skewX(-14deg);flex:none;align-self:center}
header h1 .pair{font-family:var(--f-mono);font-style:normal;font-weight:600;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);border-radius:2px;color:var(--ink);background:var(--surface);padding:2px 8px}
.sync{font-family:var(--f-mono);font-size:.7rem}
header h1 button.pair{cursor:pointer;line-height:1.4;box-shadow:var(--bevel),2px 2px 0 var(--ink)}
header h1 button.pair::after{content:" ▾"}
header h1 button.pair:active{transform:translate(2px,2px);box-shadow:var(--sunken)}
.artpick .b-neutral{color:var(--ink)}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:360px}
.level[aria-pressed="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}

/* étiquettes en police machine */
.prompt-label,.stat span,.flabel,.dgroup,.tex .tsense,.packs-head small,.dict-head small,.tbl th,.practice-bar,.dir,.postag,.pill,.stsel,.legend,.pk,.verdict,.cnt,.sess small{font-family:var(--f-mono)}
.prompt-label{letter-spacing:.14em}

/* compteurs façon afficheur */
.stat{border:2px solid var(--ink);border-radius:3px;box-shadow:var(--sunken);background:var(--surface)}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:1.45rem;color:var(--accent)}

/* barre de progression en blocs */
.pbar,.meter,.smeter{border-radius:2px;border:2px solid var(--ink);background:var(--surface);height:12px;box-sizing:border-box}
.pbar{height:14px}
.smeter{margin:4px 0;height:16px;overflow:hidden}
.smeter i,.meter i{border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 9px,transparent 9px 11px)}
.smeter i{top:2px;bottom:2px;left:2px}
.smeter b{display:none}
.pk i{border-radius:1px}

/* la carte = une fenêtre */
.card{position:relative;border:2px solid var(--ink);border-radius:4px;box-shadow:var(--bevel),6px 6px 0 var(--ink);padding:46px 20px 24px;background:var(--surface)}
.card::before{content:"MEMOLEX";position:absolute;left:0;right:0;top:0;height:24px;padding:0 10px;display:flex;align-items:center;
  font:600 .68rem/1 var(--f-mono);letter-spacing:.2em;color:var(--surface);
  background:linear-gradient(90deg,var(--ink) 0 calc(100% - 64px),transparent calc(100% - 64px)),var(--cardbar,var(--hstripes)) right/64px 100% no-repeat,var(--ink);transition:background .2s}
/* la barre de la carte prend la couleur de ce qui se passe : genre du nom, bonne ou mauvaise réponse */
.card.k-der{--cardbar:linear-gradient(var(--der),var(--der))} .card.k-die{--cardbar:linear-gradient(var(--die),var(--die))} .card.k-das{--cardbar:linear-gradient(var(--das),var(--das))}
.card.v-ok{--cardbar:linear-gradient(var(--ok),var(--ok))} .card.v-bad{--cardbar:linear-gradient(var(--bad),var(--bad))}
.card.k-der,.card.k-die,.card.k-das,.card.v-ok,.card.v-bad{box-shadow:var(--bevel),6px 6px 0 var(--tone)}
.card.k-der{--tone:var(--der)} .card.k-die{--tone:var(--die)} .card.k-das{--tone:var(--das)} .card.v-ok{--tone:var(--ok)} .card.v-bad{--tone:var(--bad)}
.card.past::before{content:var(--past-label,"MEMOLEX · DÉJÀ VUE")}
.card.past{border-style:solid;opacity:.97}
.card.empty::before{content:"MEMOLEX · SESSION"}
.answer{border-top:2px dotted var(--line)}

/* encadrés d'exemple : creusés dans la fenêtre */
.tex{border-radius:2px;background:var(--bg);box-shadow:var(--sunken)}
.tex.chunk{border:none;background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.tex .tde mark{text-decoration-color:var(--accent)}
.postag{border-radius:2px;font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}

/* boutons à biseau : ils s'enfoncent quand on appuie */
.btn,.grades button,.artpick button,.size,.level,.chip,.uml,.seg,.dhit,.dsn,.navbtn,.sess{border-radius:3px}
.btn,.grades button,.artpick button,.size,.level,.chip,.uml,.navbtn{border:2px solid var(--ink);box-shadow:var(--bevel),3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s,background-color .12s}
.btn{text-transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.grades button{background:var(--surface)}
.grades .g1{border-top:6px solid var(--bad)} .grades .g4{border-top:6px solid var(--ok)}
.grades .g2{border-top:6px solid var(--learn)} .grades .g3{border-top:6px solid var(--accent)}
.grades button.chosen{outline:none;background:var(--bg);box-shadow:var(--sunken)}
.artpick button{border-color:currentColor;background:var(--surface);box-shadow:var(--bevel),3px 3px 0 currentColor;min-width:72px}
.artpick button:hover{background:var(--surface)}
.artpick .b-case[aria-pressed="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}
.level,.size,.uml{background:var(--surface)}
.level b{font-family:var(--f-mono);font-weight:600}
.size b{font-family:var(--f-mono);font-weight:600}
.size[aria-pressed="true"],.chip[aria-pressed="true"],.level[aria-expanded="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}
.chip{font-family:var(--f-mono);font-weight:600;font-size:.76rem}
.navbtn{background:var(--surface);font-family:var(--f-mono)}
.saybtn{border-radius:3px;border:2px solid var(--ink);background:var(--surface);box-shadow:var(--bevel),2px 2px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.saybtn:active{transform:translate(2px,2px);box-shadow:var(--bevel)}
.tde .saybtn{border-width:1.5px;box-shadow:var(--bevel),1px 1px 0 var(--ink)}
@media (max-width:719px){ .navbtn{top:32px;box-shadow:var(--bevel),2px 2px 0 var(--ink)} }
.btn:active:not(:disabled),.grades button:active,.artpick button:active,.size:active:not(:disabled),.level:active:not(:disabled),.chip:active:not(:disabled),.uml:active,.navbtn:active{transform:translate(3px,3px);box-shadow:var(--sunken)}
.btn:disabled,.chip:disabled,.size:disabled{box-shadow:none;transform:none}
.seg{border:2px solid var(--ink);border-radius:3px;box-shadow:var(--sunken);background:var(--surface)}
.seg button{font-family:var(--f-mono);font-weight:600}
.seg button[aria-pressed="true"]{border-radius:0}
.link{font-family:var(--f-mono);font-size:.74rem}

/* panneaux, listes, formulaires : cadres nets */
.panel,form,.list,.guide section,.packs,.confirm,.dupbox,.lesson,.practice-bar{border-radius:3px;border:2px solid var(--ink)}
.panel,form,.guide section{box-shadow:4px 4px 0 var(--ink)}
.practice-bar{border-style:solid;background:var(--surface)}
.list .item{border-top:1px dashed var(--line)}
.panel h3,form h3,.guide h2{display:flex;align-items:center;gap:8px}
.panel h3::before,form h3::before,.guide h2::before{content:"";width:10px;height:14px;background:var(--stripes);flex:none;transform:skewX(-14deg)}
input,textarea,select,.search,#dq{border-radius:2px;border:2px solid var(--ink);background:var(--surface);box-shadow:var(--sunken)}
.stsel{border-radius:2px}
.pill{border-radius:2px}
.dhit,.dsn{border:2px solid var(--line);background:var(--surface)}
.dhit:hover,.dhit:focus-visible{border-color:var(--ink)}
.advice{border-left:6px solid var(--accent)}
.tbl tr.rec td{background:var(--das-bg)}
code{border-radius:2px;font-family:var(--f-mono)}

/* barre d'onglets façon barre des tâches */
nav.tabs{border-top:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--hi)}
nav.tabs::before{content:"";position:absolute;left:0;right:0;top:-8px;height:6px;background:var(--hstripes)}
nav.tabs .in{gap:6px;padding:6px 0}
nav.tabs button{font-family:var(--f-mono);font-weight:600;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:10px 2px;border:2px solid transparent;border-radius:3px;transition:background-color .12s,color .12s}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--ink);box-shadow:var(--sunken)}
nav.tabs button:active{transform:translateY(1px)}

/* bulle d'information : une petite boîte de dialogue */
.toast{border-radius:3px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--bevel),4px 4px 0 var(--ink);font-family:var(--f-mono);font-size:.78rem;padding:10px 14px 10px 30px}
.toast::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:14px;margin-top:-7px;background:var(--stripes);transform:skewX(-14deg)}

/* ===== mouvements : réservés à qui ne les a pas désactivés ===== */
@media (prefers-reduced-motion:no-preference){
  .card.a-in{animation:cardIn .28s cubic-bezier(.2,.8,.3,1.1)}
  .card.a-from-l{animation:fromL .26s cubic-bezier(.2,.8,.3,1)}
  .card.a-from-r{animation:fromR .26s cubic-bezier(.2,.8,.3,1)}
  .card.a-flip{animation:flip .3s ease-out}
  @keyframes cardIn{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes fromL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fromR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  /* retournement : la carte s'écrase puis se redéploie, comme un écran qui commute */
  @keyframes flip{0%{transform:scaleY(.04);filter:brightness(1.6)}60%{transform:scaleY(1.02)}100%{transform:none;filter:none}}
  .verdict.ok{animation:blink .5s steps(2,end) 2}
  .verdict.bad{animation:shake .38s ease-in-out}
  @keyframes blink{50%{opacity:.2}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .toast:not([hidden]){animation:toastIn .22s cubic-bezier(.2,.8,.3,1.2)}
  @keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  #view.a-view>*{animation:viewIn .2s ease-out}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse .28s ease-out}
  @keyframes pulse{0%{filter:brightness(1.35)}100%{filter:none}}
  .moreex[open]>.tex{animation:viewIn .2s ease-out}
}
/* carte qui s'en va : copie posée par-dessus, glissée à gauche (Encore, Difficile) ou à droite (Bien, Facile) */
.card-ghost{position:fixed;margin:0;z-index:15;pointer-events:none}

#sync{font:inherit;font-family:var(--f-mono);font-size:.7rem;background:none;border:none;padding:4px 0;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px}
#sync::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--muted);flex:none}
#sync[data-state="ok"]::before{background:var(--ok)} #sync[data-state="pend"]::before,#sync[data-state="busy"]::before{background:var(--learn)} #sync[data-state="err"]::before{background:var(--bad)}
#acct{display:flex;flex-direction:column;gap:10px}


/* ---------- mot du jour et notifications ---------- */
.wotd{background:var(--surface);border:2px solid var(--ink);border-radius:3px;box-shadow:var(--bevel),4px 4px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.wt-head{display:flex;justify-content:space-between;align-items:center;font:600 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wt-word{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.2}
.wt-fr{color:var(--muted)}
.wotd .row{margin-top:4px}
.wotd .btn{padding:9px 14px;font-size:.9rem}
.nf-state{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
#nfBtns .btn{padding:9px 14px;font-size:.9rem}
.nf-msg{color:var(--ink)}
/* ---------- stats et série ---------- */
.statsview{display:flex;flex-direction:column;gap:14px}
.panel{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--bevel),5px 5px 0 var(--ink);padding:36px 16px 16px;display:flex;flex-direction:column;gap:10px}
.panel::before{content:"MEMOLEX · STATS";position:absolute;left:0;right:0;top:0;height:22px;padding:0 10px;display:flex;align-items:center;font:600 .64rem/1 var(--f-mono);letter-spacing:.2em;color:var(--surface);background:var(--ink)}
.panel h2{font-size:1.1rem}
.streak{display:flex;flex-direction:column;gap:8px;width:100%}
.streak.compact{background:var(--surface);border:2px solid var(--ink);border-radius:3px;box-shadow:var(--sunken);padding:10px 12px;box-sizing:border-box}
.sk-top{display:flex;align-items:baseline;gap:8px}
.sk-top b{font:600 1.8rem/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.streak.compact .sk-top b{font-size:1.35rem}
.sk-top span{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sk-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sd{font:600 .7rem/1 var(--f-mono);font-style:normal;text-align:center;padding:6px 0;border:2px solid var(--ink);border-radius:2px;color:var(--muted);background:var(--bg)}
.sd-on{background:var(--accent);color:var(--accent-ink)}
.sd-off{background:repeating-linear-gradient(45deg,var(--bg) 0 3px,var(--line) 3px 5px);color:var(--muted)}
.sd-now{border-style:dashed;color:var(--ink)}
.sd-next{opacity:.55}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-bar{flex:1;position:relative;height:14px;border:2px solid var(--ink);border-radius:2px;background:var(--bg);overflow:hidden}
.lv-bar i{position:absolute;left:0;top:0;bottom:0}
.lv-mine{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.lv-known{background:repeating-linear-gradient(90deg,var(--accent) 0 7px,transparent 7px 9px)}
.lv-n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.lv-n b{color:var(--ink)}
.load{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:118px}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.ld i{width:70%;background:var(--accent);border:2px solid var(--ink);border-radius:1px}
.ld b{font:600 .78rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ld span{font:500 .66rem/1 var(--f-mono);text-transform:uppercase;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font:600 2rem/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:.86rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{font:500 .7rem/1 var(--f-mono);font-style:normal;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.cd-h{border:none;padding:2px 0;font-weight:600}
.cd-pad{border:none}
.cd-act{background:color-mix(in srgb,var(--accent) 25%,var(--surface));color:var(--ink)}
.cd-hit{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.cd-next{opacity:.45}
.er{display:flex;align-items:baseline;gap:10px;border-bottom:2px dotted var(--line);padding:6px 0}
.er span{flex:1}
.er b{font:600 1.3rem/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.er small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:96px;text-align:right}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.srow.col{flex-direction:column;align-items:flex-start}
.srow > span{font-weight:700;font-size:.9rem}
.srow .seg{flex-wrap:wrap}
#acct p{margin:0}
</style>
</head>

ice.","shell.version_de_l_appli":"App version","shell.changer_de_langue":"Change language","shell.langue":"Language","shell.a_revoir":"To review","shell.mots":"Words","shell.ou_en_sont_tes_mots":"Where your words stand","shell.tab_review":"Review","shell.tab_list":"My words","shell.tab_add":"Add","shell.tab_stats":"Stats","shell.tab_guide":"Guide","notifState.envoyer_un_test":"Send a test","notifState.couper":"Turn off","notifState.activer_les_notifications":"Turn on notifications","_renderReview.chargement_de_tes_mots":"Loading your words…","dictSearch.deja_dans_tes_mots":"already in your words","dictPick.definition":"Definition:","prepLine.datif_si_l_on_reste":"<b>Dative</b> if you stay in the same place (question <i>wo?</i>): <span lang=\"{0}\">{1}</span>.","prepLine.accusatif_si_l_on_va":"<b>Accusative</b> if you move towards the place (question <i>wohin?</i>): <span lang=\"{0}\">{1}</span>.","guide.it.code_couleur":"\n    <p>The colour of a noun shows its gender:</p>\n    <ul><li><span class=\"g-der art\">il, lo, l'</span> in blue: masculine (<i>il libro</i>, <i>lo zaino</i>, <i>l'amico</i>)</li><li><span class=\"g-die art\">la, l'</span> in red: feminine (<i>la casa</i>, <i>l'amica</i>)</li><li>No colour: verbs, adjectives, adverbs and expressions, which have no article</li></ul>\n    <p>Before a vowel, <i>lo</i> and <i>la</i> become <i>l'</i>: then only the colour tells you the gender. The plural is written in full, with its article: <i>gli amici</i>, <i>le amiche</i>, <i>le città</i> (unchanged).</p>\n    <p class=\"hint\">Linking a colour to the gender helps visual memory, especially for nouns ending in <i>-e</i> (<i>il fiore</i>, <i>la chiave</i>) and for traps (<i>la mano</i>, <i>il problema</i>).</p>","guide.de.code_couleur":"\n    <p>The colour of a noun shows its gender, as in German textbooks:</p>\n    <ul><li><span class=\"g-der art\">der</span> in blue: masculine</li><li><span class=\"g-die art\">die</span> in red: feminine</li><li><span class=\"g-das art\">das</span> in green: neuter</li><li>No colour: verbs, adjectives, adverbs and expressions, which have no article</li></ul>\n    <p>For verbs with a preposition, the case to use is shown after the preposition: <i>warten auf <span class=\"pcase\">(+ Akk.)</span></i>, <i>abhängen von <span class=\"pcase\">(+ Dat.)</span></i>.</p>\n    <p class=\"hint\">Linking a colour to the gender helps visual memory: over time, you'll “see” die Spinne in red.</p>","guide.it.quiz_articles":"<p>In the EN → IT direction, for each noun, choose <span class=\"g-der art\">il</span>, <span class=\"g-der art\">lo</span>, <span class=\"art\">l'</span> or <span class=\"g-die art\">la</span> before seeing the answer (<i>i</i>, <i>gli</i> or <i>le</i> for a noun used only in the plural). A wrong article caps your grade at “Hard”: you only know the word if you know its article too.</p>\n    <p class=\"hint\">Reminder: <i>lo</i> before s + consonant, z, gn, ps, x, y (<i>lo studente</i>, <i>lo zio</i>); <i>l'</i> before a vowel; <i>il</i> elsewhere.</p>","guide.de.quiz_articles":"<p>In the EN → DE direction, for each noun, choose <span class=\"g-der art\">der</span>, <span class=\"g-die art\">die</span> or <span class=\"g-das art\">das</span> before seeing the answer. A wrong article caps your grade at “Hard”: you only know the word if you know its article too.</p>","guide.it.coller_format":"il cane, i cani ; the dog ; example","guide.de.coller_format":"der Hund, -e ; the dog ; example","guide.it.lettres":"<li>The <b>à è é ì ò ù</b> buttons under the fields insert these letters.</li>","guide.de.lettres":"<li>The <b>ä ö ü ß</b> buttons under the fields insert these letters. In the exercises, you can also type <code>ae</code>, <code>oe</code>, <code>ue</code> and <code>ss</code>: they are accepted.</li>","guide.it.dictionnaire":"\n    <p>In <b>Add</b>, type an Italian word (or its English translation): the app finds the word in Memolex's lists, with its article, plural and reviewed translation. Tap a result to fill in the form. Everything works offline, without AI.</p>\n    <p class=\"hint\">The Italian dictionary contains the 8,000 words of the lists. For a missing word, fill in the form yourself: article, plural with its article (<i>gli zaini</i>), translation.</p>","guide.de.dictionnaire":"\n    <p>In <b>Add</b>, type a German word (or its English translation): the app finds the word in Memolex's lists, with its article, plural and reviewed translation. Tap a result to fill in the form. Everything works offline, without AI.</p>\n    <p><b>Estimated level</b> (≈ A1-A2, ≈ B1-B2, ≈ C1+): calculated from how often the word is used in writing and speech. Very frequent words are usually learned early, rare words later. It is an <b>approximation</b>, not the official CEFR ranking: <i>Kühlschrank</i> is a beginner's word, but it is not frequent in texts. In My words, these levels have their own filter, separate from the exact levels.</p>\n    <p class=\"hint\">For now, the German-English dictionary contains the words of the lists already translated into English. For a missing word, fill in the form yourself: article, plural, translation. If you type in English, reverse search works from 3 letters.</p>\n    <p class=\"hint\">Sources: genders and plurals from the German-French dictionary <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> (2022 edition) and the <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a> project, both drawn from <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a>; results ranked by frequency of use thanks to <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. Licences <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> and <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>. English translations written for Memolex.</p>","guide.it.phrase_soulignee":"<i>Siamo <u>andati</u> al mare</i> for <i>andare</i>, <i>le <u>case</u></i> for <i>la casa</i>.","guide.de.phrase_soulignee":"<i>Ich <u>stehe</u> um sechs Uhr <u>auf</u></i> for <i>aufstehen</i>, <i>die <u>Häuser</u></i> for <i>das Haus</i>.","guide.it.phrase_par_sens":"<i>stanza</i>: “room” and “bedroom”","guide.de.phrase_par_sens":"<i>um</i>: “around” and “at (time)”","guide.it.meme_traduction":"<i>there</i>: <i>lì</i> and <i>là</i>; <i>quickly</i>: <i>presto</i> and <i>velocemente</i>…","guide.de.meme_traduction":"<i>there</i>: <i>da</i> and <i>dort</i>; <i>why</i>: <i>warum</i>, <i>wieso</i>…","guide.it.sources":"<p class=\"hint\">Italian lists built for Memolex: frequency of use from <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a> (R. Speer, licence <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>), grammatical analysis of the sentences with <a href=\"https://spacy.io/models/it\" target=\"_blank\" rel=\"noopener\">spaCy</a> (it_core_news_lg model); translations, articles and plurals reviewed for Memolex.</p>","guide.de.sources":"<p class=\"hint\">German lists built for Memolex: genders and plurals from the dictionary <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> and the <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a> project, drawn from <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a> (licences <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> and <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>); frequency of use: <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. French articles and parts of speech: <a href=\"http://www.lexique.org/\" target=\"_blank\" rel=\"noopener\">Lexique 3.83</a> (B. New, C. Pallier, licence <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>). English translations written for Memolex.</p>","guide.it.mots_peu_frequents":"<i>frigorifero</i>, <i>spazzolino</i>","guide.de.mots_peu_frequents":"<i>Kühlschrank</i>, <i>Zahnbürste</i>","guide.de.exemple_article":"die Geduld","guide.it.exemple_article":"la pazienza","renderGuide.compte_et_synchronisation":"Account and sync","renderGuide.installer_l_appli":"Install the app","renderGuide.android_chrome_menu_installer_l":"<b>Android (Chrome)</b>: menu ⋮ → <b>Install app</b> (or “Add to Home screen”).","renderGuide.iphone_safari_bouton_partager_sur":"<b>iPhone (Safari)</b>: Share button → <b>Add to Home Screen</b>.","renderGuide.une_fois_installee_memolex_s":"Once installed, Memolex opens like an app and works offline. The dictionary downloads the first time you open it.","renderGuide.le_principe":"The principle","renderGuide.l_appli_utilise_la_repetition":"The app uses <b>spaced repetition</b>: each word comes back just before you forget it. A well-known word is spaced out more and more (1 day, 3 days, a week, a month…). A missed word comes back quickly. So you spend your time on what resists, not on what you already know.","renderGuide.la_cle_chercher_activement_le":"The key: <b>actively search</b> for the word before turning the card over. It's the effort of recall that fixes the memory, not rereading.","renderGuide.les_sessions":"Sessions","renderGuide.avant_chaque_session_choisis_20":"Before each session, choose 20, 40 or 60 cards. Allow about 10 seconds per card. You can do as many sessions in a row as you like.","renderGuide.contenu_d_une_session_d":"<b>What's in a session</b>: first the words to review (learning, then today's reviews), then new words to fill it up. If there are 15 words to review and you choose 40 cards, you'll get 15 reviews and 25 new words.","renderGuide.un_nouveau_mot_passe_3":"<b>A new word</b> comes up 3 times: when you first see it, about 15 minutes later, then about 3 hours later. After that it is scheduled in days (tomorrow, then 3 days, a week…).","renderGuide.pas_de_limite_de_nouveaux":"<b>No limit on new words</b>: you set the pace. Each new word comes back about 5 times in the first month, so lots of new words today means lots of reviews in the coming days.","renderGuide.une_session_longue_d_un":"One long session in one go sticks less well than several short ones: 20 cards in the morning, 20 at lunchtime and 20 in the evening are better than 60 in a row.","renderGuide.reviser_quand_meme_quand_il":"<b>Review anyway</b>: when there's nothing to review, free practice lets you go over your words without waiting. Your answers aren't saved there and don't change your schedule.","renderGuide.arreter_chaque_reponse_est_enregistree":"<b>Stop</b>: each answer is saved as soon as you give your grade. You can stop a session at any time without losing anything. If the app closes in the middle of a session (call, battery, phone put down), it offers to <b>resume where you left off</b> when you come back, even hours later. “Stop” ends the session for good.","renderGuide.revenir_en_arriere_la_fleche":"<b>Go back</b>: the ‹ arrow to the left of the card takes you back to cards already seen, with the answer shown and your grade highlighted. Choose another grade to correct it, or move forward with the › arrow to the current card. There's no › arrow on a card you haven't answered yet: you can't skip a card.","renderGuide.ecarter_les_mots_que_tu":"Setting aside words you know","renderGuide.les_listes_commencent_par_les":"The lists start with the most frequent words, which you may already know. Two ways to set them aside:","renderGuide.je_connais_deja_sous_un":"<b>I already know it</b>, under a new word during the session, once the answer is shown: you first check that you really knew it.","renderGuide.trier_mes_nouveaux_mots_avant":"<b>Sort my new words</b>, before the session: each word appears with its translation, and you answer “I already know it” or “To learn”. 100 words take 2 or 3 minutes to sort.","renderGuide.un_mot_ecarte_n_est":"A word set aside isn't deleted: it comes back once in a month to check. If you know it, it's spaced out further. To remove it for good, delete it in My words.","renderGuide.dans_l_onglet_stats_activer":"In the Stats tab, “Turn on notifications” asks your phone for permission. You need to be signed in to sync: the server sends the notifications, even when the app is closed.","renderGuide.les_rappels_matin_midi_soir":"Reminders (morning, lunchtime, evening, as you choose) only arrive if you haven't done your daily minimum of cards yet. The word of the day is a word from A1 to C2 that you don't have yet; the notification's “Add” button puts it in your words, first among the new ones.","renderGuide.sur_iphone_les_notifications_ne":"On iPhone, notifications only work if the app is added to the home screen.","renderGuide.la_serie_et_les_statistiques":"Streak and statistics","renderGuide.une_journee_compte_dans_ta":"A day counts towards your streak when you answer at least 10 cards in a session (adjustable: 5, 10, 20 or 30). Free practice doesn't count.","renderGuide.l_objectif_est_de_5":"The goal is 5 days out of 7 by default: each week (Monday to Sunday) therefore gives you 2 jokers. The streak only breaks if you miss more days than you have jokers in the same week. You can change the goal or turn off the streak in the Stats tab.","renderGuide.l_onglet_stats_montre_les":"The Stats tab shows words learned by level, reviews over the next 7 days, your success rate on mature words (interval of 21 days or more), your active days this month and your error rate on article and case. Only your first answer to each card in a session counts. You choose which statistics are shown.","renderGuide.une_traduction_te_parait_fausse":"Does a translation look wrong, or an example sentence odd or shocking? Once the answer is shown, tap <b>⚑ Report an error</b> at the bottom of the card, choose the reason and add a comment if you like. The report includes the card as you see it. It's sent even without an account; offline, it waits for the next connection. Each reported error is corrected in the lists for all words of the same kind, not just for this card.","renderGuide.la_prononciation":"Pronunciation","renderGuide.touche_a_cote_d_un":"Tap <b>🔊</b> next to a word, a “Remember” phrase or an example sentence to hear it. A noun is read with its article (“{0}”): hearing the article with the word helps you remember the gender. It's your phone's synthetic voice: fine for common words, sometimes approximate on rare or very long words.","renderGuide.dans_le_sens_langue_francais":"In the language → English direction, the word can be read on the front: good listening practice. In the English → language direction, it's only read on the back, so as not to give away the answer. Stats tab, Settings: <b>Autoplay</b> (the word is read as soon as it appears), normal or slow <b>Speed</b>, or turn pronunciation off.","renderGuide.pour_progresser_vraiment_repete_le":"To really make progress, repeat the word out loud right after the voice, with the same intonation: this is the <i>shadowing</i> technique. If no voice speaks, install the language in your phone's text-to-speech settings (Android: Accessibility → Text-to-speech).","renderGuide.les_sons":"Sounds","renderGuide.chaque_geste_a_son_petit":"Each action has its little sound: the card turning over, a rising note for “Good” and “Easy”, a lower note for “Again” and “Hard”, a signal when the article or case is wrong, a chord at the end of the session. They stay discreet and follow the phone's volume (nothing in silent mode on iPhone). To turn them off: Stats tab, Settings, “Sounds”.","renderGuide.les_quatre_notes":"The four grades","renderGuide.tu_ne_savais_pas_son":"You didn't know it. Its interval starts again from zero and the card comes back at the end of the session: once all the other cards are done, the app announces the <b>reinforcement</b> and goes back over your “Again” cards. Each word comes back at most 3 times in a session: beyond that, repeating doesn't help much, spacing is better. The word waits for you in your next session.","renderGuide.trouve_avec_peine_l_intervalle":"Found with difficulty. The interval grows a little.","renderGuide.trouve_normalement_la_note_par":"Found normally. The default grade, the one used most.","renderGuide.immediat_l_intervalle_s_allonge":"Instant. The interval grows a lot.","renderGuide.sois_honnete_noter_bien_un":"Be honest: grading “Good” a word you hesitated over means it comes back too late.","renderGuide.le_code_couleur":"The colour code","renderGuide.le_quiz_des_articles":"The article quiz","renderGuide.ajouter_et_retirer_des_mots":"Adding and removing words","renderGuide.listes_par_niveau_les_8":"<b>Lists by level</b>: the 8,000 most frequent words, from A1 to C2, added 50 at a time. The first A1 words are the most used in the language.","renderGuide.coller_une_liste_une_ligne":"<b>Paste a list</b>: one line per word, <code>{0}</code>.","renderGuide.garde_fou_au_dela_de":"<b>Safeguard</b>: beyond 50 words in progress (new, learning or in review), bulk additions (level packs, lessons, pasted list) stop. A word frees its place when it becomes “Learned” (3-week interval) or when you sort it as “I already know it”. Adding one word at a time (form, dictionary, word of the day) is always possible.","renderGuide.pour_annuler_un_import_mes":"To undo an import: <b>My words → Remove a batch</b>. Words already started are kept.","renderGuide.le_dictionnaire":"The dictionary","renderGuide.les_phrases_d_exemple":"Example sentences","renderGuide.quand_tu_retournes_une_carte":"When you turn a card over, a word from the lists comes with a <b>real sentence</b> in {0}, with its translation. The word is underlined, in the form it takes in the sentence: {1}","renderGuide.une_phrase_par_sens_si":"<b>One sentence per sense</b>: if a word has several translations, each has its own sentence, with the sense shown above it ({0}).","renderGuide.les_phrases_sont_choisies_courtes":"Sentences are chosen to be short, with words that are rather more frequent than the word being learned, and preferably written by native speakers.","renderGuide.lis_la_phrase_a_voix":"<b>Read the sentence out loud</b> before grading the card: a few more seconds, but the word sticks with its grammar.","renderGuide.si_tu_as_ecrit_ton":"If you wrote your own example for a word, that's the one shown.","renderGuide.les_mots_qui_ont_la":"Words with the same translation","renderGuide.quand_plusieurs_de_tes_mots":"When several of your words have the same translation ({0}), the card gives you a hint: the first letter and the number of letters of the expected word. On the back, the other words with the same translation are shown, so you learn to tell them apart.","renderGuide.si_tu_as_trouve_un":"If you found another word from the list, it isn't wrong: grade it “Hard” and look at the difference in usage in the example sentence.","renderGuide.credits":"Credits","renderGuide.les_phrases_d_exemple_et":"The example sentences and their translations come from <a href=\"https://tatoeba.org/en\" target=\"_blank\" rel=\"noopener\">Tatoeba</a>, a collection of sentences written by volunteers, and are distributed under the <a href=\"https://creativecommons.org/licenses/by/2.0/fr/deed.en\" target=\"_blank\" rel=\"noopener\">CC BY 2.0 FR</a> licence.","renderGuide.quelques_phrases_qui_precisent_la":"A few sentences, which clarify the nuance between two words with the same translation, were written for Memolex; they have no Tatoeba number. When Tatoeba has no English translation of a sentence, the translation was written for Memolex.","renderGuide.les_expressions_a_retenir_une":"The “Remember” phrases (one per card, on the back) are written for Memolex: they show the word's most common use, with its usual complements.","renderGuide.voir_les_auteurs_des_phrases":"See the sentences' authors","renderGuide.les_listes_par_niveau":"Lists by level","renderGuide.les_listes_suivent_la_frequence":"The lists follow <b>frequency of use</b>: a word that is very common in writing and speech comes early, a rare word later. It's the most efficient way to start, because the few hundred most frequent words cover most of what you read and hear every day.","renderGuide.niveau":"Level","renderGuide.rang_de_frequence":"Frequency rank","renderGuide.a1_decouverte":"A1 · Breakthrough","renderGuide.a2_survie":"A2 · Waystage","renderGuide.b1_seuil":"B1 · Threshold","renderGuide.b2_avance":"B2 · Vantage","renderGuide.c1_autonome":"C1 · Advanced","renderGuide.c2_maitrise":"C2 · Mastery","renderGuide.ces_tranches_sont_une_approximation":"These bands are an <b>approximation</b> of the Common European Framework, not its official ranking. Useful words that are not frequent in writing ({0}) come later than in a textbook: add them yourself with the dictionary when you need them.","renderGuide.combien_de_nouveaux_mots_par":"How many new words per day?","renderGuide.une_fois_le_rythme_installe":"Once the pace is set (after 3 or 4 weeks), your daily review load is proportional to the number of words you discover each day:","renderGuide.nouveaux_mots_jour":"New words / day","renderGuide.temps_quotidien_estime":"Estimated daily time","renderGuide.mots_appris_en_3_mois":"Words learned in 3 months","renderGuide.estimations_pour_environ_10_secondes":"Estimates for about 10 seconds per card. The real time depends on your speed and success rate.","renderGuide.le_conseil":"<b>Our advice</b>","renderGuide.sur_un_niveau_facile_pour":"On a level that's easy for you, sort your packs then move fast: known words disappear and you don't waste time. On a new level, start with <b>10 new words per day</b> (the default setting, in Stats → Settings) and go up to 15 or 20 only if your sessions stay comfortable. The app never goes beyond that number in a day, even if you choose a 60-card session: the rest of the session is made of reviews. If your sessions fill up with reviews to the point of leaving no room for new words, it's the signal to slow down: a pace kept up for six months is better than a two-week sprint.","renderGuide.les_compteurs":"The counters","renderGuide.a_revoir_les_mots_a":"<b>To review</b>: the words to review now (learning and today's reviews).","renderGuide.mots_tout_ton_vocabulaire_ajoute":"<b>Words</b>: all the vocabulary you've added, seen or not yet.","renderGuide.la_barre_sous_les_compteurs":"<b>The bar under the counters</b> shows where your words stand: <b>New</b> (added, never seen), <b>Learning</b> (from session to session), <b>In review</b> (scheduled in days), <b>Learned</b> (interval of more than 3 weeks). Tap a category to see its words.","renderGuide.acquis_les_mots_dont_l":"<b>Learned</b>: words whose interval is more than 3 weeks. It's the real indicator of progress.","head.la_definition_en_en_italique":"The definition in {0}, in italics, helps you choose the right one.","streakHTML.jour_cartes":"{0}: {1} {1:one=card|other=cards}","parts.nouveaux":"{0} new {0:one=word|other=words}","renderLangPick.mots":"{0} {1:one=word|other=words}","pend.synchronisation":"Syncing…","dictStatus.indisponible":"Unavailable","case.Akk":"Accusative","case.Dat":"Dative","case.Gen":"Genitive","case.need.Akk":"the accusative was needed","case.need.Dat":"the dative was needed","case.need.Gen":"the genitive was needed","case.need.plusieurs":"{0} was needed","case.et":" and ","lang.de.name":"German","lang.de.adj":"German","la
