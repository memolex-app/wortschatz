<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memolex</title>
<meta name="theme-color" content="#1c1a2b">
<meta name="description" content="Vocabulaire allemand et italien depuis le français, par répétition espacée, hors ligne.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : une colonne étroite, pensée téléphone ; la carte est une « fenêtre » d'ordinateur 1980, onglets en bas comme une barre des tâches */
:root{
  --bg:#e6e0d0; --surface:#f8f4e8; --ink:#1c1a2b; --muted:#5d586b; --line:#b9b1a0;
  --hi:#ffffff; --lo:#9a927f;
  --accent:#1d5f6b; --accent-ink:#ffffff;
  --der:#2353b8; --die:#c3302c; --das:#257a36;
  --der-bg:#dfe6f6; --die-bg:#f7e1dd; --das-bg:#dcefdc;
  --ok:#257a36; --bad:#c3302c; --learn:#b06a08;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131f; --surface:#221f31; --ink:#f1e8d3; --muted:#a8a1b6; --line:#3d3952;
  --hi:#3f3a58; --lo:#08070d;
  --accent:#4ec2bd; --accent-ink:#15131f;
  --der:#7fa6ff; --die:#ff8478; --das:#72d08a;
  --der-bg:#1d2a4c; --die-bg:#43201f; --das-bg:#18372a;
  --ok:#72d08a; --bad:#ff8478; --learn:#f0b44c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131f; --surface:#221f31; --ink:#f1e8d3; --muted:#a8a1b6; --line:#3d3952;
  --hi:#3f3a58; --lo:#08070d;
  --accent:#4ec2bd; --accent-ink:#15131f;
  --der:#7fa6ff; --die:#ff8478; --das:#72d08a;
  --der-bg:#1d2a4c; --die-bg:#43201f; --das-bg:#18372a;
  --ok:#72d08a; --bad:#ff8478; --learn:#f0b44c; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 96px;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1 .pair{font-family:var(--f-body);font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sync{font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* review */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;box-shadow:0 6px 24px -14px rgba(20,30,60,.35)}
.prompt-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.postag{display:inline-block;margin-top:.5rem;padding:.1rem .55rem;border:1px solid var(--line, currentColor);border-radius:999px;font-size:.75rem;font-style:italic;color:var(--muted)}
.word{font-family:var(--f-display);font-size:clamp(1.8rem,8vw,2.6rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.art{font-weight:800}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}
.plural{color:var(--muted);font-size:1rem}
.example{font-style:italic;color:var(--muted);max-width:40ch;overflow-wrap:anywhere}
.tex{display:flex;flex-direction:column;gap:2px;max-width:40ch;margin-top:6px;padding:10px 14px;border-radius:12px;background:var(--bg);text-align:left;width:100%;box-sizing:border-box}
.tex .tde{margin:0;font-size:1.02rem;overflow-wrap:anywhere}
.tex .tde mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.tex .tsense{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tex.chunk{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.tex.chunk .tde{font-weight:600}
.tex.own .tde{font-size:.95rem}
.moreex{width:100%;max-width:40ch;margin-top:6px}
.moreex>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px;min-height:44px;box-sizing:border-box;color:var(--muted);font-size:.85rem;border-radius:12px;-webkit-tap-highlight-color:transparent}
.moreex>summary::-webkit-details-marker{display:none}
.moreex>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.moreex .chev{display:inline-block;font-size:1.2rem;line-height:1;transform:translateY(-3px);transition:transform .2s}
.moreex[open] .chev{transform:rotate(180deg) translateY(-3px)}
.tex .tfr{margin:0;color:var(--muted);font-size:.9rem;font-style:italic;overflow-wrap:anywhere}
.credits{max-height:320px;overflow-y:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.guide details summary{cursor:pointer;font-weight:700;color:var(--accent)}
.answer{display:flex;flex-direction:column;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.verdict{font-weight:700;font-size:.9rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.artpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.artpick button{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding:10px 18px;border-radius:999px;border:2px solid currentColor;background:transparent;cursor:pointer}
.artpick .b-der{color:var(--der)} .artpick .b-die{color:var(--die)} .artpick .b-das{color:var(--das)}
.artpick button:hover{background:var(--bg)}
.casepick{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.casepick .prompt-label{text-align:center}
.artpick .b-case{color:var(--accent);font-size:.95rem;padding:10px 14px}
.artpick .b-case[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.casepick .btn[disabled]{opacity:.45;cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-weight:400;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.grades .g1{border-color:var(--bad)} .grades .g4{border-color:var(--ok)}
.btn{font:inherit;font-weight:700;padding:13px 18px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dir{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;padding:6px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{color:var(--ink);font-size:1.3rem}

/* list */
.search{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:none}
.item .de{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .fr{color:var(--muted);font-size:.92rem;min-width:0;overflow-wrap:anywhere;grid-column:1}
.item .meta{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.new{background:var(--der-bg);color:var(--der)} .pill.known{background:var(--das-bg);color:var(--das)}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer;padding:0;text-decoration:underline}
.link.danger{color:var(--bad)}

/* levels */
.panel{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.level{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.level b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;color:var(--accent);line-height:1.1}
.level span{font-weight:700;font-size:.9rem}
.level small{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.level .meter{display:block;width:100%;margin-top:6px;height:5px}
.level:hover:not(:disabled){border-color:var(--accent)}
.level:disabled{opacity:.55;cursor:default}
.empty .levels{max-width:360px}
.levels-wrap{display:flex;flex-direction:column;gap:12px;width:100%}
.empty .levels-wrap{max-width:360px;align-items:stretch}
.level[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.packs{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.packs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.packs-head b{font-family:var(--f-display);font-size:1.05rem}
.packs-head small{color:var(--muted);font-size:.78rem}
.packs .btn{align-self:flex-start}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--accent)}
.confirm p{margin:0}
.dupbox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--accent);text-align:left}
.dupbox p{margin:0}
.dupitem{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.dupitem .de{font-weight:700}
.dupitem small{color:var(--muted);font-size:.78rem}
.meter{position:relative;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
/* barre de session : le remplissage suit la carte affichée, la boule reste sur la carte en cours */
.smeter{position:relative;height:6px;background:var(--line);border-radius:999px;margin:4px 6px}
.smeter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:999px;transition:width .2s}
.smeter b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ok);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ok)}
.sizes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;max-width:380px}
.sizes .size{flex:1 1 80px;max-width:110px}
.size:disabled{opacity:.35;cursor:not-allowed}
.size:disabled small{font-size:.66rem}
.size{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.size b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.size small{color:var(--muted);font-size:.72rem;white-space:nowrap}
.size[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.size[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.size:disabled{opacity:.4;cursor:default}
.dir small.hint{font-size:.76rem}
/* lessons & chips */
.lesson{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lesson-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lesson-head b{font-family:var(--f-display);font-size:1.1rem}
.lesson-head small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.chip{font:inherit;font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled,.btn:disabled{opacity:.5;cursor:default}
.pill.lvl{background:transparent;border:1px solid var(--line);font-weight:700}
.stsel{width:auto;font:inherit;font-size:.74rem;font-weight:700;padding:3px 24px 3px 10px;border-radius:999px;border:1px solid var(--line);background-color:var(--bg);color:var(--muted);cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.stsel.st-new{background-color:var(--der-bg);color:var(--der);border-color:transparent}
.stsel.st-known{background-color:var(--das-bg);color:var(--das);border-color:transparent}
.stsel.st-learn{color:var(--learn)}
.item .meta .when{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* filters & legend */
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:10px;align-items:baseline}
.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;min-width:56px}
.chip .cnt{font-weight:400;opacity:.7;margin-left:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-der{background:var(--der)} .d-die{background:var(--die)} .d-das{background:var(--das)} .d-none{background:var(--ink)}
.item .src{font-size:.78rem;opacity:.75}
/* guide */
.guide{display:flex;flex-direction:column;gap:14px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.guide h2{font-size:1.15rem;font-weight:700}
.guide p{margin:0;max-width:65ch}
.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.grades-doc{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.grades-doc dt{font-weight:700}
.grades-doc dt.bad{color:var(--bad)} .grades-doc dt.good{color:var(--ok)}
.grades-doc dd{margin:0;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tbl tr.rec td{background:var(--das-bg);font-weight:700}
.advice{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.advice b:first-child{font-family:var(--f-display);color:var(--accent)}
/* sessions */
.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sess{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.sess b{font-family:var(--f-display);font-size:1.1rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted)}
.sess span{font-weight:700;font-size:.82rem}
.sess small{font-size:.72rem;color:var(--muted)}
.sess.done b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sess.now{border-color:var(--accent)}
.sess.now b{border-color:var(--accent);color:var(--accent)}
.sess.todo{opacity:.6}
/* end-of-day & practice */
.more{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.more .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.more .btn small{font-weight:400;font-size:.78rem;opacity:.8}
.grades.two-col{grid-template-columns:1fr 1fr}
.cardnav{position:relative}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:2rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* téléphone : les flèches vont dans les coins hauts de la carte, zone vide, pour ne jamais couvrir le texte */
.navbtn.prev{left:8px} .navbtn.next{right:8px}
@media (max-width:719px){ .navbtn{top:8px;transform:none;width:40px;height:40px;font-size:1.6rem;box-shadow:none} }
.navbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:720px){ .navbtn.prev{left:-62px} .navbtn.next{right:-62px} }
.card.past{border-style:dashed}
.grades button.chosen{outline:3px solid var(--ink);outline-offset:1px}
.practice-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.practice-bar b{color:var(--accent)}
/* batches */
.batches summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;list-style:none;flex-wrap:wrap}
.batches summary::-webkit-details-marker{display:none}
.batches summary b{font-family:var(--f-display)}
.batches[open] summary{margin-bottom:4px}
.batch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.batch div{display:flex;flex-direction:column;min-width:0}
.batch small{color:var(--muted);font-size:.78rem}
/* forms */
form{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}
input,textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:140px;resize:vertical;font-size:.92rem}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.85em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}

/* dictionnaire */
.dict-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dict-head small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
#dq{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;font-size:1.05rem}
#dq:focus{outline:2px solid var(--accent);outline-offset:1px}
.dict .umlauts{justify-content:flex-start}
.dres,.dsense{display:flex;flex-direction:column;gap:6px}
.dres:empty{display:none}
.dgroup{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:4px}
.dhit{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.dhit:hover,.dhit:focus-visible{border-color:var(--accent)}
.dhit .dw{min-width:0;overflow-wrap:anywhere;font-size:1.02rem}
.dhit .dfr{grid-column:1;color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.dhit .dmeta{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.dhit .dmeta small{color:var(--muted);font-size:.74rem}
.dsn{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.dsn span{font-weight:700;overflow-wrap:anywhere}
.dsn small{color:var(--muted);font-size:.8rem;font-style:italic;overflow-wrap:anywhere}
.dhit .ddef{grid-column:1;color:var(--muted);font-size:.8rem;font-style:italic;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dnote{margin:-2px 0 2px}
.dsn small b{font-style:normal;font-weight:700}
.fnote{color:var(--muted);font-size:.95rem;margin-top:-6px;max-width:34ch;overflow-wrap:anywhere}
.fnote.cue{font-size:.85rem;margin-top:0}
.fnote.cue b{color:var(--accent);font-weight:700}
.fnote.gram{margin-top:0;font-size:.88rem}
.plprev{margin:-6px 0 0}
.plprev:empty{display:none}
.dhit .dest{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.est{border-style:dashed}
#fEst:empty{display:none}
.dsn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* cas des prépositions */
.word .inote{font-size:.5em;font-weight:500;color:var(--muted);white-space:nowrap}
.pcase{font-size:.6em;font-weight:700;color:var(--muted);white-space:nowrap;vertical-align:.15em}
.prepnote{max-width:34rem;margin:.6rem auto 0;text-align:left;font-size:.95rem;line-height:1.45;color:var(--muted)}
.prepnote p{margin:.25rem 0}
.prepnote b{color:var(--ink)}
.prepnote span{color:var(--ink);font-style:italic}
/* progression */
.progress{display:flex;flex-direction:column;gap:8px;margin-top:-6px}
.progress:empty{display:none}
.pbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.pbar i{display:block;height:100%}
.p-new{background:var(--muted)} .p-learn{background:var(--learn)} .p-rev{background:var(--der)} .p-known{background:var(--ok)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px}
.pk{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:none;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pk i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pk b{color:var(--ink);font-variant-numeric:tabular-nums}
.pk:hover{color:var(--ink)}
/* lettres allemandes */
.umlauts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
form .umlauts{justify-content:flex-start}
.uml{font:inherit;font-weight:700;font-size:1.05rem;min-width:44px;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.uml:active{background:var(--accent);color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{font:inherit;font-weight:700;font-size:.8rem;padding:14px 2px;background:none;border:none;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ===== Habillage rétro-futuriste : fenêtres à biseaux, bandes années 70, police machine pour les étiquettes ===== */
/* bandes 70s réutilisées sur le logo, la barre de titre de la carte et la barre d'onglets */
:root{ --stripes:linear-gradient(180deg,var(--der) 0 25%,var(--die) 25% 50%,var(--das) 50% 75%,var(--learn) 75% 100%);
  --hstripes:linear-gradient(90deg,var(--der) 0 25%,var(--die) 25% 50%,var(--das) 50% 75%,var(--learn) 75%);
  --bevel:inset -2px -2px 0 var(--lo), inset 2px 2px 0 var(--hi);
  --sunken:inset 2px 2px 0 var(--lo), inset -2px -2px 0 var(--hi); }
body{-webkit-tap-highlight-color:transparent}

/* en-tête : logo avec quatre bandes */
header h1{font-style:italic;letter-spacing:-.03em;align-items:center}
header h1::before{content:"";width:22px;height:26px;background:var(--stripes);transform:skewX(-14deg);flex:none;align-self:center}
header h1 .pair{font-family:var(--f-mono);font-style:normal;font-weight:600;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);border-radius:2px;color:var(--ink);background:var(--surface);padding:2px 8px}
.sync{font-family:var(--f-mono);font-size:.7rem}
header h1 button.pair{cursor:pointer;line-height:1.4;box-shadow:var(--bevel),2px 2px 0 var(--ink)}
header h1 button.pair::after{content:" ▾"}
header h1 button.pair:active{transform:translate(2px,2px);box-shadow:var(--sunken)}
.artpick .b-neutral{color:var(--ink)}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:360px}
.level[aria-pressed="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}

/* étiquettes en police machine */
.prompt-label,.stat span,.flabel,.dgroup,.tex .tsense,.packs-head small,.dict-head small,.tbl th,.practice-bar,.dir,.postag,.pill,.stsel,.legend,.pk,.verdict,.cnt,.sess small{font-family:var(--f-mono)}
.prompt-label{letter-spacing:.14em}

/* compteurs façon afficheur */
.stat{border:2px solid var(--ink);border-radius:3px;box-shadow:var(--sunken);background:var(--surface)}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:1.45rem;color:var(--accent)}

/* barre de progression en blocs */
.pbar,.meter,.smeter{border-radius:2px;border:2px solid var(--ink);background:var(--surface);height:12px;box-sizing:border-box}
.pbar{height:14px}
.smeter{margin:4px 0;height:16px;overflow:hidden}
.smeter i,.meter i{border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 9px,transparent 9px 11px)}
.smeter i{top:2px;bottom:2px;left:2px}
.smeter b{display:none}
.pk i{border-radius:1px}

/* la carte = une fenêtre */
.card{position:relative;border:2px solid var(--ink);border-radius:4px;box-shadow:var(--bevel),6px 6px 0 var(--ink);padding:46px 20px 24px;background:var(--surface)}
.card::before{content:"MEMOLEX";position:absolute;left:0;right:0;top:0;height:24px;padding:0 10px;display:flex;align-items:center;
  font:600 .68rem/1 var(--f-mono);letter-spacing:.2em;color:var(--surface);
  background:linear-gradient(90deg,var(--ink) 0 calc(100% - 64px),transparent calc(100% - 64px)),var(--cardbar,var(--hstripes)) right/64px 100% no-repeat,var(--ink);transition:background .2s}
/* la barre de la carte prend la couleur de ce qui se passe : genre du nom, bonne ou mauvaise réponse */
.card.k-der{--cardbar:linear-gradient(var(--der),var(--der))} .card.k-die{--cardbar:linear-gradient(var(--die),var(--die))} .card.k-das{--cardbar:linear-gradient(var(--das),var(--das))}
.card.v-ok{--cardbar:linear-gradient(var(--ok),var(--ok))} .card.v-bad{--cardbar:linear-gradient(var(--bad),var(--bad))}
.card.k-der,.card.k-die,.card.k-das,.card.v-ok,.card.v-bad{box-shadow:var(--bevel),6px 6px 0 var(--tone)}
.card.k-der{--tone:var(--der)} .card.k-die{--tone:var(--die)} .card.k-das{--tone:var(--das)} .card.v-ok{--tone:var(--ok)} .card.v-bad{--tone:var(--bad)}
.card.past::before{content:"MEMOLEX · DÉJÀ VUE"}
.card.past{border-style:solid;opacity:.97}
.card.empty::before{content:"MEMOLEX · SESSION"}
.answer{border-top:2px dotted var(--line)}

/* encadrés d'exemple : creusés dans la fenêtre */
.tex{border-radius:2px;background:var(--bg);box-shadow:var(--sunken)}
.tex.chunk{border:none;background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.tex .tde mark{text-decoration-color:var(--accent)}
.postag{border-radius:2px;font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}

/* boutons à biseau : ils s'enfoncent quand on appuie */
.btn,.grades button,.artpick button,.size,.level,.chip,.uml,.seg,.dhit,.dsn,.navbtn,.sess{border-radius:3px}
.btn,.grades button,.artpick button,.size,.level,.chip,.uml,.navbtn{border:2px solid var(--ink);box-shadow:var(--bevel),3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s,background-color .12s}
.btn{text-transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.grades button{background:var(--surface)}
.grades .g1{border-top:6px solid var(--bad)} .grades .g4{border-top:6px solid var(--ok)}
.grades .g2{border-top:6px solid var(--learn)} .grades .g3{border-top:6px solid var(--accent)}
.grades button.chosen{outline:none;background:var(--bg);box-shadow:var(--sunken)}
.artpick button{border-color:currentColor;background:var(--surface);box-shadow:var(--bevel),3px 3px 0 currentColor;min-width:72px}
.artpick button:hover{background:var(--surface)}
.artpick .b-case[aria-pressed="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}
.level,.size,.uml{background:var(--surface)}
.level b{font-family:var(--f-mono);font-weight:600}
.size b{font-family:var(--f-mono);font-weight:600}
.size[aria-pressed="true"],.chip[aria-pressed="true"],.level[aria-expanded="true"]{box-shadow:var(--sunken);transform:translate(3px,3px)}
.chip{font-family:var(--f-mono);font-weight:600;font-size:.76rem}
.navbtn{background:var(--surface);font-family:var(--f-mono)}
@media (max-width:719px){ .navbtn{top:32px;box-shadow:var(--bevel),2px 2px 0 var(--ink)} }
.btn:active:not(:disabled),.grades button:active,.artpick button:active,.size:active:not(:disabled),.level:active:not(:disabled),.chip:active:not(:disabled),.uml:active,.navbtn:active{transform:translate(3px,3px);box-shadow:var(--sunken)}
.btn:disabled,.chip:disabled,.size:disabled{box-shadow:none;transform:none}
.seg{border:2px solid var(--ink);border-radius:3px;box-shadow:var(--sunken);background:var(--surface)}
.seg button{font-family:var(--f-mono);font-weight:600}
.seg button[aria-pressed="true"]{border-radius:0}
.link{font-family:var(--f-mono);font-size:.74rem}

/* panneaux, listes, formulaires : cadres nets */
.panel,form,.list,.guide section,.packs,.confirm,.dupbox,.lesson,.practice-bar{border-radius:3px;border:2px solid var(--ink)}
.panel,form,.guide section{box-shadow:4px 4px 0 var(--ink)}
.practice-bar{border-style:solid;background:var(--surface)}
.list .item{border-top:1px dashed var(--line)}
.panel h3,form h3,.guide h2{display:flex;align-items:center;gap:8px}
.panel h3::before,form h3::before,.guide h2::before{content:"";width:10px;height:14px;background:var(--stripes);flex:none;transform:skewX(-14deg)}
input,textarea,select,.search,#dq{border-radius:2px;border:2px solid var(--ink);background:var(--surface);box-shadow:var(--sunken)}
.stsel{border-radius:2px}
.pill{border-radius:2px}
.dhit,.dsn{border:2px solid var(--line);background:var(--surface)}
.dhit:hover,.dhit:focus-visible{border-color:var(--ink)}
.advice{border-left:6px solid var(--accent)}
.tbl tr.rec td{background:var(--das-bg)}
code{border-radius:2px;font-family:var(--f-mono)}

/* barre d'onglets façon barre des tâches */
nav.tabs{border-top:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--hi)}
nav.tabs::before{content:"";position:absolute;left:0;right:0;top:-8px;height:6px;background:var(--hstripes)}
nav.tabs .in{gap:6px;padding:6px 0}
nav.tabs button{font-family:var(--f-mono);font-weight:600;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:10px 2px;border:2px solid transparent;border-radius:3px;transition:background-color .12s,color .12s}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--ink);box-shadow:var(--sunken)}
nav.tabs button:active{transform:translateY(1px)}

/* bulle d'information : une petite boîte de dialogue */
.toast{border-radius:3px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--bevel),4px 4px 0 var(--ink);font-family:var(--f-mono);font-size:.78rem;padding:10px 14px 10px 30px}
.toast::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:14px;margin-top:-7px;background:var(--stripes);transform:skewX(-14deg)}

/* ===== mouvements : réservés à qui ne les a pas désactivés ===== */
@media (prefers-reduced-motion:no-preference){
  .card.a-in{animation:cardIn .28s cubic-bezier(.2,.8,.3,1.1)}
  .card.a-from-l{animation:fromL .26s cubic-bezier(.2,.8,.3,1)}
  .card.a-from-r{animation:fromR .26s cubic-bezier(.2,.8,.3,1)}
  .card.a-flip{animation:flip .3s ease-out}
  @keyframes cardIn{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes fromL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fromR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  /* retournement : la carte s'écrase puis se redéploie, comme un écran qui commute */
  @keyframes flip{0%{transform:scaleY(.04);filter:brightness(1.6)}60%{transform:scaleY(1.02)}100%{transform:none;filter:none}}
  .verdict.ok{animation:blink .5s steps(2,end) 2}
  .verdict.bad{animation:shake .38s ease-in-out}
  @keyframes blink{50%{opacity:.2}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .toast:not([hidden]){animation:toastIn .22s cubic-bezier(.2,.8,.3,1.2)}
  @keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  #view.a-view>*{animation:viewIn .2s ease-out}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse .28s ease-out}
  @keyframes pulse{0%{filter:brightness(1.35)}100%{filter:none}}
  .moreex[open]>.tex{animation:viewIn .2s ease-out}
}
/* carte qui s'en va : copie posée par-dessus, glissée à gauche (Encore, Difficile) ou à droite (Bien, Facile) */
.card-ghost{position:fixed;margin:0;z-index:15;pointer-events:none}

#sync{font:inherit;font-family:var(--f-mono);font-size:.7rem;background:none;border:none;padding:4px 0;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px}
#sync::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--muted);flex:none}
#sync[data-state="ok"]::before{background:var(--ok)} #sync[data-state="pend"]::before,#sync[data-state="busy"]::before{background:var(--learn)} #sync[data-state="err"]::before{background:var(--bad)}
#acct{display:flex;flex-direction:column;gap:10px}
#acct p{margin:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Memolex <button type="button" class="pair" id="pair" data-langpick aria-label="Changer de langue">Langue</button></h1>
    <button type="button" class="sync" id="sync" data-acct>Chargement…</button>
  </header>
  <div class="stats">
    <div class="stat"><b id="sDue">–</b><span>À revoir</span></div>
    <div class="stat"><b id="sTotal">–</b><span>Mots</span></div>
    <div class="stat"><b id="sKnown">–</b><span>Acquis</span></div>
  </div>
  <div class="progress" id="progress" aria-label="Où en sont tes mots"></div>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="review" aria-current="page">Réviser</button>
  <button data-tab="list">Mes mots</button>
  <button data-tab="add">Ajouter</button>
  <button data-tab="guide">Guide</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const DAY = 86400000;
/* ---------- langues : une seule appli, une langue apprise à la fois, toujours depuis le français ----------
   Chaque carte porte sa langue (lang) ; les anciennes cartes, sans lang, sont allemandes.
   Les fichiers de données suivent le motif lists-<langue>-fr.json, examples-…, chunks-…, credits-…, dict-…. */
const LANGS = {
  de:{code:'DE', name:'Allemand', adj:'allemand', adjf:'allemande', adjs:'allemands', the:"l'allemand", of:"de l'allemand", bravo:'Perfekt!',
      chars:['ä','ö','ü','ß'], charsUp:['ä','ö','ü','ß','Ä','Ö','Ü'], charsLabel:'Lettres allemandes',
      sample:'Schmetterling', sampleEx:'Ein Schmetterling sitzt auf der Blume.', samplePl:'-e, ¨-er, -n…', sampleQ:'Hund, gehen… ou en français : papillon',
      bulkEx:'die Rechnung, -en ; la facture&#10;bestellen ; commander&#10;das Mittel, - ; le moyen', bulkFmt:'der Hund, -e ; le chien'},
  it:{code:'IT', name:'Italien', adj:'italien', adjf:'italienne', adjs:'italiens', the:"l'italien", of:"de l'italien", bravo:'Perfetto!',
      chars:['à','è','é','ì','ò','ù'], charsUp:['à','è','é','ì','ò','ù','È'], charsLabel:'Lettres accentuées',
      sample:'farfalla', sampleEx:'Una farfalla si posa sul fiore.', samplePl:'le farfalle, gli amici…', sampleQ:'cane, andare… ou en français : papillon',
      bulkEx:"la fattura, le fatture ; la facture&#10;ordinare ; commander&#10;l'amico, gli amici ; l'ami", bulkFmt:'il cane, i cani ; le chien'}
};
let LANG = (()=>{ try{ return LANGS[localStorage.getItem('mx-lang')] ? localStorage.getItem('mx-lang') : ''; }catch(e){ return ''; } })();
let langPicking = false;
const L_ = () => LANGS[LANG] || LANGS.de;
const langOf = c => c.lang || 'de';
// les mots de la langue choisie ; les autres langues restent dans le stockage, intactes
const deck = () => [...cards.values()].filter(c=>langOf(c)===LANG);
const dataFile = k => `${k}-${LANG}-fr.json`;
// italien : genre d'après l'article (l' : genre enregistré sur la carte)
const itGender = c => c.g || (/^(il|lo|i|gli)$/.test(c.art||'') ? 'm' : /^(la|le)$/.test(c.art||'') ? 'f' : '');
// couleur du genre : bleu masculin, rouge féminin, vert neutre (allemand)
const gcls = c => langOf(c)==='de' ? (c.art ? 'g-'+c.art : '') : (c.art ? ({m:'g-der', f:'g-die'}[itGender(c)]||'') : '');
// « l'amico » sans espace, « il libro », « der Hund »
const artWord = c => (c.art ? c.art+(/['’]$/.test(c.art)?'':' ') : '')+c.de;
const ART_RE = () => LANG==='it' ? /^(?:(il|lo|la|i|gli|le)\s+|(l)['’]\s*)(.+)$/i : /^(der|die|das)\s+()(.+)$/i;
function splitArt(s){ const m=String(s||'').trim().match(ART_RE()); if(!m) return null; return {art: m[1] ? m[1].toLowerCase() : "l'", de: m[3]}; }
function updatePair(){ const b=document.getElementById('pair'); if(b) b.textContent = LANG ? `${L_().name} · Français` : 'Choisir une langue'; }
/* listes par niveau : les mots les plus fréquents, chargés depuis lists-de-fr.json */
const LEVELS = {A1:'Découverte', A2:'Survie', B1:'Seuil', B2:'Avancé', C1:'Autonome', C2:'Maîtrise'};
const PACK = 100, BATCH = 50;
let confirmLvl='';
// les 50 prochains mots du niveau qui ne sont pas encore dans tes mots, dans l'ordre de fréquence

function parseLine(line){
  const [left, frRaw, ...exRest] = line.split(/[;\t]/);
  const fr = (frRaw||'').trim(), ex = exRest.join(';').trim();
  if(!left || !left.trim() || !fr) return null;
  let de = left.trim(), art = '', pl = '';
  if(LANG==='it'){ // « il cane, i cani ; le chien » : pluriel écrit en entier, avec son article
    const c = de.indexOf(','); if(c > -1){ pl = de.slice(c+1).trim(); de = de.slice(0,c).trim(); }
    const a = splitArt(de); let g='';
    if(a){ art=a.art; de=a.de; g = /^(il|lo|i|gli)$/.test(art) ? 'm' : /^(la|le)$/.test(art) ? 'f' : ''; }
    if(!g && /^(i|gli)\s/i.test(pl)) g='m'; else if(!g && /^le\s/i.test(pl)) g='f';
    return { de, art, pl, fr, ex, ...(g?{g}:{}) };
  }
  const m = de.match(/^(der|die|das)\s+(.+)$/i);
  if(m){ art = m[1].toLowerCase(); de = m[2]; }
  const c = de.indexOf(',');
  if(c > -1){ pl = de.slice(c+1).trim(); de = de.slice(0,c).trim(); }
  return { de, art, pl, fr, ex };
}

/* ---------- scheduling (SM-2 simplifié) ---------- */
// un mot nouveau passe 3 fois : tout de suite, ~15 min plus tard, ~3 h plus tard ; ensuite il est programmé en jours
const STEPS = 3;
const STEP_DELAY = [0, 15*60000, 3*3600000];
const isLearning = c => c.ls!=null;
function daysLabel(ivl){ return ivl===1?'1 j':ivl<30?ivl+' j':ivl<365?Math.round(ivl/30)+' mois':Math.round(ivl/365)+' an'; }
function graduate(c, g){
  const n={...c}; const now=Date.now();
  const ivl = n.rivl || (g===4 ? 3 : 1);
  delete n.ls; delete n.dueSid; delete n.rivl;
  n.ivl=ivl; n.reps=(n.reps||0)+1; n.due=startOfDay(now)+ivl*DAY+3*3600000; return n;
}
// une note → la carte suivante ; requeue = la carte revient 3 cartes plus loin dans la session
function gradeCard(c, g){
  const now=Date.now(); let n={...c, lr:now}; delete n.dueSid;
  if(!n.first) n.first=now;
  if(isNew(c)){ n.intro=now; n.ls=0; }
  if(isLearning(n)){
    if(g===1){ n.ls=0; n.due=now; return {n, requeue:true}; }
    if(g===2){ n.ease=Math.max(1.3,(n.ease||2.5)-0.05); n.due=now+STEP_DELAY[Math.max(1,n.ls)]; return {n}; }
    n.ls+= g===4 ? 2 : 1; if(g===4) n.ease=(n.ease||2.5)+0.05;
    if(n.ls>=STEPS) return {n:graduate(n,g)};
    n.due=now+STEP_DELAY[n.ls]; return {n};
  }
  // mot déjà programmé en jours
  if(g===1){ n.lapses=(n.lapses||0)+1; n.ease=Math.max(1.3,(n.ease||2.5)-0.2); n.ls=1; n.rivl=1; n.due=now; return {n, requeue:true}; }
  if(g===2){ n.ease=Math.max(1.3,(n.ease||2.5)-0.15); n.ls=STEPS-1; n.rivl=Math.max(1,Math.round((n.ivl||1)*1.2)); n.due=now+STEP_DELAY[1]; return {n}; }
  return {n:schedule(n,g)};
}
// statut choisi à la main dans Mes mots
function withStatus(c, k){
  const now=Date.now(), sod=startOfDay(now); const n={...c}; delete n.dueSid; delete n.rivl;
  if(k==='new'){ ['ls','intro','first','lr','known','sorted'].forEach(f=>delete n[f]); return {...n, reps:0, lapses:0, ivl:0, ease:2.5, due:now}; }
  if(k==='learn'){ return {...n, ls:0, due:now, intro:n.intro||now, first:n.first||now}; }
  delete n.ls;
  const ivl = k==='known' ? Math.max(30, n.ivl||0) : ((n.ivl>=1 && n.ivl<21) ? n.ivl : 3);
  return {...n, reps:Math.max(1,n.reps||0), ivl, ease:n.ease||2.5, first:n.first||now, due:sod+ivl*DAY+3*3600000};
}
// « Je connais déjà » : le mot saute l'apprentissage et revient dans un mois pour vérifier
function markKnown(c){ const n={...c, ls:undefined, reps:1, ivl:30, ease:2.7, known:1, due:startOfDay(Date.now())+30*DAY+3*3600000, first:c.first||Date.now()}; delete n.ls; delete n.dueSid; return n; }
function schedule(c, g){
  const n={...c}; const now=Date.now();
  if(!n.first) n.first=now;
  if(g===1){ n.lapses++; n.reps=0; n.ivl=0; n.ease=Math.max(1.3,n.ease-0.2); n.due=now; return n; }
  if(g===2){ n.ease=Math.max(1.3,n.ease-0.15); n.ivl = n.reps===0 ? 1 : Math.max(1, Math.round(n.ivl*1.2)); }
  if(g===3){ n.ivl = n.reps===0 ? 1 : n.reps===1 ? 3 : Math.round(n.ivl*n.ease); }
  if(g===4){ n.ease+=0.15; n.ivl = n.reps===0 ? 3 : Math.round(Math.max(n.ivl,1)*n.ease*1.3); }
  n.reps++; n.due = startOfDay(now) + n.ivl*DAY + 3*3600000; return n;
}
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function preview(c,g){
  if(g===1) return session && session.ids.length>1?'dans 3 cartes':'tout de suite';
  const {n}=gradeCard(c,g);
  if(!isLearning(n)) return daysLabel(n.ivl);
  const m=Math.round((n.due-Date.now())/60000); return m<60 ? `${m} min` : `${Math.round(m/60)} h`;
}
const isDue = c => (c.due||0) <= Date.now();
function whenText(t){
  const now=Date.now(), diff=t-now;
  if(diff<=60000) return 'dans un instant';
  if(diff<3600000) return `dans ${Math.ceil(diff/60000)} min`;
  const days=Math.round((startOfDay(t)-startOfDay(now))/DAY);
  if(days===0) return `aujourd'hui à ${new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
  if(days===1) return 'demain';
  if(days<7) return new Date(t).toLocaleDateString('fr-FR',{weekday:'long'});
  return new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
let wakeTimer=null;
let synced=false;
let importing=false;
async function syncFromSources(){
  if(synced || mode==='loading' || !cards.size) return; synced=true;
  const src=new Map();
  Object.keys(LESSONS).forEach(id=>lessonItems(id).forEach(f=>src.set(keyOf(f),f)));
  // 1) doublons (imports lancés plusieurs fois) : on garde la carte la plus avancée
  const groups=new Map();
  for(const c of cards.values()){ const k=keyOf(c); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(c); }
  const prog=c=>(c.reps||0)*100+(c.ivl||0)+(isLearning(c)?50+(c.ls||0):0)+((c.lapses||0)>0?1:0);
  const drop=[], keepFix=[];
  for(const g of groups.values()){ if(g.length<2) continue;
    g.sort((a,b)=>prog(b)-prog(a) || a.created-b.created);
    const keep={...g[0]}; let changed=false;
    for(const o of g.slice(1)){ if(!keep.lvl&&o.lvl){keep.lvl=o.lvl;changed=true;} if(!keep.src&&o.src){keep.src=o.src;changed=true;} if(!keep.ex&&o.ex){keep.ex=o.ex;changed=true;} drop.push(o.id); }
    if(changed) keepFix.push(keep);
  }
  if(drop.length){ await removeMany(drop); }
  if(keepFix.length){ await putMany(keepFix); }
}
function scheduleWake(t){
  clearTimeout(wakeTimer);
  const d=t-Date.now();
  if(d>0 && d<6*3600000) wakeTimer=setTimeout(()=>{ if(!session) refresh(); }, d+1000);
}

const isNew = c => (c.reps||0)===0 && (c.lapses||0)===0 && !isLearning(c);
function introToday(){ const sod=startOfDay(Date.now()); return deck().filter(c=>c.intro && c.intro>=sod).length; }
// ce qui est prêt maintenant : mots en apprentissage dont le délai est passé, révisions du jour, puis nouveaux mots
function todayPlan(){
  const all=deck();
  const due=all.filter(c=>!isNew(c)&&isDue(c));
  const learn=due.filter(isLearning).sort((a,b)=>a.due-b.due);
  const rev=due.filter(c=>!isLearning(c)).sort((a,b)=>a.due-b.due);
  const pending=all.filter(isNew).sort((a,b)=>a.created-b.created);
  return { learn, rev, fresh: pending, pending };

function sizeChoices(ready){

  const tri = plan.pending.some(c=>!c.sorted) ? `<button class="btn ghost" data-triage>Trier mes nouveaux mots<small>${plan.pending.filter(c=>!c.sorted).length} à passer en revue : écarte ceux que tu connais déjà</small></button>` : '';

    const when=next?whenText(next.due):'';
    return `<div class="card empty"><h2>Rien à réviser pour l'instant</h2>

  <section><h2>Installer l'appli</h2>
    <p><b>Android (Chrome)</b> : menu ⋮ → <b>Installer l'application</b> (ou « Ajouter à l'écran d'accueil »).</p>
    <p><b>iPhone (Safari)</b> : bouton Partager → <b>Sur l'écran d'accueil</b>.</p>
    <p class="hint">Une fois installée, Memolex s'ouvre comme une appli et fonctionne hors ligne. Le dictionnaire se télécharge la première fois que tu l'ouvres.</p></section>
  <section><h2>Le principe</h2>
    <p>L'appli utilise la <b>répétition espacée</b> : chaque mot revient juste avant que tu l'oublies. Un mot bien su s'espace de plus en plus (1 jour, 3 jours, une semaine, un mois…). Un mot raté revient vite. Tu passes donc ton temps sur ce qui résiste, pas sur ce que tu sais déjà.</p>
    <p>La clé : <b>chercher activement</b> le mot avant de retourner la carte. C'est l'effort de rappel qui fixe la mémoire, pas la relecture.</p></section>

  <section><h2>Les sessions</h2>
    <p>Avant chaque session, choisis 20, 40 ou 60 cartes. Compte environ 10 secondes par carte. Tu peux enchaîner autant de sessions que tu veux.</p>
    <ul>
      <li><b>Contenu d'une session</b> : d'abord les mots à revoir (en apprentissage, puis révisions du jour), puis des nouveaux mots pour compléter. S'il y a 15 mots à revoir et que tu choisis 40 cartes, tu auras 15 révisions et 25 nouveaux mots.</li>
      <li><b>Un nouveau mot</b> passe 3 fois : à sa découverte, environ 15 minutes plus tard, puis environ 3 heures plus tard. Ensuite il est programmé en jours (demain, puis 3 jours, une semaine…).</li>
      <li><b>Pas de limite de nouveaux mots</b> : c'est toi qui règles le rythme. Chaque nouveau mot revient environ 5 fois le premier mois, donc beaucoup de nouveaux mots aujourd'hui, ce sont beaucoup de révisions dans les jours qui viennent.</li>
      <li>Une session longue d'un coup retient moins bien que plusieurs sessions courtes : 20 cartes le matin, 20 à midi, 20 le soir valent mieux que 60 d'affilée.</li>
      <li><b>Réviser quand même</b> : quand il n'y a rien à réviser, un entraînement libre te fait repasser tes mots sans attendre. Tes réponses n'y sont pas enregistrées et ne changent pas ton calendrier.</li>
      <li><b>Arrêter</b> : chaque réponse est enregistrée dès que tu donnes ta note. Tu peux arrêter une session (ou fermer l'appli) à tout moment sans rien perdre. La session suivante repart sur 20, 40 ou 60 cartes, au choix.</li>
      <li><b>Revenir en arrière</b> : la flèche ‹ à gauche de la carte ramène aux cartes déjà vues, réponse affichée et ta note encadrée. Choisis une autre note pour la corriger, ou avance avec la flèche › jusqu'à la carte en cours. Il n'y a pas de flèche › sur une carte à laquelle tu n'as pas encore répondu : on ne saute pas de carte.</li>
    </ul></section>

  <section><h2>Écarter les mots que tu connais</h2>
    <p>Les listes commencent par les mots les plus fréquents, que tu connais peut-être déjà. Deux façons de les écarter :</p>
    <ul>
      <li><b>Je connais déjà</b>, sous un nouveau mot pendant la session, une fois la réponse affichée : tu vérifies d'abord que tu le connaissais vraiment.</li>
      <li><b>Trier mes nouveaux mots</b>, avant la session : chaque mot s'affiche avec sa traduction, tu réponds « Je connais déjà » ou « À apprendre ». 100 mots se trient en 2 ou 3 minutes.</li>
    </ul>
    <p class="hint">Un mot écarté n'est pas supprimé : il revient une fois dans un mois pour vérifier. Si tu le sais, il s'espace encore. Pour l'enlever pour de bon, supprime-le dans Mes mots.</p></section>

  <section><h2>Les quatre notes</h2>
    <dl class="grades-doc">
      <dt class="bad">Encore</dt><dd>Tu ne savais pas. La carte revient 3 cartes plus loin, et son intervalle repart de zéro.</dd>
      <dt>Difficile</dt><dd>Trouvé avec peine. L'intervalle grandit peu.</dd>
      <dt>Bien</dt><dd>Trouvé normalement. La note par défaut, la plus utilisée.</dd>
      <dt class="good">Facile</dt><dd>Immédiat. L'intervalle s'allonge beaucoup.</dd>
    </dl>
    <p class="hint">Sois honnête : noter « Bien » un mot sur lequel tu as hésité, c'est le faire revenir trop tard.</p></section>

  <section><h2>Le code couleur</h2>${LANG==='it' ? `
    <p>La couleur d'un nom indique son genre :</p>
    <ul><li><span class="g-der art">il, lo, l'</span> en bleu : masculin (<i>il libro</i>, <i>lo zaino</i>, <i>l'amico</i>)</li><li><span class="g-die art">la, l'</span> en rouge : féminin (<i>la casa</i>, <i>l'amica</i>)</li><li>Sans couleur : verbes, adjectifs, adverbes et expressions, qui n'ont pas d'article</li></ul>
    <p>Devant une voyelle, <i>lo</i> et <i>la</i> deviennent <i>l'</i> : seule la couleur dit alors le genre. Le pluriel est écrit en entier, avec son article : <i>gli amici</i>, <i>le amiche</i>, <i>le città</i> (invariable).</p>
    <p class="hint">Associer une couleur au genre aide la mémoire visuelle, surtout pour les noms en <i>-e</i> (<i>il fiore</i>, <i>la chiave</i>) et les pièges (<i>la mano</i>, <i>il problema</i>).</p>` : `
    <p>La couleur d'un nom indique son genre, comme dans les manuels d'allemand :</p>
    <ul><li><span class="g-der art">der</span> en bleu : masculin</li><li><span class="g-die art">die</span> en rouge : féminin</li><li><span class="g-das art">das</span> en vert : neutre</li><li>Sans couleur : verbes, adjectifs, adverbes et expressions, qui n'ont pas d'article</li></ul>
    <p>Pour les verbes à préposition, le cas à employer est indiqué après la préposition : <i>warten auf <span class="pcase">(+ Akk.)</span></i>, <i>abhängen von <span class="pcase">(+ Dat.)</span></i>.</p>
    <p class="hint">Associer une couleur au genre aide la mémoire visuelle : avec le temps, tu « verras » die Spinne en rouge.</p>`}</section>

  <section><h2>Le quiz des articles</h2>
    ${LANG==='it' ? `<p>En sens FR → IT, pour chaque nom, choisis <span class="g-der art">il</span>, <span class="g-der art">lo</span>, <span class="art">l'</span> ou <span class="g-die art">la</span> avant de voir la réponse (<i>i</i>, <i>gli</i> ou <i>le</i> pour un nom qui ne s'emploie qu'au pluriel). Un mauvais article plafonne ta note à « Difficile » : le mot n'est su que si l'article l'est aussi.</p>
    <p class="hint">Rappel : <i>lo</i> devant s + consonne, z, gn, ps, x, y (<i>lo studente</i>, <i>lo zio</i>) ; <i>l'</i> devant une voyelle ; <i>il</i> ailleurs.</p>` : `<p>En sens FR → DE, pour chaque nom, choisis <span class="g-der art">der</span>, <span class="g-die art">die</span> ou <span class="g-das art">das</span> avant de voir la réponse. Un mauvais article plafonne ta note à « Difficile » : le mot n'est su que si l'article l'est aussi.</p>`}</section>

  <section><h2>Ajouter et retirer des mots</h2>
    <ul>
      <li><b>Listes par niveau</b> : les 8 000 mots les plus fréquents, de A1 à C2, ajoutés 50 par 50. Les premiers mots de l'A1 sont les plus utilisés de la langue.</li>
      <li><b>Coller une liste</b> : une ligne par mot, <code>${LANG==='it'?"il cane, i cani ; le chien ; exemple":"der Hund, -e ; le chien ; exemple"}</code>.</li>
      ${LANG==='it' ? `<li>Les boutons <b>à è é ì ò ù</b> sous les champs insèrent ces lettres.</li>` : `<li>Les boutons <b>ä ö ü ß</b> sous les champs insèrent ces lettres. Dans les exercices, tu peux aussi écrire <code>ae</code>, <code>oe</code>, <code>ue</code> et <code>ss</code> : c'est accepté.</li>`}
      <li>Ajouter beaucoup de mots d'un coup ne pose pas de problème : ils attendent leur tour et arrivent au rythme de ton quota.</li>
      <li>Pour annuler un import : <b>Mes mots → Retirer un ajout groupé</b>. Les mots déjà commencés sont conservés.</li>
    </ul></section>

  <section><h2>Le dictionnaire</h2>${LANG==='it' ? `
    <p>Dans <b>Ajouter</b>, tape un mot italien (ou sa traduction française) : l'appli retrouve le mot dans les listes de Memolex, avec son article, son pluriel et sa traduction relue. Touche un résultat pour remplir la fiche. Tout fonctionne hors ligne, sans IA.</p>
    <p class="hint">Le dictionnaire italien contient les 8 000 mots des listes. Pour un mot absent, remplis la fiche toi-même : article, pluriel avec son article (<i>gli zaini</i>), traduction.</p>` : `
    <p>Dans <b>Ajouter</b>, tape un mot allemand (ou sa traduction française) : l'appli propose l'article, le pluriel et les différents sens. Touche un résultat pour remplir la fiche, puis choisis le sens qui correspond à ton cours. Tout fonctionne hors ligne, sans IA.</p>
    <p><b>Niveau estimé</b> (≈ A1-A2, ≈ B1-B2, ≈ C1+) : calculé d'après la fréquence d'usage du mot à l'écrit et à l'oral. Les mots très fréquents sont en général appris tôt, les mots rares plus tard. C'est une <b>approximation</b>, pas le classement officiel du CECR : <i>Kühlschrank</i> est un mot de débutant, mais il est peu fréquent dans les textes. Dans Mes mots, ces niveaux ont leur propre filtre, séparé des niveaux exacts.</p>
    <p class="hint">Les traductions sont automatiques : vérifie-les toujours, et ajoute toi-même un exemple, c'est ce qui fixe le mot. Si tu écris le français, la recherche inverse marche à partir de 3 lettres.</p>
    <p class="hint">Sources : dictionnaire allemand-français <a href="https://freedict.org/" target="_blank" rel="noopener">FreeDict</a> / <a href="https://www.wikdict.com/" target="_blank" rel="noopener">WikDict</a> (édition 2022) et pluriels du projet <a href="https://github.com/gambolputty/german-nouns" target="_blank" rel="noopener">german-nouns</a>, tous deux tirés du <a href="https://de.wiktionary.org/" target="_blank" rel="noopener">Wiktionary</a> ; classement des résultats par fréquence d'usage grâce à <a href="https://github.com/rspeer/wordfreq" target="_blank" rel="noopener">wordfreq</a>. Licences <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 3.0</a> et <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</p>`}</section>

  <section><h2>Les phrases d'exemple</h2>

    <ul>

      <li>Les phrases sont choisies courtes, avec des mots plutôt plus fréquents que le mot appris, et de préférence écrites par des locuteurs natifs.</li>
      <li><b>Lis la phrase à voix haute</b> avant de noter la carte : quelques secondes de plus, mais le mot se fixe avec sa grammaire.</li>
      <li>Si tu as écrit ton propre exemple pour un mot, c'est lui qui s'affiche.</li>
    </ul></section>

  <section><h2>Les mots qui ont la même traduction</h2>
    <p>Quand plusieurs de tes mots se traduisent pareil (${LANG==='it' ? `<i>là</i> : <i>lì</i> et <i>là</i> ; <i>vite</i> : <i>presto</i> et <i>velocemente</i>…` : `<i>là</i> : <i>da</i> et <i>dort</i> ; <i>pourquoi</i> : <i>warum</i>, <i>wieso</i>…`}), la carte te donne un indice : la première lettre et le nombre de lettres du mot attendu. Au verso, les autres mots de même traduction sont rappelés, pour apprendre à les distinguer.</p>
    <ul>
      <li>Si tu as trouvé un autre mot de la liste, ce n'est pas faux : note « Difficile » et regarde la différence d'usage dans la phrase d'exemple.</li>
    </ul></section>

  <section><h2>Crédits</h2>
    <p class="hint">Les phrases d'exemple et leurs traductions viennent de <a href="https://tatoeba.org/fr" target="_blank" rel="noopener">Tatoeba</a>, une base de phrases écrite par des bénévoles, et sont diffusées sous licence <a href="https://creativecommons.org/licenses/by/2.0/fr/deed.fr" target="_blank" rel="noopener">CC BY 2.0 FR</a>.</p>

    <p class="hint">Les expressions « À retenir » (une par carte, au verso) sont rédigées pour Memolex : elles montrent l'emploi le plus courant du mot, avec ses compléments habituels.</p>
    <details id="credDetails"><summary>Voir les auteurs des phrases</summary><div id="credList"></div></details>
    ${LANG==='it' ? `<p class="hint">Listes italien-français établies pour Memolex : fréquences d'usage <a href="https://github.com/rspeer/wordfreq" target="_blank" rel="noopener">wordfreq</a> (R. Speer, licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>), analyse grammaticale des phrases avec <a href="https://spacy.io/models/it" target="_blank" rel="noopener">spaCy</a> (modèle it_core_news_lg) ; traductions, articles et pluriels relus pour Memolex.</p>` : `<p class="hint">Dictionnaire allemand-français <a href="https://freedict.org/" target="_blank" rel="noopener">FreeDict</a> / <a href="https://www.wikdict.com/" target="_blank" rel="noopener">WikDict</a> et pluriels du projet <a href="https://github.com/gambolputty/german-nouns" target="_blank" rel="noopener">german-nouns</a>, tirés du <a href="https://de.wiktionary.org/" target="_blank" rel="noopener">Wiktionary</a> (licences <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 3.0</a> et <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>) ; fréquences d'usage : <a href="https://github.com/rspeer/wordfreq" target="_blank" rel="noopener">wordfreq</a>. Articles et nature des mots français : <a href="http://www.lexique.org/" target="_blank" rel="noopener">Lexique 3.83</a> (B. New, C. Pallier, licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>).</p>`}</section>

  <section><h2>Les listes par niveau</h2>
    <p>Les listes suivent la <b>fréquence d'usage</b> : un mot très courant à l'écrit et à l'oral est proposé tôt, un mot rare plus tard. C'est la façon la plus efficace de commencer, car les quelques centaines de mots les plus fréquents couvrent l'essentiel de ce qu'on lit et entend au quotidien.</p>
    <div class="tbl"><table><thead><tr><th>Niveau</th><th>Rang de fréquence</th><th>Mots</th></tr></thead><tbody>
      <tr><td>A1 · Découverte</td><td>1 – 600</td><td>600</td></tr><tr><td>A2 · Survie</td><td>601 – 1 300</td><td>700</td></tr>
      <tr><td>B1 · Seuil</td><td>1 301 – 2 500</td><td>1 200</td></tr><tr><td>B2 · Avancé</td><td>2 501 – 4 000</td><td>1 500</td></tr>
      <tr><td>C1 · Autonome</td><td>4 001 – 6 000</td><td>2 000</td></tr><tr><td>C2 · Maîtrise</td><td>6 001 – 8 000</td><td>2 000</td></tr></tbody></table></div>
    <p class="hint">Ces tranches sont une <b>approximation</b> du Cadre européen, pas son classement officiel. Des mots utiles mais peu fréquents à l'écrit (${LANG==='it' ? `<i>frigorifero</i>, <i>spazzolino</i>` : `<i>Kühlschrank</i>, <i>Zahnbürste</i>`}) arrivent plus tard que dans un manuel : ajoute-les toi-même avec le dictionnaire quand tu en as besoin.</p></section>

  <section><h2>Combien de nouveaux mots par jour ?</h2>
    <p>Une fois le rythme installé (après 3 ou 4 semaines), ta charge quotidienne de révision est proportionnelle au nombre de mots que tu découvres chaque jour :</p>
    <div class="tbl"><table>
      <thead><tr><th>Nouveaux mots / jour</th><th>Temps quotidien estimé</th><th>Mots appris en 3 mois</th></tr></thead>
      <tbody>
        <tr><td>10</td><td>15–20 min</td><td>~850</td></tr>
        <tr class="rec"><td>20</td><td>30–40 min</td><td>~1 700</td></tr>
        <tr><td>30</td><td>50–60 min</td><td>~2 600</td></tr>
        <tr><td>50</td><td>1 h 20 – 1 h 40</td><td>~4 300</td></tr>
      </tbody></table></div>
    <p class="hint">Estimations pour environ 10 secondes par carte. Le temps réel dépend de ta vitesse et de ton taux de réussite.</p>
    <div class="advice"><b>Le conseil</b><p>Sur un niveau facile pour toi, trie tes paquets puis avance vite : les mots connus disparaissent et tu ne perds pas de temps. Sur un niveau nouveau, environ <b>20 nouveaux mots par jour</b> est un bon rythme. Si tes sessions se remplissent de révisions au point de ne plus laisser de place aux nouveaux mots, c'est le signal de ralentir : mieux vaut un rythme tenu six mois qu'un sprint de deux semaines.</p></div></section>

  <section><h2>Les compteurs</h2>
    <ul>
      <li><b>À revoir</b> : les mots à revoir maintenant (en apprentissage et révisions du jour).</li>
      <li><b>Mots</b> : tout ton vocabulaire ajouté, vu ou pas encore.</li>
      <li><b>La barre sous les compteurs</b> détaille où en sont tes mots : <b>À découvrir</b> (ajoutés, jamais vus), <b>En apprentissage</b> (passages de session en session), <b>En révision</b> (programmés en jours), <b>Acquis</b> (intervalle de plus de 3 semaines). Touche une catégorie pour voir ses mots.</li>
      <li><b>Acquis</b> : les mots dont l'intervalle dépasse 3 semaines. C'est le vrai indicateur de progrès.</li>
    </ul></section>
  </article>`;

function loadDict(){

    const lv=$('#fLvl').value; const fromDict = dictPicked && dictPicked===word; await put({...newCard({de:word, art, ...(g?{g}:{}), pl:$('#fPl').value.trim(), fr, ex:($('#fEx').value.trim()===autoDef?'':$('#fEx').value.trim())}), ...(autoDef && $('#fEx').value.trim()===autoDef?{def:autoDef}:{}), ...(lv?{lvl:lv}:{}), src: fromDict?'dict':'manual', ...(fromDict && !lv ? {est:dictEst} : {}), ...(fromDict && dictPos ? {pos:dictPos} : {})}); const fe=$('#fEst'); if(fe) fe.textContent=''; const pp=$('#fPlPrev'); if(pp) pp.textContent=''; dictPicked=''; dictDeck=null;
    ['fDe','fPl','fFr','fEx'].forEach(id=>$('#'+id).value=''); $('#fLvl').value=''; $('#fArt').value=''; $('#fDe').focus();
    autoDef=''; const dq=$('#dq'), sb=$('#dSense'); if(dq) dq.value=''; if(sb){ sb.hidden=true; sb.innerHTML=''; }
    refresh(); toast(`« ${artWord({art, de:word})} » ajouté`);
  }
  if(e.target.id==='bulkForm'){ if(importing) return; importing=true; try{
    const box=$('#bulkDup');
    if(bulkPending){ const {fresh,ok,bad}=bulkPending; bulkPending=null;
      box.querySelectorAll('[data-bulkfr]').forEach(i=>{ const c=fresh[+i.dataset.bulkfr], v=i.value.trim(); if(c && v) c.fr=v; });
      box.hidden=true; box.innerHTML=''; await finishBulk(fresh, ok, bad); return; }
    const lines=$('#fBulk').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const parsed=lines.map(parseLine); const ok=parsed.filter(Boolean);
    if(dictState==='ready') ok.forEach(f=>{ const e=DICT_BY.get(f.de); if(!e) return; if(!f.art) f.art=entArt(e); if(LANG==='it' && !f.g && e.g) f.g=e.g; if(!f.pl && e.pl) f.pl=e.pl; }); const bad=parsed.length-ok.length;
    if(!ok.length){ toast('Aucune ligne reconnue. Format : der Hund ; le chien'); return; }
    const existing=new Set(deck().map(dkey));
    const bb=newBatch('Liste collée'); const fresh=ok.filter(f=>!existing.has((f.art+f.de).toLowerCase())).map(f=>({...newCard(f,bb.id),batchLabel:bb.label}));
    const dups=sameFr(fresh);
    if(dups.length){ bulkPending={fresh, ok:ok.length, bad};
      box.innerHTML=`<p><b>${dups.length} mot${dups.length>1?'s ont':' a'} la même traduction qu'un autre mot.</b> ${DUP_TIP}</p>${dupItemsHTML(dups,'data-bulkfr')}<p class="hint">Appuie à nouveau sur « Importer » pour ajouter la liste, avec ou sans nuances.</p>`;
      box.hidden=false; box.querySelector('input')?.focus(); return; }
    await finishBulk(fresh, ok.length, bad);
  } finally { importing=false; } }
});
let bulkPending=null;
async function finishBulk(fresh, nOk, bad){
    await putMany(fresh); $('#fBulk').value=''; refresh();
    const ok={length:nOk};
    toast(`${fresh.length} mot${fresh.length>1?'s':''} importé${fresh.length>1?'s':''}${ok.length-fresh.length?` · ${ok.length-fresh.length} déjà présent${ok.length-fresh.length>1?'s':''}`:''}${bad?` · ${bad} ligne${bad>1?'s':''} ignorée${bad>1?'s':''}`:''}`);
}

  await put(withStatus(c, sel.value)); refresh(); toast(`« ${artWord(c)} » : ${STATUS_LABEL[sel.value].toLowerCase()}`);
});

/* ---------- Synchronisation entre appareils (Supabase, sans bibliothèque) ----------
   Chaque mot est une ligne ; les réglages une ligne « _settings ». La copie du téléphone reste la référence :
   à chaque modification, la carte reçoit une heure (mt). Quand deux appareils ont changé le même mot,
   la version la plus récente gagne. Un mot supprimé ici laisse une trace (tomb) jusqu'à ce que le serveur l'ait reçue. */
const SB_URL="https://rbgxotiadewxlyvvrdhp.supabase.co", SB_KEY="sb_publishable_ikHUtYnxyFpCnIobNeRx6Q_5wH6duiZ", SB_TABLE="memolex", SYNC_KEY="mx-sync";
let SY=(()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ return {}; } })();
SY.dirty=SY.dirty||{}; SY.tomb=SY.tomb||{};
let SYNCING=false, SYNC_T=null, SYNC_AGAIN=false;
const syPut=()=>{ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch(e){} };
class SyErr extends Error{ constructor(m,code){ super(m); this.code=code; } }
async function sbReq(path,o={},auth){
  const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},o.headers||{});
  if(auth){ if(!SY.tok) throw new SyErr('Non connecté','auth'); if(Date.now()>(SY.exp||0)-60e3) await sbRefresh(); h.Authorization='Bearer '+SY.tok; }
  let r; try{ r=await fetch(SB_URL+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}); }catch(e){ throw new SyErr('Hors ligne','net'); }
  if(r.status===401 && auth && !o.retried){ await sbRefresh(); return sbReq(path,Object.assign({retried:true},o),auth); }
  if(!r.ok){ let m=''; try{ const j=await r.json(); m=j.msg||j.message||j.error_description||j.error||''; }catch(e){} throw new SyErr(m||('Erreur '+r.status), r.status); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
function sbSession(j){ SY.tok=j.access_token; SY.ref=j.refresh_token; SY.exp=Date.now()+(j.expires_in||3600)*1000; if(j.user){ SY.uid=j.user.id; SY.email=j.user.email||SY.email; } syPut(); }
async function sbRefresh(){ if(!SY.ref) throw new SyErr('Session expirée','auth'); let j;
  try{ j=await sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SY.ref}},false); }
  catch(e){ if(e.code==='net') throw e; syOutLocal(); throw new SyErr('Session expirée : reconnecte-toi','auth'); }
  sbSession(j); }
function syOutLocal(){ SY={dirty:{},tomb:{}}; syPut(); syUi(); }

/* --- ce qui change ici est noté pour le prochain envoi --- */
function syMark(id){ if(!SY.tok) return; if(id) SY.dirty[id]=1; syPut(); clearTimeout(SYNC_T); SYNC_T=setTimeout(()=>syncNow(true),2500); syUi(); }
const stamp = c => ({...c, mt:Date.now()});

/* --- réception : la version la plus récente gagne --- */
function syApply(rows){
  let n=0;
  for(const r of rows){
    const rmt=(r.data && r.data.mt)||0;
    if(r.id==='_settings'){ if(!r.deleted && r.data && rmt>(settings.mt||0) && !SY.dirty._settings){ settings={...settings,...r.data}; try{ localStorage.setItem('mx-settings', JSON.stringify(settings)); }catch(e){} n++; } continue; }
    const loc=cards.get(r.id);
    if(r.deleted){
      if(loc && (loc.mt||0)<=rmt){ cards.delete(r.id); delete SY.dirty[r.id]; n++; }
      continue;
    }
    if(SY.tomb[r.id] && SY.tomb[r.id]>=rmt) continue;          // supprimé ici après : la suppression partira
    if(!loc || (loc.mt||0)<rmt){ const {id,...d}=r.data; cards.set(r.id,{...d,id:r.id}); delete SY.dirty[r.id]; delete SY.tomb[r.id]; n++; }
  }
  return n;
}
async function syPull(){
  let n=0, off=0, max=SY.cur||null;
  for(;;){
    const q=`/rest/v1/${SB_TABLE}?select=id,data,deleted,srv_at&order=srv_at.asc,id.asc&limit=1000&offset=${off}`+(SY.cur?'&srv_at=gt.'+encodeURIComponent(new Date(Date.parse(SY.cur)-5000).toISOString()):''); // 5 s de recouvrement : un envoi encore en cours ailleurs n'est pas manqué
    const rows=await sbReq(q,{},true)||[]; if(!rows.length) break;
    n+=syApply(rows); rows.forEach(r=>{ if(!max || r.srv_at>max) max=r.srv_at; });
    if(rows.length<1000) break; off+=1000;
  }
  if(max) SY.cur=max; return n;
}
/* --- envoi : les mots modifiés ici, par paquets --- */
async function syPush(){
  const ids=Object.keys(SY.dirty); if(!ids.length) return 0;
  const snap=new Map();
  const rows=ids.map(id=>{
    if(id==='_settings'){ snap.set(id,settings.mt||0); return {user_id:SY.uid,id,data:settings,deleted:false}; }
    const c=cards.get(id);
    if(c){ snap.set(id,c.mt||0); return {user_id:SY.uid,id,data:c,deleted:false}; }
    const t=SY.tomb[id]||Date.now(); snap.set(id,t); return {user_id:SY.uid,id,data:{mt:t},deleted:true};
  });
  for(let i=0;i<rows.length;i+=200){
    await sbReq(`/rest/v1/${SB_TABLE}?on_conflict=user_id,id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:rows.slice(i,i+200)},true);
  }
  // une carte modifiée pendant l'envoi reste à envoyer
  for(const [id,m] of snap){ const now = id==='_settings' ? (settings.mt||0) : cards.has(id) ? (cards.get(id).mt||0) : (SY.tomb[id]||0);
    if(now===m){ delete SY.dirty[id]; if(!cards.has(id)) delete SY.tomb[id]; } }
  return rows.length;
}
async function syncNow(quiet){
  if(!SY.tok) return false;
  if(SYNCING){ SYNC_AGAIN=true; return false; }
  SYNCING=true; syUi(quiet?null:'Synchronisation…');
  try{
    if(!SY.init){ // premier passage sur cet appareil : tout ce qu'il contient part aussi
      [...cards.keys()].forEach(id=>SY.dirty[id]=1); SY.dirty._settings=1; SY.init=1; SY.cur=null;
    }
    const got=await syPull();
    if(got){ saveLocal(); synced=false; await syncFromSources(); refresh(); }
    const sent=await syPush();
    SY.last=Date.now(); SY.err=''; syPut();
    syUi(quiet?null:`Synchronisé${got||sent?` · ${sent} envoyé${sent>1?'s':''}, ${got} reçu${got>1?'s':''}`:''}`);
    return true;
  }catch(e){
    SY.err = e.code==='net' ? 'Hors ligne : la synchro reprendra au retour du réseau' : e.code==='auth' ? 'Session expirée : reconnecte-toi' : (e.message||'La synchro a échoué'); syPut();
    syUi(quiet?null:SY.err); return false;
  }finally{
    SYNCING=false; syUi();
    if(SYNC_AGAIN){ SYNC_AGAIN=false; setTimeout(()=>syncNow(true),300); }
  }
}

/* --- connexion par lien reçu par e-mail (compte propre à Memolex) --- */
const sbSendLink=email=>sbReq('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:{email,create_user:true}},false);
async function authHash(){
  const h=location.hash; if(!/access_token=|error_code=/.test(h)) return;
  const q=new URLSearchParams(h.slice(1)); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(q.get('error_code')||q.get('error')){ toast(q.get('error_code')==='otp_expired'?'Ce lien a expiré ou a déjà servi : demande un nouveau lien.':'La connexion a échoué : demande un nouveau lien.'); return; }
  const old=SY; SY={dirty:{},tomb:{},tok:q.get('access_token'),ref:q.get('refresh_token'),exp:Date.now()+(+q.get('expires_in')||3600)*1000};
  try{ const u=await sbReq('/auth/v1/user',{},true);
    if(old.uid===u.id) SY=Object.assign(old,{tok:SY.tok,ref:SY.ref,exp:SY.exp}); else SY.uid=u.id;
    SY.email=u.email; syPut(); toast('Connecté : '+u.email); syncNow(false);
  }catch(e){ SY=old; syPut(); toast(e.code==='net'?'Hors ligne : rouvre le lien une fois connecté':'La connexion a échoué : demande un nouveau lien'); }
  syUi();
}

/* --- interface : l'état en haut, le panneau du compte dans le Guide --- */
function syWhen(t){ const m=Math.round((Date.now()-t)/60000); return m<1?'à l’instant':m<60?`il y a ${m} min`:new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function syUi(msg){
  const top=$('#sync');
  if(top){ const pend=Object.keys(SY.dirty).length;
    top.textContent = !SY.tok ? 'Sur cet appareil · synchroniser…' : SYNCING ? 'Synchronisation…' : SY.err ? SY.err : pend ? `${pend} changement${pend>1?'s':''} à envoyer` : SY.last ? 'Synchronisé '+syWhen(SY.last) : 'Synchronisation prête';
    top.dataset.state = !SY.tok ? 'off' : SYNCING ? 'busy' : SY.err ? 'err' : pend ? 'pend' : 'ok'; }
  const box=$('#acct'); if(!box) return;
  if(msg!=null) box.dataset.msg=msg;
  box.innerHTML = SY.tok
    ? `<p>Connecté : <b>${esc(SY.email||'')}</b></p><p class="hint">${SY.err?esc(SY.err):SY.last?'Dernière synchro '+syWhen(SY.last):'Pas encore synchronisé'}</p>
       <div class="row"><button type="button" class="btn" data-sygo ${SYNCING?'disabled':''}>${SYNCING?'Synchronisation…':'Synchroniser maintenant'}</button><button type="button" class="btn ghost" data-syout>Se déconnecter</button></div>
       <p class="hint">Tes mots, ta progression et tes réglages vont sur tous les appareils connectés avec cette adresse. La synchro se fait seule après chaque réponse et à l'ouverture de l'appli.</p>`
    : `<p class="hint">Connecte-toi pour retrouver tes mots et ta progression sur ton téléphone et ton ordinateur. Pas de mot de passe : tu reçois un lien par e-mail, à ouvrir sur l'appareil à connecter.</p>
       <label for="syEmail">Adresse e-mail<input type="email" id="syEmail" autocomplete="email" placeholder="toi@exemple.fr"></label>
       <button type="button" class="btn" data-sylink>M'envoyer le lien de connexion</button>`;
  if(box.dataset.msg) box.insertAdjacentHTML('beforeend',`<p class="hint" aria-live="polite"><b>${esc(box.dataset.msg)}</b></p>`);
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if('sylink' in b.dataset){ const em=($('#syEmail')?.value||'').trim(); if(!/^\S+@\S+\.\S+$/.test(em)){ toast('Saisis une adresse e-mail valide'); return; }
    b.disabled=true; try{ await sbSendLink(em); syUi(`Lien envoyé à ${em}. Ouvre l'e-mail sur cet appareil et touche le lien.`); }catch(err){ syUi(err.code==='net'?'Hors ligne : réessaie une fois connecté':(err.message||"Le lien n'a pas pu être envoyé")); } b.disabled=false; return; }
  if('sygo' in b.dataset){ syncNow(false); return; }
  if('syout' in b.dataset){ try{ await sbReq('/auth/v1/logout',{method:'POST'},true); }catch(err){} syOutLocal(); syUi('Déconnecté. Tes mots restent sur cet appareil.'); return; }
});
addEventListener('online',()=>{ if(SY.tok) syncNow(true); });
document.addEventListener('visibilitychange',()=>{ if(!SY.tok) return; if(document.visibilityState==='hidden'){ if(Object.keys(SY.dirty).length) syncNow(true); } else if(Date.now()-(SY.last||0)>20e3) syncNow(true); });
setInterval(()=>{ if(!SYNCING) syUi(); }, 60e3);

refresh();
useLocal();
authHash(); addEventListener('hashchange', authHash);
if(SY.tok) syncNow(true);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
