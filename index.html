end.tes_mots_ta_progression_et":"Tes mots, ta progression et tes réglages vont sur tous les appareils connectés avec cette adresse. La synchro se fait seule après chaque réponse et à l'ouverture de l'appli.","pend.connecte_toi_pour_retrouver_tes":"Connecte-toi pour retrouver tes mots et ta progression sur ton téléphone et ton ordinateur. Pas de mot de passe : tu reçois un lien par e-mail, à ouvrir sur l'appareil à connecter.","pend.adresse_e_mail":"Adresse e-mail","pend.m_envoyer_le_lien_de":"M'envoyer le lien de connexion","pend.saisis_une_adresse_e_mail":"Saisis une adresse e-mail valide","pend.lien_envoye_a_ouvre_l":"Lien envoyé à {0}. Ouvre l'e-mail sur cet appareil et touche le lien.","pend.hors_ligne_reessaie_une_fois":"Hors ligne : réessaie une fois connecté","pend.le_lien_n_a_pas":"Le lien n'a pas pu être envoyé","pend.deconnecte_tes_mots_restent_sur":"Déconnecté. Tes mots restent sur cet appareil.","shell.version_de_l_appli":"Version de l'appli","shell.changer_de_langue":"Changer de langue","shell.langue":"Langue","shell.a_revoir":"À revoir","shell.mots":"Mots","shell.ou_en_sont_tes_mots":"Où en sont tes mots","shell.tab_review":"Réviser","shell.tab_list":"Mes mots","shell.tab_add":"Ajouter","shell.tab_stats":"Stats","shell.tab_guide":"Guide","notifState.envoyer_un_test":"Envoyer un test","notifState.couper":"Couper","notifState.activer_les_notifications":"Activer les notifications","_renderReview.chargement_de_tes_mots":"Chargement de tes mots…","dictSearch.deja_dans_tes_mots":"déjà dans tes mots","dictPick.definition":"Définition :","prepLine.datif_si_l_on_reste":"<b>Datif</b> si l'on reste au même endroit (question <i>wo?</i>) : <span lang=\"{0}\">{1}</span>.","prepLine.accusatif_si_l_on_va":"<b>Accusatif</b> si l'on va vers ce lieu (question <i>wohin?</i>) : <span lang=\"{0}\">{1}</span>.","guide.it.code_couleur":"\n    <p>La couleur d'un nom indique son genre :</p>\n    <ul><li><span class=\"g-der art\">il, lo, l'</span> en bleu : masculin (<i>il libro</i>, <i>lo zaino</i>, <i>l'amico</i>)</li><li><span class=\"g-die art\">la, l'</span> en rouge : féminin (<i>la casa</i>, <i>l'amica</i>)</li><li>Sans couleur : verbes, adjectifs, adverbes et expressions, qui n'ont pas d'article</li></ul>\n    <p>Devant une voyelle, <i>lo</i> et <i>la</i> deviennent <i>l'</i> : seule la couleur dit alors le genre. Le pluriel est écrit en entier, avec son article : <i>gli amici</i>, <i>le amiche</i>, <i>le città</i> (invariable).</p>\n    <p class=\"hint\">Associer une couleur au genre aide la mémoire visuelle, surtout pour les noms en <i>-e</i> (<i>il fiore</i>, <i>la chiave</i>) et les pièges (<i>la mano</i>, <i>il problema</i>).</p>","guide.de.code_couleur":"\n    <p>La couleur d'un nom indique son genre, comme dans les manuels d'allemand :</p>\n    <ul><li><span class=\"g-der art\">der</span> en bleu : masculin</li><li><span class=\"g-die art\">die</span> en rouge : féminin</li><li><span class=\"g-das art\">das</span> en vert : neutre</li><li>Sans couleur : verbes, adjectifs, adverbes et expressions, qui n'ont pas d'article</li></ul>\n    <p>Pour les verbes à préposition, le cas à employer est indiqué après la préposition : <i>warten auf <span class=\"pcase\">(+ Akk.)</span></i>, <i>abhängen von <span class=\"pcase\">(+ Dat.)</span></i>.</p>\n    <p class=\"hint\">Associer une couleur au genre aide la mémoire visuelle : avec le temps, tu « verras » die Spinne en rouge.</p>","guide.it.quiz_articles":"<p>En sens FR → IT, pour chaque nom, choisis <span class=\"g-der art\">il</span>, <span class=\"g-der art\">lo</span>, <span class=\"art\">l'</span> ou <span class=\"g-die art\">la</span> avant de voir la réponse (<i>i</i>, <i>gli</i> ou <i>le</i> pour un nom qui ne s'emploie qu'au pluriel). Un mauvais article plafonne ta note à « Difficile » : le mot n'est su que si l'article l'est aussi.</p>\n    <p class=\"hint\">Rappel : <i>lo</i> devant s + consonne, z, gn, ps, x, y (<i>lo studente</i>, <i>lo zio</i>) ; <i>l'</i> devant une voyelle ; <i>il</i> ailleurs.</p>","guide.de.quiz_articles":"<p>En sens FR → DE, pour chaque nom, choisis <span class=\"g-der art\">der</span>, <span class=\"g-die art\">die</span> ou <span class=\"g-das art\">das</span> avant de voir la réponse. Un mauvais article plafonne ta note à « Difficile » : le mot n'est su que si l'article l'est aussi.</p>","guide.it.coller_format":"il cane, i cani ; le chien ; exemple","guide.de.coller_format":"der Hund, -e ; le chien ; exemple","guide.it.lettres":"<li>Les boutons <b>à è é ì ò ù</b> sous les champs insèrent ces lettres.</li>","guide.de.lettres":"<li>Les boutons <b>ä ö ü ß</b> sous les champs insèrent ces lettres. Dans les exercices, tu peux aussi écrire <code>ae</code>, <code>oe</code>, <code>ue</code> et <code>ss</code> : c'est accepté.</li>","guide.it.dictionnaire":"\n    <p>Dans <b>Ajouter</b>, tape un mot italien (ou sa traduction française) : l'appli retrouve le mot dans les listes de Memolex, avec son article, son pluriel et sa traduction relue. Touche un résultat pour remplir la fiche. Tout fonctionne hors ligne, sans IA.</p>\n    <p class=\"hint\">Le dictionnaire italien contient les 8 000 mots des listes. Pour un mot absent, remplis la fiche toi-même : article, pluriel avec son article (<i>gli zaini</i>), traduction.</p>","guide.de.dictionnaire":"\n    <p>Dans <b>Ajouter</b>, tape un mot allemand (ou sa traduction française) : l'appli propose l'article, le pluriel et les différents sens. Touche un résultat pour remplir la fiche, puis choisis le sens qui correspond à ton cours. Tout fonctionne hors ligne, sans IA.</p>\n    <p><b>Niveau estimé</b> (≈ A1-A2, ≈ B1-B2, ≈ C1+) : calculé d'après la fréquence d'usage du mot à l'écrit et à l'oral. Les mots très fréquents sont en général appris tôt, les mots rares plus tard. C'est une <b>approximation</b>, pas le classement officiel du CECR : <i>Kühlschrank</i> est un mot de débutant, mais il est peu fréquent dans les textes. Dans Mes mots, ces niveaux ont leur propre filtre, séparé des niveaux exacts.</p>\n    <p class=\"hint\">Les traductions sont automatiques : vérifie-les toujours, et ajoute toi-même un exemple, c'est ce qui fixe le mot. Si tu écris le français, la recherche inverse marche à partir de 3 lettres.</p>\n    <p class=\"hint\">Sources : dictionnaire allemand-français <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> (édition 2022) et pluriels du projet <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a>, tous deux tirés du <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a> ; classement des résultats par fréquence d'usage grâce à <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. Licences <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> et <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>.</p>","guide.it.phrase_soulignee":"<i>Siamo <u>andati</u> al mare</i> pour <i>andare</i>, <i>le <u>case</u></i> pour <i>la casa</i>.","guide.de.phrase_soulignee":"<i>Ich <u>stehe</u> um sechs Uhr <u>auf</u></i> pour <i>aufstehen</i>, <i>die <u>Häuser</u></i> pour <i>das Haus</i>.","guide.it.phrase_par_sens":"<i>stanza</i> : « la chambre » et « la pièce »","guide.de.phrase_par_sens":"<i>um</i> : « autour de » et « à (heure) »","guide.it.meme_traduction":"<i>là</i> : <i>lì</i> et <i>là</i> ; <i>vite</i> : <i>presto</i> et <i>velocemente</i>…","guide.de.meme_traduction":"<i>là</i> : <i>da</i> et <i>dort</i> ; <i>pourquoi</i> : <i>warum</i>, <i>wieso</i>…","guide.it.sources":"<p class=\"hint\">Listes italien-français établies pour Memolex : fréquences d'usage <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a> (R. Speer, licence <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>), analyse grammaticale des phrases avec <a href=\"https://spacy.io/models/it\" target=\"_blank\" rel=\"noopener\">spaCy</a> (modèle it_core_news_lg) ; traductions, articles et pluriels relus pour Memolex.</p>","guide.de.sources":"<p class=\"hint\">Dictionnaire allemand-français <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> et pluriels du projet <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a>, tirés du <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a> (licences <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> et <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>) ; fréquences d'usage : <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. Articles et nature des mots français : <a href=\"http://www.lexique.org/\" target=\"_blank\" rel=\"noopener\">Lexique 3.83</a> (B. New, C. Pallier, licence <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>).</p>","guide.it.mots_peu_frequents":"<i>frigorifero</i>, <i>spazzolino</i>","guide.de.mots_peu_frequents":"<i>Kühlschrank</i>, <i>Zahnbürste</i>","guide.de.exemple_article":"die Geduld","guide.it.exemple_article":"la pazienza","renderGuide.compte_et_synchronisation":"Compte et synchronisation","renderGuide.installer_l_appli":"Installer l'appli","renderGuide.android_chrome_menu_installer_l":"<b>Android (Chrome)</b> : menu ⋮ → <b>Installer l'application</b> (ou « Ajouter à l'écran d'accueil »).","renderGuide.iphone_safari_bouton_partager_sur":"<b>iPhone (Safari)</b> : bouton Partager → <b>Sur l'écran d'accueil</b>.","renderGuide.une_fois_installee_memolex_s":"Une fois installée, Memolex s'ouvre comme une appli et fonctionne hors ligne. Le dictionnaire se télécharge la première fois que tu l'ouvres.","renderGuide.le_principe":"Le principe","renderGuide.l_appli_utilise_la_repetition":"L'appli utilise la <b>répétition espacée</b> : chaque mot revient juste avant que tu l'oublies. Un mot bien su s'espace de plus en plus (1 jour, 3 jours, une semaine, un mois…). Un mot raté revient vite. Tu passes donc ton temps sur ce qui résiste, pas sur ce que tu sais déjà.","renderGuide.la_cle_chercher_activement_le":"La clé : <b>chercher activement</b> le mot avant de retourner la carte. C'est l'effort de rappel qui fixe la mémoire, pas la relecture.","renderGuide.les_sessions":"Les sessions","renderGuide.avant_chaque_session_choisis_20":"Avant chaque session, choisis 20, 40 ou 60 cartes. Compte environ 10 secondes par carte. Tu peux enchaîner autant de sessions que tu veux.","renderGuide.contenu_d_une_session_d":"<b>Contenu d'une session</b> : d'abord les mots à revoir (en apprentissage, puis révisions du jour), puis des nouveaux mots pour compléter. S'il y a 15 mots à revoir et que tu choisis 40 cartes, tu auras 15 révisions et 25 nouveaux mots.","renderGuide.un_nouveau_mot_passe_3":"<b>Un nouveau mot</b> passe 3 fois : à sa découverte, environ 15 minutes plus tard, puis environ 3 heures plus tard. Ensuite il est programmé en jours (demain, puis 3 jours, une semaine…).","renderGuide.pas_de_limite_de_nouveaux":"<b>Pas de limite de nouveaux mots</b> : c'est toi qui règles le rythme. Chaque nouveau mot revient environ 5 fois le premier mois, donc beaucoup de nouveaux mots aujourd'hui, ce sont beaucoup de révisions dans les jours qui viennent.","renderGuide.une_session_longue_d_un":"Une session longue d'un coup retient moins bien que plusieurs sessions courtes : 20 cartes le matin, 20 à midi, 20 le soir valent mieux que 60 d'affilée.","renderGuide.reviser_quand_meme_quand_il":"<b>Réviser quand même</b> : quand il n'y a rien à réviser, un entraînement libre te fait repasser tes mots sans attendre. Tes réponses n'y sont pas enregistrées et ne changent pas ton calendrier.","renderGuide.arreter_chaque_reponse_est_enregistree":"<b>Arrêter</b> : chaque réponse est enregistrée dès que tu donnes ta note. Tu peux arrêter une session à tout moment sans rien perdre. Si l'appli se ferme en pleine session (appel, batterie, téléphone posé), elle te propose au retour de <b>reprendre où tu en étais</b>, même plusieurs heures après. « Arrêter » met fin à la session pour de bon.","renderGuide.revenir_en_arriere_la_fleche":"<b>Revenir en arrière</b> : la flèche ‹ à gauche de la carte ramène aux cartes déjà vues, réponse affichée et ta note encadrée. Choisis une autre note pour la corriger, ou avance avec la flèche › jusqu'à la carte en cours. Il n'y a pas de flèche › sur une carte à laquelle tu n'as pas encore répondu : on ne saute pas de carte.","renderGuide.ecarter_les_mots_que_tu":"Écarter les mots que tu connais","renderGuide.les_listes_commencent_par_les":"Les listes commencent par les mots les plus fréquents, que tu connais peut-être déjà. Deux façons de les écarter :","renderGuide.je_connais_deja_sous_un":"<b>Je connais déjà</b>, sous un nouveau mot pendant la session, une fois la réponse affichée : tu vérifies d'abord que tu le connaissais vraiment.","renderGuide.trier_mes_nouveaux_mots_avant":"<b>Trier mes nouveaux mots</b>, avant la session : chaque mot s'affiche avec sa traduction, tu réponds « Je connais déjà » ou « À apprendre ». 100 mots se trient en 2 ou 3 minutes.","renderGuide.un_mot_ecarte_n_est":"Un mot écarté n'est pas supprimé : il revient une fois dans un mois pour vérifier. Si tu le sais, il s'espace encore. Pour l'enlever pour de bon, supprime-le dans Mes mots.","renderGuide.dans_l_onglet_stats_activer":"Dans l'onglet Stats, « Activer les notifications » demande l'autorisation au téléphone. Il faut être connecté à la synchronisation : c'est le serveur qui envoie les notifications, même quand l'appli est fermée.","renderGuide.les_rappels_matin_midi_soir":"Les rappels (matin, midi, soir, au choix) n'arrivent que si tu n'as pas encore fait ton minimum de cartes du jour. Le mot du jour est un mot de A1 à C2 que tu n'as pas encore ; le bouton « Ajouter » de la notification le met dans tes mots, en tête des nouveaux.","renderGuide.sur_iphone_les_notifications_ne":"Sur iPhone, les notifications ne marchent que si l'appli est ajoutée à l'écran d'accueil.","renderGuide.la_serie_et_les_statistiques":"La série et les statistiques","renderGuide.une_journee_compte_dans_ta":"Une journée compte dans ta série quand tu réponds à au moins 10 cartes en session (réglable : 5, 10, 20 ou 30). L'entraînement libre ne compte pas.","renderGuide.l_objectif_est_de_5":"L'objectif est de 5 jours sur 7 par défaut : chaque semaine (du lundi au dimanche) te laisse donc 2 jokers. La série ne casse que si tu manques plus de jours que tes jokers dans la même semaine. Tu peux changer l'objectif ou couper la série dans l'onglet Stats.","renderGuide.l_onglet_stats_montre_les":"L'onglet Stats montre les mots acquis par niveau, les révisions des 7 prochains jours, ta réussite sur les mots mûrs (intervalle de 21 jours ou plus), tes jours actifs du mois et ton taux d'erreur sur l'article et le cas. Seule ta première réponse à chaque carte dans une session est comptée. Tu choisis les statistiques affichées.","renderGuide.une_traduction_te_parait_fausse":"Une traduction te paraît fausse, une phrase d'exemple bizarre ou choquante ? Une fois la réponse affichée, touche <b>⚑ Signaler une erreur</b> en bas de la carte, choisis le motif et ajoute un mot si tu veux. Le signalement emporte la carte telle que tu la vois. Il part même sans compte ; hors ligne, il attend la prochaine connexion. Chaque erreur signalée est corrigée dans les listes pour tous les mots du même type, pas seulement pour cette carte.","renderGuide.la_prononciation":"La prononciation","renderGuide.touche_a_cote_d_un":"Touche <b>🔊</b> à côté d'un mot, d'une expression « À retenir » ou d'une phrase d'exemple pour l'entendre. Le nom est lu avec son article (« {0} ») : entendre l'article avec le mot aide à retenir le genre. C'est la voix de synthèse de ton téléphone : correcte pour les mots courants, parfois approximative sur les mots rares ou très longs.","renderGuide.dans_le_sens_langue_francais":"Dans le sens langue → français, le mot peut être lu dès le recto : bon exercice d'écoute. Dans le sens français → langue, il n'est lu qu'au verso, pour ne pas donner la réponse. Onglet Stats, Réglages : <b>Lecture automatique</b> (le mot est lu dès qu'il s'affiche), <b>Vitesse</b> normale ou lente, ou couper la prononciation.","renderGuide.pour_progresser_vraiment_repete_le":"Pour progresser vraiment, répète le mot à voix haute juste après la voix, avec la même intonation : c'est la technique du <i>shadowing</i>. Si aucune voix ne parle, installe la langue dans les réglages de synthèse vocale du téléphone (Android : Accessibilité → Synthèse vocale).","renderGuide.les_sons":"Les sons","renderGuide.chaque_geste_a_son_petit":"Chaque geste a son petit son : la carte qui se retourne, une note qui monte pour « Bien » et « Facile », une note plus grave pour « Encore » et « Difficile », un signal quand l'article ou le cas est faux, un accord à la fin de la session. Ils restent discrets et suivent le volume du téléphone (rien en mode silencieux sur iPhone). Pour les couper : onglet Stats, Réglages, « Sons ».","renderGuide.les_quatre_notes":"Les quatre notes","renderGuide.tu_ne_savais_pas_son":"Tu ne savais pas. Son intervalle repart de zéro et la carte revient à la fin de la session : une fois toutes les autres cartes passées, l'appli annonce le <b>renforcement</b> et reprend tes « Encore ». Chaque mot revient au plus 3 fois dans une session : au-delà, répéter ne sert plus à grand-chose, il vaut mieux espacer. Le mot t'attend à ta prochaine session.","renderGuide.trouve_avec_peine_l_intervalle":"Trouvé avec peine. L'intervalle grandit peu.","renderGuide.trouve_normalement_la_note_par":"Trouvé normalement. La note par défaut, la plus utilisée.","renderGuide.immediat_l_intervalle_s_allonge":"Immédiat. L'intervalle s'allonge beaucoup.","renderGuide.sois_honnete_noter_bien_un":"Sois honnête : noter « Bien » un mot sur lequel tu as hésité, c'est le faire revenir trop tard.","renderGuide.le_code_couleur":"Le code couleur","renderGuide.le_quiz_des_articles":"Le quiz des articles","renderGuide.ajouter_et_retirer_des_mots":"Ajouter et retirer des mots","renderGuide.listes_par_niveau_les_8":"<b>Listes par niveau</b> : les 8 000 mots les plus fréquents, de A1 à C2, ajoutés 50 par 50. Les premiers mots de l'A1 sont les plus utilisés de la langue.","renderGuide.coller_une_liste_une_ligne":"<b>Coller une liste</b> : une ligne par mot, <code>{0}</code>.","renderGuide.garde_fou_au_dela_de":"<b>Garde-fou</b> : au-delà de 50 mots en cours (à découvrir, en apprentissage ou en révision), les ajouts groupés (paquets de niveau, leçons, liste collée) s'arrêtent. Un mot libère sa place quand il devient « Acquis » (3 semaines d'intervalle) ou quand tu le tries « Je connais déjà ». Un mot à la fois (formulaire, dictionnaire, mot du jour) reste toujours possible.","renderGuide.pour_annuler_un_import_mes":"Pour annuler un import : <b>Mes mots → Retirer un ajout groupé</b>. Les mots déjà commencés sont conservés.","renderGuide.le_dictionnaire":"Le dictionnaire","renderGuide.les_phrases_d_exemple":"Les phrases d'exemple","renderGuide.quand_tu_retournes_une_carte":"Quand tu retournes une carte, un mot des listes est accompagné d'une <b>phrase réelle</b> en {0}, avec sa traduction. Le mot y est souligné, sous la forme qu'il prend dans la phrase : {1}","renderGuide.une_phrase_par_sens_si":"<b>Une phrase par sens</b> : si un mot a plusieurs traductions, chacune a sa phrase, avec le sens indiqué au-dessus ({0}).","renderGuide.les_phrases_sont_choisies_courtes":"Les phrases sont choisies courtes, avec des mots plutôt plus fréquents que le mot appris, et de préférence écrites par des locuteurs natifs.","renderGuide.lis_la_phrase_a_voix":"<b>Lis la phrase à voix haute</b> avant de noter la carte : quelques secondes de plus, mais le mot se fixe avec sa grammaire.","renderGuide.si_tu_as_ecrit_ton":"Si tu as écrit ton propre exemple pour un mot, c'est lui qui s'affiche.","renderGuide.les_mots_qui_ont_la":"Les mots qui ont la même traduction","renderGuide.quand_plusieurs_de_tes_mots":"Quand plusieurs de tes mots se traduisent pareil ({0}), la carte te donne un indice : la première lettre et le nombre de lettres du mot attendu. Au verso, les autres mots de même traduction sont rappelés, pour apprendre à les distinguer.","renderGuide.si_tu_as_trouve_un":"Si tu as trouvé un autre mot de la liste, ce n'est pas faux : note « Difficile » et regarde la différence d'usage dans la phrase d'exemple.","renderGuide.credits":"Crédits","renderGuide.les_phrases_d_exemple_et":"Les phrases d'exemple et leurs traductions viennent de <a href=\"https://tatoeba.org/fr\" target=\"_blank\" rel=\"noopener\">Tatoeba</a>, une base de phrases écrite par des bénévoles, et sont diffusées sous licence <a href=\"https://creativecommons.org/licenses/by/2.0/fr/deed.fr\" target=\"_blank\" rel=\"noopener\">CC BY 2.0 FR</a>.","renderGuide.quelques_phrases_qui_precisent_la":"Quelques phrases, qui précisent la nuance entre deux mots de même traduction, ont été rédigées pour Memolex ; elles n'ont pas de numéro Tatoeba.","renderGuide.les_expressions_a_retenir_une":"Les expressions « À retenir » (une par carte, au verso) sont rédigées pour Memolex : elles montrent l'emploi le plus courant du mot, avec ses compléments habituels.","renderGuide.voir_les_auteurs_des_phrases":"Voir les auteurs des phrases","renderGuide.les_listes_par_niveau":"Les listes par niveau","renderGuide.les_listes_suivent_la_frequence":"Les listes suivent la <b>fréquence d'usage</b> : un mot très courant à l'écrit et à l'oral est proposé tôt, un mot rare plus tard. C'est la façon la plus efficace de commencer, car les quelques centaines de mots les plus fréquents couvrent l'essentiel de ce qu'on lit et entend au quotidien.","renderGuide.niveau":"Niveau","renderGuide.rang_de_frequence":"Rang de fréquence","renderGuide.a1_decouverte":"A1 · Découverte","renderGuide.a2_survie":"A2 · Survie","renderGuide.b1_seuil":"B1 · Seuil","renderGuide.b2_avance":"B2 · Avancé","renderGuide.c1_autonome":"C1 · Autonome","renderGuide.c2_maitrise":"C2 · Maîtrise","renderGuide.ces_tranches_sont_une_approximation":"Ces tranches sont une <b>approximation</b> du Cadre européen, pas son classement officiel. Des mots utiles mais peu fréquents à l'écrit ({0}) arrivent plus tard que dans un manuel : ajoute-les toi-même avec le dictionnaire quand tu en as besoin.","renderGuide.combien_de_nouveaux_mots_par":"Combien de nouveaux mots par jour ?","renderGuide.une_fois_le_rythme_installe":"Une fois le rythme installé (après 3 ou 4 semaines), ta charge quotidienne de révision est proportionnelle au nombre de mots que tu découvres chaque jour :","renderGuide.nouveaux_mots_jour":"Nouveaux mots / jour","renderGuide.temps_quotidien_estime":"Temps quotidien estimé","renderGuide.mots_appris_en_3_mois":"Mots appris en 3 mois","renderGuide.estimations_pour_environ_10_secondes":"Estimations pour environ 10 secondes par carte. Le temps réel dépend de ta vitesse et de ton taux de réussite.","renderGuide.le_conseil":"<b>Le conseil</b>","renderGuide.sur_un_niveau_facile_pour":"Sur un niveau facile pour toi, trie tes paquets puis avance vite : les mots connus disparaissent et tu ne perds pas de temps. Sur un niveau nouveau, commence à <b>10 nouveaux mots par jour</b> (le réglage par défaut, dans Stats → Réglages) et monte à 15 ou 20 seulement si tes sessions restent confortables. L'appli ne dépasse jamais ce nombre dans une journée, d.tes_mots_ta_progression_et":"Le tue parole, i tuoi progressi e le tue impostazioni vanno su tutti i dispositivi connessi con questo indirizzo. La sincronizzazione avviene da sola dopo ogni risposta e all'apertura dell'app.","pend.connecte_toi_pour_retrouver_tes":"Collegati per ritrovare le tue parole e i tuoi progressi sul telefono e sul computer. Nessuna password: ricevi un link per e-mail, da aprire sul dispositivo da collegare.","pend.adresse_e_mail":"Indirizzo e-mail","pend.m_envoyer_le_lien_de":"Inviami il link di accesso","pend.saisis_une_adresse_e_mail":"Inserisci un indirizzo e-mail valido","pend.lien_envoye_a_ouvre_l":"Link inviato a {0}. Apri l'e-mail su questo dispositivo e tocca il link.","pend.hors_ligne_reessaie_une_fois":"Offline: riprova quando sei connesso","pend.le_lien_n_a_pas":"Non è stato possibile inviare il link","pend.deconnecte_tes_mots_restent_sur":"Disconnesso. Le tue parole restano su questo dispositivo.","shell.version_de_l_appli":"Versione dell'app","shell.changer_de_langue":"Cambia lingua","shell.langue":"Lingua","shell.a_revoir":"Da rivedere","shell.mots":"Parole","shell.ou_en_sont_tes_mots":"A che punto sono le tue parole","shell.tab_review":"Ripassa","shell.tab_list":"Le mie parole","shell.tab_add":"Aggiungi","shell.tab_stats":"Statistiche","shell.tab_guide":"Guida","notifState.envoyer_un_test":"Invia un test","notifState.couper":"Disattiva","notifState.activer_les_notifications":"Attiva le notifiche","_renderReview.chargement_de_tes_mots":"Caricamento delle tue parole…","dictSearch.deja_dans_tes_mots":"già nelle tue parole","dictPick.definition":"Definizione:","prepLine.datif_si_l_on_reste":"<b>Dativo</b> se si resta nello stesso posto (domanda <i>wo?</i>): <span lang=\"{0}\">{1}</span>.","prepLine.accusatif_si_l_on_va":"<b>Accusativo</b> se si va verso quel luogo (domanda <i>wohin?</i>): <span lang=\"{0}\">{1}</span>.","guide.it.code_couleur":"\n    <p>Il colore di un nome indica il suo genere:</p>\n    <ul><li><span class=\"g-der art\">il, lo, l'</span> in blu: maschile (<i>il libro</i>, <i>lo zaino</i>, <i>l'amico</i>)</li><li><span class=\"g-die art\">la, l'</span> in rosso: femminile (<i>la casa</i>, <i>l'amica</i>)</li><li>Senza colore: verbi, aggettivi, avverbi ed espressioni, che non hanno articolo</li></ul>\n    <p>Davanti a vocale, <i>lo</i> e <i>la</i> diventano <i>l'</i>: allora solo il colore dice il genere. Il plurale è scritto per intero, con il suo articolo: <i>gli amici</i>, <i>le amiche</i>, <i>le città</i> (invariabile).</p>\n    <p class=\"hint\">Associare un colore al genere aiuta la memoria visiva, soprattutto per i nomi in <i>-e</i> (<i>il fiore</i>, <i>la chiave</i>) e le trappole (<i>la mano</i>, <i>il problema</i>).</p>","guide.de.code_couleur":"\n    <p>Il colore di un nome indica il suo genere, come nei manuali di tedesco:</p>\n    <ul><li><span class=\"g-der art\">der</span> in blu: maschile</li><li><span class=\"g-die art\">die</span> in rosso: femminile</li><li><span class=\"g-das art\">das</span> in verde: neutro</li><li>Senza colore: verbi, aggettivi, avverbi ed espressioni, che non hanno articolo</li></ul>\n    <p>Per i verbi con preposizione, il caso da usare è indicato dopo la preposizione: <i>warten auf <span class=\"pcase\">(+ Akk.)</span></i>, <i>abhängen von <span class=\"pcase\">(+ Dat.)</span></i>.</p>\n    <p class=\"hint\">Associare un colore al genere aiuta la memoria visiva: col tempo, «vedrai» die Spinne in rosso.</p>","guide.it.quiz_articles":"<p>Nella direzione → IT, per ogni nome scegli <span class=\"g-der art\">il</span>, <span class=\"g-der art\">lo</span>, <span class=\"art\">l'</span> o <span class=\"g-die art\">la</span> prima di vedere la risposta (<i>i</i>, <i>gli</i> o <i>le</i> per un nome usato solo al plurale). Un articolo sbagliato limita il voto a «Difficile»: la parola è saputa solo se lo è anche l'articolo.</p>\n    <p class=\"hint\">Promemoria: <i>lo</i> davanti a s + consonante, z, gn, ps, x, y (<i>lo studente</i>, <i>lo zio</i>); <i>l'</i> davanti a vocale; <i>il</i> negli altri casi.</p>","guide.de.quiz_articles":"<p>Nella direzione IT → DE, per ogni nome scegli <span class=\"g-der art\">der</span>, <span class=\"g-die art\">die</span> o <span class=\"g-das art\">das</span> prima di vedere la risposta. Un articolo sbagliato limita il voto a «Difficile»: la parola è saputa solo se lo è anche l'articolo.</p>","guide.it.coller_format":"il cane, i cani ; il cane ; esempio","guide.de.coller_format":"der Hund, -e ; il cane ; esempio","guide.it.lettres":"<li>I pulsanti <b>à è é ì ò ù</b> sotto i campi inseriscono queste lettere.</li>","guide.de.lettres":"<li>I pulsanti <b>ä ö ü ß</b> sotto i campi inseriscono queste lettere. Negli esercizi puoi anche scrivere <code>ae</code>, <code>oe</code>, <code>ue</code> e <code>ss</code>: è accettato.</li>","guide.it.dictionnaire":"\n    <p>In <b>Aggiungi</b>, scrivi una parola italiana: l'app ritrova la parola nelle liste di Memolex, con il suo articolo, il suo plurale e la sua traduzione rivista. Tocca un risultato per riempire la scheda. Tutto funziona offline, senza IA.</p>\n    <p class=\"hint\">Il dizionario italiano contiene le 8.000 parole delle liste. Per una parola assente, riempi la scheda da solo: articolo, plurale con il suo articolo (<i>gli zaini</i>), traduzione.</p>","guide.de.dictionnaire":"\n    <p>In <b>Aggiungi</b>, scrivi una parola tedesca (o la sua traduzione italiana): l'app ritrova la parola nelle liste di Memolex, con il suo articolo, il suo plurale e la sua traduzione rivista. Tocca un risultato per riempire la scheda. Tutto funziona offline, senza IA.</p>\n    <p><b>Livello stimato</b> (≈ A1-A2, ≈ B1-B2, ≈ C1+): calcolato in base alla frequenza d'uso della parola nello scritto e nel parlato. Le parole molto frequenti si imparano in genere presto, quelle rare più tardi. È un'<b>approssimazione</b>, non la classificazione ufficiale del QCER: <i>Kühlschrank</i> è una parola da principianti, ma è poco frequente nei testi. In Le mie parole, questi livelli hanno un filtro a parte, separato dai livelli esatti.</p>\n    <p class=\"hint\">Per ora il dizionario tedesco-italiano contiene le parole delle liste già tradotte in italiano. Per una parola assente, riempi la scheda da solo: articolo, plurale, traduzione. Se scrivi in italiano, la ricerca inversa funziona a partire da 3 lettere.</p>\n    <p class=\"hint\">Fonti: generi e plurali dal dizionario tedesco-francese <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> (edizione 2022) e dal progetto <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a>, entrambi tratti dal <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a>; risultati ordinati per frequenza d'uso grazie a <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. Licenze <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> e <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>. Traduzioni italiane scritte per Memolex.</p>","guide.it.phrase_soulignee":"<i>Siamo <u>andati</u> al mare</i> per <i>andare</i>, <i>le <u>case</u></i> per <i>la casa</i>.","guide.de.phrase_soulignee":"<i>Ich <u>stehe</u> um sechs Uhr <u>auf</u></i> per <i>aufstehen</i>, <i>die <u>Häuser</u></i> per <i>das Haus</i>.","guide.it.phrase_par_sens":"<i>stanza</i>: «la camera» e «la sala»","guide.de.phrase_par_sens":"<i>um</i>: «intorno a» e «alle (ora)»","guide.it.meme_traduction":"<i>lì</i>: <i>lì</i> e <i>là</i>; <i>presto</i>: <i>presto</i> e <i>velocemente</i>…","guide.de.meme_traduction":"<i>lì</i>: <i>da</i> e <i>dort</i>; <i>perché</i>: <i>warum</i>, <i>wieso</i>…","guide.it.sources":"<p class=\"hint\">Liste italiane create per Memolex: frequenze d'uso <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a> (R. Speer, licenza <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>), analisi grammaticale delle frasi con <a href=\"https://spacy.io/models/it\" target=\"_blank\" rel=\"noopener\">spaCy</a> (modello it_core_news_lg); traduzioni, articoli e plurali rivisti per Memolex.</p>","guide.de.sources":"<p class=\"hint\">Liste tedesche create per Memolex: generi e plurali dal dizionario <a href=\"https://freedict.org/\" target=\"_blank\" rel=\"noopener\">FreeDict</a> / <a href=\"https://www.wikdict.com/\" target=\"_blank\" rel=\"noopener\">WikDict</a> e dal progetto <a href=\"https://github.com/gambolputty/german-nouns\" target=\"_blank\" rel=\"noopener\">german-nouns</a>, tratti dal <a href=\"https://de.wiktionary.org/\" target=\"_blank\" rel=\"noopener\">Wiktionary</a> (licenze <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a> e <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>); frequenze d'uso: <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>. Articoli e categorie delle parole francesi: <a href=\"http://www.lexique.org/\" target=\"_blank\" rel=\"noopener\">Lexique 3.83</a> (B. New, C. Pallier, licenza <a href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>). Traduzioni italiane scritte per Memolex.</p>","guide.it.mots_peu_frequents":"<i>frigorifero</i>, <i>spazzolino</i>","guide.de.mots_peu_frequents":"<i>Kühlschrank</i>, <i>Zahnbürste</i>","guide.de.exemple_article":"die Geduld","guide.it.exemple_article":"la pazienza","renderGuide.compte_et_synchronisation":"Account e sincronizzazione","renderGuide.installer_l_appli":"Installare l'app","renderGuide.android_chrome_menu_installer_l":"<b>Android (Chrome)</b>: menu ⋮ → <b>Installa app</b> (o «Aggiungi a schermata Home»).","renderGuide.iphone_safari_bouton_partager_sur":"<b>iPhone (Safari)</b>: pulsante Condividi → <b>Aggiungi alla schermata Home</b>.","renderGuide.une_fois_installee_memolex_s":"Una volta installata, Memolex si apre come un'app e funziona offline. Il dizionario si scarica la prima volta che lo apri.","renderGuide.le_principe":"Il principio","renderGuide.l_appli_utilise_la_repetition":"L'app usa la <b>ripetizione distanziata</b>: ogni parola torna poco prima che tu la dimentichi. Una parola ben saputa si distanzia sempre di più (1 giorno, 3 giorni, una settimana, un mese…). Una parola sbagliata torna presto. Così passi il tempo su ciò che resiste, non su ciò che sai già.","renderGuide.la_cle_chercher_activement_le":"La chiave: <b>cercare attivamente</b> la parola prima di girare la carta. È lo sforzo di richiamo che fissa la memoria, non la rilettura.","renderGuide.les_sessions":"Le sessioni","renderGuide.avant_chaque_session_choisis_20":"Prima di ogni sessione, scegli 20, 40 o 60 carte. Conta circa 10 secondi per carta. Puoi fare tutte le sessioni che vuoi, una dopo l'altra.","renderGuide.contenu_d_une_session_d":"<b>Contenuto di una sessione</b>: prima le parole da rivedere (in apprendimento, poi i ripassi del giorno), poi parole nuove per completare. Se ci sono 15 parole da rivedere e scegli 40 carte, avrai 15 ripassi e 25 parole nuove.","renderGuide.un_nouveau_mot_passe_3":"<b>Una parola nuova</b> passa 3 volte: quando la scopri, circa 15 minuti dopo, poi circa 3 ore dopo. In seguito è programmata in giorni (domani, poi 3 giorni, una settimana…).","renderGuide.pas_de_limite_de_nouveaux":"<b>Nessun limite di parole nuove</b>: il ritmo lo decidi tu. Ogni parola nuova torna circa 5 volte il primo mese, quindi molte parole nuove oggi significano molti ripassi nei prossimi giorni.","renderGuide.une_session_longue_d_un":"Una sessione lunga tutta di fila fissa meno bene di più sessioni brevi: 20 carte la mattina, 20 a mezzogiorno, 20 la sera valgono più di 60 di seguito.","renderGuide.reviser_quand_meme_quand_il":"<b>Ripassa comunque</b>: quando non c'è niente da ripassare, un allenamento libero ti fa ripassare le tue parole senza aspettare. Le risposte non vengono salvate e non cambiano il tuo calendario.","renderGuide.arreter_chaque_reponse_est_enregistree":"<b>Ferma</b>: ogni risposta viene salvata appena dai il voto. Puoi fermare una sessione in qualsiasi momento senza perdere niente. Se l'app si chiude a metà sessione (chiamata, batteria, telefono messo giù), al ritorno ti propone di <b>riprendere da dove eri</b>, anche diverse ore dopo. «Ferma» chiude la sessione definitivamente.","renderGuide.revenir_en_arriere_la_fleche":"<b>Tornare indietro</b>: la freccia ‹ a sinistra della carta riporta alle carte già viste, con la risposta mostrata e il tuo voto evidenziato. Scegli un altro voto per correggerlo, o vai avanti con la freccia › fino alla carta in corso. Non c'è la freccia › su una carta a cui non hai ancora risposto: non si saltano carte.","renderGuide.ecarter_les_mots_que_tu":"Scartare le parole che conosci","renderGuide.les_listes_commencent_par_les":"Le liste cominciano dalle parole più frequenti, che forse conosci già. Due modi per scartarle:","renderGuide.je_connais_deja_sous_un":"<b>La conosco già</b>, sotto una parola nuova durante la sessione, una volta mostrata la risposta: prima verifichi di conoscerla davvero.","renderGuide.trier_mes_nouveaux_mots_avant":"<b>Smista le mie parole nuove</b>, prima della sessione: ogni parola compare con la sua traduzione, rispondi «La conosco già» o «Da imparare». 100 parole si smistano in 2 o 3 minuti.","renderGuide.un_mot_ecarte_n_est":"Una parola scartata non viene eliminata: torna una volta tra un mese per verifica. Se la sai, si distanzia ancora. Per toglierla definitivamente, eliminala in Le mie parole.","renderGuide.dans_l_onglet_stats_activer":"Nella scheda Statistiche, «Attiva le notifiche» chiede l'autorizzazione al telefono. Bisogna essere collegati alla sincronizzazione: è il server che invia le notifiche, anche quando l'app è chiusa.","renderGuide.les_rappels_matin_midi_soir":"I promemoria (mattina, mezzogiorno, sera, a scelta) arrivano solo se non hai ancora fatto il tuo minimo di carte del giorno. La parola del giorno è una parola da A1 a C2 che non hai ancora; il pulsante «Aggiungi» della notifica la mette nelle tue parole, in testa alle nuove.","renderGuide.sur_iphone_les_notifications_ne":"Su iPhone, le notifiche funzionano solo se l'app è aggiunta alla schermata Home.","renderGuide.la_serie_et_les_statistiques":"La serie e le statistiche","renderGuide.une_journee_compte_dans_ta":"Una giornata conta nella tua serie quando rispondi ad almeno 10 carte in sessione (regolabile: 5, 10, 20 o 30). L'allenamento libero non conta.","renderGuide.l_objectif_est_de_5":"L'obiettivo predefinito è 5 giorni su 7: ogni settimana (da lunedì a domenica) ti lascia quindi 2 jolly. La serie si interrompe solo se salti più giorni dei tuoi jolly nella stessa settimana. Puoi cambiare l'obiettivo o disattivare la serie nella scheda Statistiche.","renderGuide.l_onglet_stats_montre_les":"La scheda Statistiche mostra le parole acquisite per livello, i ripassi dei prossimi 7 giorni, il tuo successo sulle parole mature (intervallo di 21 giorni o più), i tuoi giorni attivi del mese e il tuo tasso di errore sull'articolo e sul caso. Conta solo la tua prima risposta a ogni carta in una sessione. Scegli tu quali statistiche mostrare.","renderGuide.une_traduction_te_parait_fausse":"Una traduzione ti sembra sbagliata, una frase di esempio strana o scioccante? Una volta mostrata la risposta, tocca <b>⚑ Segnala un errore</b> in fondo alla carta, scegli il motivo e aggiungi una parola se vuoi. La segnalazione porta con sé la carta così come la vedi. Parte anche senza account; offline, aspetta la prossima connessione. Ogni errore segnalato viene corretto nelle liste per tutte le parole dello stesso tipo, non solo per quella carta.","renderGuide.la_prononciation":"La pronuncia","renderGuide.touche_a_cote_d_un":"Tocca <b>🔊</b> accanto a una parola, a un'espressione «Da ricordare» o a una frase di esempio per ascoltarla. Il nome viene letto con il suo articolo («{0}»): sentire l'articolo con la parola aiuta a ricordare il genere. È la voce di sintesi del tuo telefono: corretta per le parole comuni, a volte approssimativa sulle parole rare o molto lunghe.","renderGuide.dans_le_sens_langue_francais":"Nella direzione lingua → italiano, la parola può essere letta già sul fronte: buon esercizio di ascolto. Nella direzione italiano → lingua, viene letta solo sul retro, per non dare la risposta. Scheda Statistiche, Impostazioni: <b>Lettura automatica</b> (la parola viene letta appena compare), <b>Velocità</b> normale o lenta, o disattiva la pronuncia.","renderGuide.pour_progresser_vraiment_repete_le":"Per progredire davvero, ripeti la parola ad alta voce subito dopo la voce, con la stessa intonazione: è la tecnica dello <i>shadowing</i>. Se nessuna voce parla, installa la lingua nelle impostazioni di sintesi vocale del telefono (Android: Accessibilità → Sintesi vocale).","renderGuide.les_sons":"I suoni","renderGuide.chaque_geste_a_son_petit":"Ogni gesto ha il suo piccolo suono: la carta che si gira, una nota che sale per «Bene» e «Facile», una nota più grave per «Ancora» e «Difficile», un segnale quando l'articolo o il caso è sbagliato, un accordo alla fine della sessione. Restano discreti e seguono il volume del telefono (niente in modalità silenziosa su iPhone). Per disattivarli: scheda Statistiche, Impostazioni, «Suoni».","renderGuide.les_quatre_notes":"I quattro voti","renderGuide.tu_ne_savais_pas_son":"Non la sapevi. Il suo intervallo riparte da zero e la carta torna alla fine della sessione: passate tutte le altre carte, l'app annuncia il <b>rinforzo</b> e riprende i tuoi «Ancora». Ogni parola torna al massimo 3 volte in una sessione: oltre, ripetere non serve più a molto, è meglio distanziare. La parola ti aspetta alla prossima sessione.","renderGuide.trouve_avec_peine_l_intervalle":"L'hai trovata con fatica. L'intervallo cresce poco.","renderGuide.trouve_normalement_la_note_par":"L'hai trovata normalmente. Il voto predefinito, il più usato.","renderGuide.immediat_l_intervalle_s_allonge":"Immediata. L'intervallo si allunga molto.","renderGuide.sois_honnete_noter_bien_un":"Sii onesto: dare «Bene» a una parola su cui hai esitato significa farla tornare troppo tardi.","renderGuide.le_code_couleur":"Il codice colore","renderGuide.le_quiz_des_articles":"Il quiz degli articoli","renderGuide.ajouter_et_retirer_des_mots":"Aggiungere e togliere parole","renderGuide.listes_par_niveau_les_8":"<b>Liste per livello</b>: le 8.000 parole più frequenti, da A1 a C2, aggiunte 50 alla volta. Le prime parole dell'A1 sono le più usate della lingua.","renderGuide.coller_une_liste_une_ligne":"<b>Incolla una lista</b>: una riga per parola, <code>{0}</code>.","renderGuide.garde_fou_au_dela_de":"<b>Limite di sicurezza</b>: oltre 50 parole in corso (da scoprire, in apprendimento o in ripasso), le aggiunte di gruppo (pacchetti di livello, lezioni, lista incollata) si fermano. Una parola libera il suo posto quando diventa «Acquisita» (3 settimane di intervallo) o quando la scarti con «La conosco già». Una parola alla volta (modulo, dizionario, parola del giorno) resta sempre possibile.","renderGuide.pour_annuler_un_import_mes":"Per annullare un'importazione: <b>Le mie parole → Togli un'aggiunta di gruppo</b>. Le parole già cominciate vengono conservate.","renderGuide.le_dictionnaire":"Il dizionario","renderGuide.les_phrases_d_exemple":"Le frasi di esempio","renderGuide.quand_tu_retournes_une_carte":"Quando giri una carta, una parola delle liste è accompagnata da una <b>frase reale</b> in {0}, con la sua traduzione. La parola è sottolineata, nella forma che prende nella frase: {1}","renderGuide.une_phrase_par_sens_si":"<b>Una frase per significato</b>: se una parola ha più traduzioni, ognuna ha la sua frase, con il significato indicato sopra ({0}).","renderGuide.les_phrases_sont_choisies_courtes":"Le frasi sono scelte brevi, con parole piuttosto più frequenti della parola studiata, e preferibilmente scritte da madrelingua.","renderGuide.lis_la_phrase_a_voix":"<b>Leggi la frase ad alta voce</b> prima di dare il voto: qualche secondo in più, ma la parola si fissa con la sua grammatica.","renderGuide.si_tu_as_ecrit_ton":"Se hai scritto un tuo esempio per una parola, viene mostrato quello.","renderGuide.les_mots_qui_ont_la":"Le parole che hanno la stessa traduzione","renderGuide.quand_plusieurs_de_tes_mots":"Quando più parole tue si traducono allo stesso modo ({0}), la carta ti dà un indizio: la prima lettera e il numero di lettere della parola attesa. Sul retro vengono ricordate le altre parole con la stessa traduzione, per imparare a distinguerle.","renderGuide.si_tu_as_trouve_un":"Se hai trovato un'altra parola della lista, non è sbagliato: dai «Difficile» e guarda la differenza d'uso nella frase di esempio.","renderGuide.credits":"Crediti","renderGuide.les_phrases_d_exemple_et":"Le frasi di esempio e le loro traduzioni vengono da <a href=\"https://tatoeba.org/it\" target=\"_blank\" rel=\"noopener\">Tatoeba</a>, una raccolta di frasi scritta da volontari, e sono distribuite con licenza <a href=\"https://creativecommons.org/licenses/by/2.0/fr/deed.it\" target=\"_blank\" rel=\"noopener\">CC BY 2.0 FR</a>. Quando Tatoeba non ha una traduzione italiana diretta, la frase è tradotta per Memolex dal tedesco.","renderGuide.quelques_phrases_qui_precisent_la":"Alcune frasi, che precisano la sfumatura tra due parole con la stessa traduzione, sono state scritte per Memolex; non hanno un numero Tatoeba.","renderGuide.les_expressions_a_retenir_une":"Le espressioni «Da ricordare» (una per carta, sul retro) sono scritte per Memolex: mostrano l'uso più comune della parola, con /* ---------- prononciation (1.8.0) ----------
   Synthèse vocale du navigateur (Web Speech API) : voix allemande ou italienne du téléphone, gratuite, hors ligne si elle est installée.
   settings.tts : false = boutons 🔊 masqués ; settings.ttsAuto : lecture du mot dès qu'il s'affiche ; settings.ttsRate : 1 (normal) ou 0.7 (lent). */
const SAY = (()=>{
  const ok = typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
  const TAG = Object.fromEntries(Object.entries(LANGS).map(([k,o])=>[k, o.tts.tag]));
  let voices=[];
  const load=()=>{ try{ voices=speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } };
  if(ok){ load(); try{ speechSynthesis.addEventListener('voiceschanged', ()=>{ load(); if(tab==='stats') renderStats(); }); }catch(e){} }
  // la meilleure voix de la langue : région exacte, puis voix locale (hors ligne), puis Google / Microsoft
  function voice(lang){
    const p=lang.toLowerCase(), tag=(TAG[lang]||lang).toLowerCase();
    const vs=voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(p));
    const score=v=>((v.lang||'').toLowerCase().replace('_','-')===tag?4:0)+(v.localService?2:0)+(/google|microsoft|natural|premium|enhanced/i.test(v.name)?1:0);
    return vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }
  function speak(text, lang){
    if(!ok || !text) return;
    const s=String(text).replace(/\*/g,'').replace(/\s+/g,' ').trim(); if(!s) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(s); u.lang=TAG[lang]||lang;

      u.rate = (+settings.ttsRate||1) * (LANGS[lang] ? LANGS[lang].tts.rate : 1); u.pitch=1; u.volume=1;

    }catch(e){}
  }
  return { ok, speak, voice, has:lang=>!!voice(lang), stop:()=>{ try{ ok&&speechSynthesis.cancel(); }catch(e){} } };
})();

/* ---------- parsing ---------- */
function parseLine(line){
  const [left, frRaw, ...exRest] = line.split(/[;\t]/);
  const fr = (frRaw||'').trim(), ex = exRest.join(';').trim();
  if(!left || !left.trim() || !fr) return null;
  let de = left.trim(), art = '', pl = '';
  if(LG(LANG).plural==='full'){ // « il cane, i cani ; le chien » : pluriel écrit en entier, avec son article
    const c = de.indexOf(','); if(c > -1){ pl = de.slice(c+1).trim(); de = de.slice(0,c).trim(); }
    const a = splitArt(de); let g='';
    if(a){ art=a.art; de=a.de; g = artGender(LANG, art); }
    if(!g){ const pa=splitArt(pl); if(pa && artPlural(LANG, pa.art)) g=artGender(LANG, pa.art); }
    return { de, art, pl, fr, ex, ...(g?{g}:{}) };
  }
  // « der Hund, -e ; le chien » : pluriel noté par sa terminaison
  const m = splitArt(de);
  if(m){ art = m.art; de = m.de; }
  const c = de.indexOf(',');
  if(c > -1){ pl = de.slice(c+1).trim(); de = de.slice(0,c).trim(); }
  return { de, art, pl, fr, ex };
}

/* ---------- scheduling (SM-2 simplifié) ---------- */
// un mot nouveau passe 3 fois : tout de suite, ~15 min plus tard, ~3 h plus tard ; ensuite il est programmé en jours
const STEPS = 3;
const STEP_DELAY = [0, 15*60000, 3*3600000];
const isLearning = c => c.ls!=null;
function daysLabel(ivl){ return ivl===1?'1 j':ivl<30?ivl+' j':ivl<365?Math.round(ivl/30)+' mois':Math.round(ivl/365)+' an'; }
function graduate(c, g){
  const n={...c}; const now=Date.now();
  const ivl = n.rivl || (g===4 ? 3 : 1);
  delete n.ls; delete n.dueSid; delete n.rivl;
  n.ivl=ivl; n.reps=(n.reps||0)+1; n.due=startOfDay(now)+ivl*DAY+3*3600000; return n;
}
// une note → la carte suivante ; requeue = la carte revient 3 cartes plus loin dans la session
function gradeCard(c, g){
  const now=Date.now(); let n={...c, lr:now}; delete n.dueSid;
  if(!n.first) n.first=now;
  if(isNew(c)){ n.intro=now; n.ls=0; }
  if(isLearning(n)){
    if(g===1){ n.ls=0; n.due=now; return {n, requeue:true}; }
    if(g===2){ n.ease=Math.max(1.3,(n.ease||2.5)-0.05); n.due=now+STEP_DELAY[Math.max(1,n.ls)]; return {n}; }
    n.ls+= g===4 ? 2 : 1; if(g===4) n.ease=(n.ease||2.5)+0.05;
    if(n.ls>=STEPS) return {n:graduate(n,g)};
    n.due=now+STEP_DELAY[n.ls]; return {n};
  }
  // mot déjà programmé en jours
  if(g===1){ n.lapses=(n.lapses||0)+1; n.ease=Math.max(1.3,(n.ease||2.5)-0.2); n.ls=1; n.rivl=1; n.due=now; return {n, requeue:true}; }
  if(g===2){ n.ease=Math.max(1.3,(n.ease||2.5)-0.15); n.ls=STEPS-1; n.rivl=Math.max(1,Math.round((n.ivl||1)*1.2)); n.due=now+STEP_DELAY[1]; return {n}; }
  return {n:schedule(n,g)};
}
// statut choisi à la main dans Mes mots
function withStatus(c, k){
  const now=Date.now(), sod=startOfDay(now); const n={...c}; delete n.dueSid; delete n.rivl;
  if(k==='new'){ ['ls','intro','first','lr','known','sorted'].forEach(f=>delete n[f]); return {...n, reps:0, lapses:0, ivl:0, ease:2.5, due:now}; }
  if(k==='learn'){ return {...n, ls:0, due:now, intro:n.intro||now, first:n.first||now}; }
  delete n.ls;
  const ivl = k==='known' ? Math.max(30, n.ivl||0) : ((n.ivl>=1 && n.ivl<21) ? n.ivl : 3);
  return {...n, reps:Math.max(1,n.reps||0), ivl, ease:n.ease||2.5, first:n.first||now, due:sod+ivl*DAY+3*3600000};
}
// « Je connais déjà » : le mot saute l'apprentissage et revient dans un mois pour vérifier
function markKnown(c){ const n={...c, ls:undefined, reps:1, ivl:30, ease:2.7, known:1, due:startOfDay(Date.now())+30*DAY+3*3600000, first:c.first||Date.now()}; delete n.ls; delete n.dueSid; return n; }
function schedule(c, g){
  const n={...c}; const now=Date.now();
  if(!n.first) n.first=now;
  if(g===1){ n.lapses++; n.reps=0; n.ivl=0; n.ease=Math.max(1.3,n.ease-0.2); n.due=now; return n; }
  if(g===2){ n.ease=Math.max(1.3,n.ease-0.15); n.ivl = n.reps===0 ? 1 : Math.max(1, Math.round(n.ivl*1.2)); }
  if(g===3){ n.ivl = n.reps===0 ? 1 : n.reps===1 ? 3 : Math.round(n.ivl*n.ease); }
  if(g===4){ n.ease+=0.15; n.ivl = n.reps===0 ? 3 : Math.round(Math.max(n.ivl,1)*n.ease*1.3); }
  n.reps++; n.due = startOfDay(now) + n.ivl*DAY + 3*3600000; return n;
}
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function preview(c,g){
  if(g===1) return session && session.ids.length>1?T('preview.en_fin_de_session'):T('preview.tout_de_suite');
  const {n}=gradeCard(c,g);
  if(!isLearning(n)) return daysLabel(n.ivl);
  const m=Math.round((n.due-Date.now())/60000); return m<60 ? `${m} min` : `${Math.round(m/60)} h`;
}
const isDue = c => (c.due||0) <= Date.now();
function whenText(t){
  const now=Date.now(), diff=t-now;
  if(diff<=60000) return T('whenText.dans_un_instant');
  if(diff<3600000) return `${T('whenText.dans_min',[Math.ceil(diff/60000)])}`;
  const days=Math.round((startOfDay(t)-startOfDay(now))/DAY);
  if(days===0) return `${T('days.aujourd_hui_a',[new Date(t).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'})])}`;
  if(days===1) return 'demain';
  if(days<7) return new Date(t).toLocaleDateString(LOC(),{weekday:'long'});
  return new Date(t).toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'});
}
let wakeTimer=null;
let synced=false;
let importing=false;
async function syncFromSources(){
  if(synced || mode==='loading' || !cards.size) return; synced=true;
  const src=new Map();
  Object.keys(LESSONS).forEach(id=>lessonItems(id).forEach(f=>src.set(keyOf(f),f)));
  // 1) doublons (imports lancés plusieurs fois) : on garde la carte la plus avancée
  const groups=new Map();
  for(const c of cards.values()){ const k=keyOf(c); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(c); }
  const prog=c=>(c.reps||0)*100+(c.ivl||0)+(isLearning(c)?50+(c.ls||0):0)+((c.lapses||0)>0?1:0);
  const drop=[], keepFix=[];
  for(const g of groups.values()){ if(g.length<2) continue;
    g.sort((a,b)=>prog(b)-prog(a) || a.created-b.created);
    const keep={...g[0]}; let changed=false;
    for(const o of g.slice(1)){ if(!keep.lvl&&o.lvl){keep.lvl=o.lvl;changed=true;} if(!keep.src&&o.src){keep.src=o.src;changed=true;} if(!keep.ex&&o.ex){keep.ex=o.ex;changed=true;} drop.push(o.id); }
    if(changed) keepFix.push(keep);
  }
  if(drop.length){ await removeMany(drop); }
  if(keepFix.length){ await putMany(keepFix); }
}
function scheduleWake(t){
  clearTimeout(wakeTimer);
  const d=t-Date.now();
  if(d>0 && d<6*3600000) wakeTimer=setTimeout(()=>{ if(!session) refresh(); }, d+1000);
}

const isNew = c => (c.reps||0)===0 && (c.lapses||0)===0 && !isLearning(c);
function introToday(){ const sod=startOfDay(Date.now()); return deck().filter(c=>c.intro && c.intro>=sod).length; }
// nouveaux mots par jour : au-delà, la session ne propose plus que des révisions (charge de travail tenable, cf. Anki : 20/jour par défaut)
const NEW_DAY_OPTS=[5,10,15,20];
const newPerDay = () => NEW_DAY_OPTS.includes(settings.newPerDay) ? settings.newPerDay : 10;
const newLeftToday = () => Math.max(0, newPerDay() - introToday());
// renforcement : au plus 3 « Encore » par mot et par session ; ensuite il revient à la session suivante
const ENC_MAX = 3;
// ce qui est prêt maintenant : mots en apprentissage dont le délai est passé, révisions du jour, puis nouveaux mots
function todayPlan(){
  const all=deck();
  const due=all.filter(c=>!isNew(c)&&isDue(c));
  const learn=due.filter(isLearning).sort((a,b)=>a.due-b.due);
  const rev=due.filter(c=>!isLearning(c)).sort((a,b)=>a.due-b.due);
  const pending=all.filter(isNew).sort((a,b)=>(b.prio||0)-(a.prio||0) || a.created-b.created);
  return { learn, rev, fresh: pending.slice(0, newLeftToday()), pending };
}
const minutesFor = n => Math.max(1, Math.round(n*10/60)); // ~10 s par carte, ratés compris
// avant chaque réponse : copie de la carte et de la session, pour pouvoir revenir en arrière (pas d'avance possible)
// historique de la session : chaque réponse donnée (carte avant/après). session.view = index de la carte revue, null = carte en cours
const GRADE_LABEL={1:T('GRADE_LABEL.encore'),2:T('GRADE_LABEL.difficile'),3:T('GRADE_LABEL.bien'),4:T('GRADE_LABEL.facile'),known:T('GRADE_LABEL.je_connais_deja')};
function answerOf(before, g, art){
  if(g==='known') return {after:markKnown(before), requeue:false, adj:'known'};
  let adj=g; if(guessWrong(before, art) && g>2) adj=2; // mauvais article ou mauvais cas : jamais mieux que « Difficile »
  const {n, requeue}=gradeCard(before, adj); return {after:n, requeue:!!requeue, adj};
}
// carte en cours : on garde sa réponse (verso révélé, article ou cas choisi) quand on remonte voir une carte déjà vue, et on la retrouve au retour
function liveSave(){ if(session && session.view==null) session.live={revealed, artGuess}; }
function liveRestore(){ const l=session&&session.live; revealed=l?l.revealed:false; artGuess=l?l.artGuess:null; if(session) session.live=null; }
function recordAnswer(c, g){
  const a=answerOf(c, g, artGuess); const first=!session.seen.has(c.id);
  const counted = a.adj!=='known' && first, okc = counted && a.adj>=3;
  session.hist.push({id:c.id, before:{...c}, after:a.after, grade:g, art:artGuess, requeue:a.requeue, first, counted, okc, pos:session.done+1});
  if(!session.practice) logAct(actDelta(c, counted, okc, artGuess, 1));
  session.ids.shift();
  if(a.adj==='known') session.total--;
  if(counted){ session.seen.add(c.id); session.done++; if(okc) session.ok++; }
  // « Encore » : la carte passe en fin de session ; ces cartes reviennent en boucle (phase de renforcement) tant qu'on répond « Encore »
  if(!session.again) session.again=new Set();
  if(!session.enc) session.enc={};
  if(a.requeue){ session.enc[c.id]=(session.enc[c.id]||0)+1;
    if(session.enc[c.id]<ENC_MAX){ session.ids.push(c.id); session.again.add(c.id); }
    else { session.again.delete(c.id); session.parked=(session.parked||0)+1; a.after.due=Date.now()+STEP_DELAY[1]; } }
  else session.again.delete(c.id);
  return a.after;
}
// nouvelle réponse sur une carte déjà passée : on recalcule cette carte (et ses passages suivants), sans toucher aux autres
function changeAnswer(i, g){
  const h=session.hist; const e=h[i]; if(e.grade===g) return null;
  const a=answerOf(e.before, g, e.art);
  const counted = a.adj!=='known' && e.first, okc = counted && a.adj>=3;
  session.done += (counted?1:0)-(e.counted?1:0); session.ok += (okc?1:0)-(e.okc?1:0);
  if(!session.practice){ const m=actDelta(e.before, e.counted, e.okc, e.art, -1), p=actDelta(e.before, counted, okc, e.art, 1); for(const f in p) m[f]=(m[f]||0)+p[f]; logAct(m); }
  if(e.grade==='known' && g!=='known') session.total++;
  if(g==='known' && e.grade!=='known') session.total--;
  const later=h.slice(i+1).filter(x=>x.id===e.id);
  if(!later.length){
    if(!session.again) session.again=new Set();
    if(e.requeue && !a.requeue){ const k=session.ids.lastIndexOf(e.id); if(k>=0) session.ids.splice(k,1); session.again.delete(e.id); }
    if(a.requeue && !e.requeue && ((session.enc||{})[e.id]||0)<ENC_MAX){ session.ids.push(e.id); session.again.add(e.id); }
  }
  Object.assign(e,{after:a.after, grade:g, requeue:a.requeue, counted, okc});
  let prev=a.after;
  for(const x of later){ x.before={...prev}; x.after=answerOf(x.before, x.grade, x.art).after; prev=x.after; }
  return prev;
}
// entraînement libre : les mots les plus proches de leur prochaine révision d'abord ; aucune réponse n'est enregistrée
function startPractice(size){
  const all=deck().filter(c=>!isNew(c)&&!isDue(c)).sort((a,b)=>(a.due||0)-(b.due||0));
  const ids=all.slice(0,size).map(c=>c.id); if(!ids.length) return false;
  session={ids, total:ids.length, done:0, ok:0, seen:new Set(), hist:[], view:null, practice:true}; revealed=false; artGuess=null; return true;
}
/* composition d'une session : les mots « durs » (en apprentissage + nouveaux) occupent au plus HARD_SHARE de la session,
   le reste est fait de révisions (mots déjà passés en jours, plus faciles). Viser ~80 % de réussite garde la session
   tenable et efficace. S'il manque des révisions, la session est plus courte : on ne la comble pas avec des mots durs
   (mieux vaut une 2e session plus tard, quand les mots en apprentissage ont eu le temps de reposer).
   Les mots durs sont répartis régulièrement dans la session. */
const HARD_SHARE = 0.4;
function composeSession(size){
  const {learn,rev,fresh}=todayPlan();
  const hardCap=Math.max(1, Math.round(size*HARD_SHARE));
  const L=learn.slice(0, hardCap), F=fresh.slice(0, Math.max(0, hardCap-L.length));
  const R=rev.slice(0, size-L.length-F.length);
  const learnAll=L, freshAll=F;
  // mots durs : apprentissage et nouveaux alternés
  const hard=[]; for(let i=0;i<Math.max(learnAll.length,freshAll.length);i++){ if(learnAll[i]) hard.push(learnAll[i]); if(freshAll[i]) hard.push(freshAll[i]); }
  const total=hard.length+R.length, at=new Set(hard.map((_,k)=>Math.floor((k+0.5)*total/hard.length)));
  const ids=[]; let j=0, k=0; for(let i=0;i<total;i++) ids.push(at.has(i) ? hard[k++].id : R[j++].id);
  return {ids, nLearn:learnAll.length, nRev:R.length, nFresh:freshAll.length};
}
function startSession(size){
  const {ids}=composeSession(size);
  if(!ids.length) return false;
  session={ids, total:ids.length, done:0, ok:0, seen:new Set(), hist:[], view:null}; revealed=false; artGuess=null; return true;
}
/* ---------- activité du jour, statistiques et série ----------
   settings.act[langue]["AAAA-MM-JJ"] = { n: réponses comptées, ok: justes du premier coup,
   mn/mok: cartes mûres (intervalle ≥ 21 j) vues/justes, aq/ae: articles demandés/faux, cq/ce: cas demandés/faux }.
   Seule la première réponse d'une carte dans une session compte ; l'entraînement libre ne compte pas.
   Le journal voyage avec les réglages (ligne _settings) ; deux appareils fusionnent jour par jour (valeur max). */
const dayKey = t => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = (t,k) => { const d=new Date(t); d.setDate(d.getDate()+k); d.setHours(0,0,0,0); return d.getTime(); };
const weekStart = t => { const d=new Date(t); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d.getTime(); };
const STAT_KEYS = {lvl:T('STAT_KEYS.mots_acquis_par_niveau'), load:T('STAT_KEYS.revisions_des_7_prochains_jours'), mature:T('STAT_KEYS.reussite_sur_les_mots_murs'), month:T('STAT_KEYS.jours_actifs_du_mois'), err:T('STAT_KEYS.erreurs_d_article_et_de')};
const ST = () => ({ streakOn: settings.streakOn!==false, weekGoal: settings.weekGoal||5, dayMin: settings.dayMin||10, show: settings.statShow||Object.keys(STAT_KEYS) });
function actOf(lang){ if(!settings.act) settings.act={}; const k=lang||LANG||'de'; if(!settings.act[k]) settings.act[k]={}; return settings.act[k]; }

function logAct(d){
  const a=actOf(), k=dayKey(Date.now()), e=a[k]||(a[k]={}); let ch=false;
  for(const f in d){ if(!d[f]) continue; e[f]=Math.max(0,(e[f]||0)+d[f]); ch=true; }

// ce qu'une réponse ajoute au journal (signe -1 pour la retirer quand on change d'avis)
function actDelta(before, counted, okc, art, sign){
  if(!counted) return {};
  const mature = !isLearning(before) && (before.ivl||0)>=21, isCase = art && art.startsWith('K:'), wrong = art && guessWrong(before, art);
  return { n:sign, ok:okc?sign:0, mn:mature?sign:0, mok:mature&&okc?sign:0,
    aq:art&&!isCase?sign:0, ae:art&&!isCase&&wrong?sign:0, cq:isCase?sign:0, ce:isCase&&wrong?sign:0 };
}
// fusion du journal reçu d'un autre appareil ; renvoie vrai si l'autre appareil n'a pas tout ce qu'on a ici
function mergeAct(remote){
  if(!remote || typeof remote!=='object') return !!(settings.act && Object.keys(settings.act).length);
  let localMore=false; if(!settings.act) settings.act={};
  for(const L of new Set([...Object.keys(remote), ...Object.keys(settings.act)])){
    const r=remote[L]||{}, l=settings.act[L]||(settings.act[L]={});
    for(const k of new Set([...Object.keys(r), ...Object.keys(l)])){
      const rv=r[k]||{}, lv=l[k]||(l[k]={});
      for(const f of new Set([...Object.keys(rv), ...Object.keys(lv)])){ const a=lv[f]||0, b=rv[f]||0; if(a>b) localMore=true; lv[f]=Math.max(a,b); }
    }
  }
  return localMore;
}
function sumAct(fromT, toT){
  const a=actOf(), s={n:0,ok:0,mn:0,mok:0,aq:0,ae:0,cq:0,ce:0}; const f=dayKey(fromT), t=dayKey(toT);
  for(const k in a){ if(k>=f && k<=t){ for(const x in s) s[x]+=a[k][x]||0; } }
  return s;
}
// série : un jour compte s'il atteint le minimum de cartes ; chaque semaine (lundi-dimanche) tolère 7 − objectif jours manqués (jokers).
// La série ne casse que quand une semaine dépasse ses jokers. Aujourd'hui n'est jamais compté comme manqué.
function streakInfo(){
  const {weekGoal, dayMin}=ST(), allow=7-weekGoal, a=actOf();
  const done = t => ((a[dayKey(t)]||{}).n||0) >= dayMin;
  const today=startOfDay(Date.now()), ws=weekStart(today);
  const todayN=((a[dayKey(today)]||{}).n||0), todayDone=todayN>=dayMin;
  let weekDone=0, weekMiss=0; for(let t=ws; t<=today; t=addDays(t,1)){ if(done(t)) weekDone++; else if(t<today) weekMiss++; }
  const days=Object.keys(a).filter(k=>(a[k].n||0)>=dayMin).sort();
  const base={days:0, todayN, todayDone, weekDone, weekMiss, allow, weekGoal, dayMin, left:Math.max(0,allow-weekMiss), broken:weekMiss>allow, best:settings.bestStreak||0};
  if(!days.length) return base;
  const [y,m,d]=days[0].split('-').map(Number), first=new Date(y,m-1,d).getTime();
  let start=first; const miss={};
  for(let t=addDays(today,-1); t>=first; t=addDays(t,-1)){
    if(done(t)) continue; const w=weekStart(t); miss[w]=(miss[w]||0)+1;
    if(miss[w]>allow){ start=addDays(t,1); break; }
  }
  const end = todayDone ? today : addDays(today,-1);
  while(start<=end && !done(start)) start=addDays(start,1);
  let n=0; for(let t=start; t<=end; t=addDays(t,1)) n++;
  if(n>(settings.bestStreak||0)){ settings.bestStreak=n; actDirty(); }
  return {...base, days:n, best:Math.max(n, settings.bestStreak||0)};
}
function streakHTML(compact){
  if(!ST().streakOn) return '';

    const n=((actOf()[dayKey(t)]||{}).n||0), st = n>=s.dayMin ? 'on' : t<today ? 'off' : t===today ? 'now' : 'next';
    return `<i class="sd sd-${st}" title="${T('streakHTML.jour_cartes',[new Date(t).toLocaleDateString(LOC(),{weekday:'long'}),n])}">${l}</i>`; }).join('');

  const week = s.weekDone>=s.weekGoal ? `${T('week.semaine_validee',[s.weekDone,s.weekGoal])}` : `${T('week.semaine_joker_restant',[s.weekDone,s.weekGoal,s.left])}`;
  return `<div class="streak${compact?' compact':''}"><div class="sk-top">${T('week.jour_de_serie',[s.days,s.best>s.days?` · record ${s.best}`:''])}</div>
    <div class="sk-week" aria-label="${T('week.cette_semaine')}">${dots}</div><p class="hint">${msg} · ${week}</p></div>`;
}
function loadDays(){
  const today=startOfDay(Date.now()), out=[];
  const rev=deck().filter(c=>!isNew(c));
  for(let i=0;i<7;i++){ const s=addDays(today,i), e=addDays(today,i+1);
    out.push({t:s, n: rev.filter(c=> i===0 ? (c.due||0)<e : (c.due||0)>=s && (c.due||0)<e).length}); }
  return out;
}

/* ---------- mot du jour et notifications ----------

const VAPID_PUB="BEoH21v0zIYPSfi7TOcZsGiUecddtE3-fTuuYipu2c7W85YQ1xlZLb2o5kTOdtmqRKB56jEIGSG7TpG5t2hxlXk";

function wotdFill(){
  if(!LISTDATA || mode==='loading' || !LANG) return;
  const have=new Set(deck().map(keyOf)), today=dayKey(Date.now());
  const same=settings.wotd && settings.wotd.lang===LANG && (settings.wotd.ul||'fr')===UL; // traductions dans la langue de l'utilisateur
  const old=same ? settings.wotd.days||{} : {};
  const days={}, used=new Set(); let changed=!same;
  for(const k in old){ const f=old[k]; if(k===today || (k>today && !have.has(keyOf({...f,lang:LANG})))){ days[k]=f; used.add(keyOf({...f,lang:LANG})); } else changed=true; }
  const tk=wotdTakenToday(); if(tk && (!days[today] || keyOf({...days[today],lang:LANG})!==keyOf(tk))){ days[today]=wotdRaw(); changed=true; }
  const lv=Object.keys(LEVELS).filter(L=>(LISTDATA[L]||[]).some(f=>!have.has(keyOf(f))));
  for(let i=0;i<14 && lv.length;i++){ const k=dayKey(addDays(Date.now(),i)); if(days[k]) continue;
    for(let t=0;t<30;t++){ const L=lv[Math.floor(Math.random()*lv.length)], items=LISTDATA[L], f=items[Math.floor(Math.random()*items.length)], key=keyOf(f);
      if(have.has(key)||used.has(key)) continue; days[k]={de:f.de, art:f.art||'', pl:f.pl||'', fr:f.fr, ...(f.pos?{pos:f.pos}:{}), ...(f.g?{g:f.g}:{}), lvl:L}; used.add(key); changed=true; break; } }
  let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  if(tz && settings.tz!==tz){ settings.tz=tz; changed=true; }
  if(changed){ settings.wotd={lang:LANG, ul:UL, days}; saveSettings(); }
}
const wordLine = f => (f.art ? f.art+(/'$/.test(f.art)?'':' ') : '')+f.de;

async function addWord(f, lang){
  const l=lang||LANG; if([...cards.values()].some(c=>keyOf(c)===keyOf({...f,lang:l}))) return false;
  const c={...newCard(f,''), lang:l, lvl:f.lvl, src:'lists', batchLabel:T('wotdTakenToday.mot_du_jour'), sorted:1, prio:1};
  await put(c); return true;
}
// boîte de réception des notifications (écrite par le service worker)
function idbInbox(fn){ return new Promise(res=>{ let r; try{ r=indexedDB.open('mx',1); }catch(e){ return res([]); }
  r.onupgradeneeded=()=>r.result.createObjectStore('inbox',{autoIncrement:true});
  r.onerror=()=>res([]);
  r.onsuccess=()=>{ const db=r.result; try{ const tx=db.transaction('inbox','readwrite'), st=tx.objectStore('inbox'), g=st.getAll(); g.onsuccess=()=>{ const items=g.result||[]; if(fn==='take') st.clear(); tx.oncomplete=()=>{ db.close(); res(items); }; }; g.onerror=()=>{ db.close(); res([]); }; }catch(e){ db.close(); res([]); } }; }); }
let inboxBusy=false;
async function takeInbox(){
  if(inboxBusy || mode==='loading') return; inboxBusy=true;
  try{ const items=await idbInbox('take'); let n=0, last='';
    for(const it of items){ if(it && it.f && await addWord(it.f, it.lang)){ n++; last=wordLine(it.f); } }
    if(n){ refresh(); toast(n===1?`${T('items.ajoute_il_arrive_dans_ta',[last])}`:`${T('items.mots_du_jour_ajoutes',[n])}`); }
  } finally { inboxBusy=false; }
}

  if(!SY.tok){ notifMsg=T('notifEnable.connecte_toi_d_abord_a'); return; }

  try{ const reg=await swReady();
    const sub=await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUB)});
    await sbReq('/rest/v1/memolex_push?on_conflict=endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{endpoint:sub.endpoint, sub:sub.toJSON()}},true);

function prepCase(de, c){

// la logique (casesIn) lit toujours le texte d'origine

function caseTarget(c){
  const K=CASE_OF(langOf(c));
  if(c.art || !K || !/^(prep|postp)$/.test(posOf(c))) return null;
  const t=K.prep[c.de]; if(!t) return null;
  const [std, fam]=t.split(/;\s*familier\s*:/); const need=casesIn(std); if(!need.length) return null;
  return {need, extra: fam?casesIn(fam):[]};

  const ok=t.need.every(k=>g.includes(k)) && g.every(k=>t.need.includes(k)||t.extra.includes(k));
  const famUsed=g.some(k=>t.extra.includes(k)&&!t.need.includes(k));
  if(ok) return `<div class="verdict ok">${t.need.length>1?T('famUsed.bons_cas'):T('famUsed.bon_cas')}${famUsed?` ${T('famUsed.le_est_familier',[t.extra.map(L).join(', ')])}`:''}</div>`;
  return `<div class="verdict bad">${T('famUsed.pas',[g.map(L).join(' + '),t.need.length>1?T('case.need.plusieurs',[t.need.map(L).join(T('case.et'))]):T('case.need.'+t.need[0])])}</div>`;

// réponse donnée au quiz article / cas : fausse ? (sans réponse donnée : jamais fausse)
function guessWrong(c, guess){

// notes entre parenthèses : celles qui donnent un indice grammatical vont au verso, celles qui précisent le sens restent au recto (en petit)
const GRAM_NOTE = new RegExp([...Object.keys(LANGS).map(l=>LUI(l).adj), ...U_().gramNoteWords].join('|'), 'i');

function splitFr(fr, de){
  const sense=[], gram=[]; const w=String(de||'').toLowerCase();
  // « Ich bin dran. = c'est mon tour » : au recto seulement le français, l'expression allemande au verso
  const front=String(fr||'').split(/\s*;\s*/).map(seg=>{ const i=seg.indexOf('='); if(i<0) return seg; gram.push(seg.trim()); return seg.slice(i+1).trim(); }).filter(Boolean).join(' ; ');

  let html=''; const perItem=/\([^()]*\)\s*[,;]?\s*[^\s(][^()]*\([^()]*\)\s*$/.test(front) && /\)\s*,/.test(front);

    // dès qu'une traduction a sa propre note, la note finale appartient aussi à la dernière traduction
    const inline = !isGram && (/\S/.test(front.slice(off+m.length)) || perItem);

/* mots qui partagent une traduction (là → da, dort) : un indice au recto, la liste au verso */

let sibIndex=null, sibStamp='';
function siblingsOf(c){
  const stamp=LANG+':'+cards.size+':'+[...cards.keys()].slice(-3).join();
  if(!sibIndex || sibStamp!==stamp){ sibIndex=new Map(); sibStamp=stamp;
    for(const x of deck()) for(const t of frItems(x)){ if(!sibIndex.has(t)) sibIndex.set(t,new Set()); sibIndex.get(t).add(x.id); } }

  const its=frItems(c); if(!its.length) return [];

/* contrôle à l'ajout : même traduction française qu'un autre mot.

function batchGroups(){

    if(!g || c.created-g.last>5000){ g={key:'t'+c.created,src:c.src,lvls:new Set(),ids:[],created:c.created,last:c.created}; groups.push(g); }
    g.ids.push(c.id); g.last=c.created; if(c.lvl) g.lvls.add(c.lvl);

let DICT=null, DICT_BY=new Map(), dictState='idle', dictHits=[], dictTimer=null;
const fold = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
// article d'une entrée du dictionnaire : donné par l'entrée (italien : élision), ou déduit du genre (allemand)
const entArt = e => LG(LANG).dictArticle==='explicit' ? (e.a||'') : ((LG(LANG).articles.find(x=>!x.pl && !x.elided && x.g===e.g)||{}).a||'');
const entCls = e => GCOLOR[e.g] ? 'g-'+GCOLOR[e.g] : '';
const POS_LABEL = {n:T('POS_LABEL.nom'), v:T('POS_LABEL.verbe'), adj:T('POS_LABEL.adjectif'), adv:T('POS_LABEL.adverbe'), 'adj,adv':T('POS_LABEL.adjectif_adverbe'), 'adj,prep':T('POS_LABEL.adjectif_preposition'), prep:T('POS_LABEL.preposition'), postp:T('POS_LABEL.postposition'), pron:T('POS_LABEL.pronom'), conj:T('POS_LABEL.conjonction'), num:T('POS_LABEL.nombre'), int:T('POS_LABEL.interjection'), parti:T('POS_LABEL.particule'), abr:T('POS_LABEL.abreviation'), loc:T('POS_LABEL.expression')};
function loadDict(){
  if(dictState==='loading' || dictState==='ready' || !LANG) return;
  dictState='loading'; dictStatus(); const lang=LANG;
  fetch(dataFile('dict')).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
    if(lang!==LANG) return;
    // italien : 7e colonne = article (il, lo, la, l')
    DICT_BY=new Map(); DICT=d.map(e=>({w:e[0], p:e[1], g:e[2], pl:e[3], s:e[4], z:(e[5]||0)/10, a:e[6]||'', k:fold(e[0]), f:e[4].map(x=>x[0].split(',').map(t=>fold(t.trim().replace(uArtRe(['def'],'\\s+','i'),''))))}));
    DICT.forEach(e=>{ if(e.p==='n' && e.g && !DICT_BY.has(e.w)) DICT_BY.set(e.w,e); });
    dictState='ready'; dictStatus(); dictSearch();
  }).catch(()=>{ if(lang!==LANG) return; dictState='error'; dictStatus(); });
}
function dictStatus(){
  const el=$('#dStatus'); if(!el) return;
  el.textContent = dictState==='ready' ? `${T('dictStatus.mots_hors_ligne',[DICT.length.toLocaleString(LOC())])}` : dictState==='error' ? T('dictStatus.indisponible') : T('dictStatus.chargement');
  if(dictState==='error') $('#dRes') && ($('#dRes').innerHTML=`<p class="hint">${T('dictStatus.le_dictionnaire_n_a_pas')} <button type="button" class="link" data-dretry>${T('levelsHTML.reessayer')}</button></p>`);
}
const posRank = p => p==='n'||p==='v'||p==='adj' ? 0 : 1;
function dictSearch(){
  const box=$('#dRes'); if(!box || dictState!=='ready') return;
  const raw0=($('#dq')?.value||'').trim(), sa=splitArt(raw0), raw=sa?sa.de:raw0;
  if(!raw){ box.innerHTML=''; dictHits=[]; return; }
  const q1=fold(raw), F=L_().searchFolds||[], q2=F.length ? fold(F.reduce((s,[a,b])=>s.replace(new RegExp(a,'gi'),b), raw)) : q1;
  const de=[], fr=[];
  const lowQ = raw[0]===raw[0].toLowerCase();
  for(const e of DICT){
    const caseBonus = (lowQ === (e.w[0]===e.w[0].toLowerCase())) ? 0 : .05;
    if(e.k===q1 || e.k===q2) de.push([caseBonus,e]);
    else if(e.k.startsWith(q1) || e.k.startsWith(q2)) de.push([2+posRank(e.p)*.3-e.z/8+e.k.length/400+caseBonus,e]);
    if(q1.length>=3){
      let best=Infinity, bs=0;
      e.f.forEach((items,si)=>items.forEach((t,ii)=>{
        if(t===q1 && si+ii*.3<best){ best=si+ii*.3; bs=si; }
        else if(q1.length>=4 && 4+si+ii*.3<best && t.split(/[\s'’-]+/).includes(q1)){ best=4+si+ii*.3; bs=si; }
      }));
      if(best<Infinity) fr.push([best+posRank(e.p)*.5-e.z/4+e.k.length/400,e,bs]);
    }
  }
  de.sort((a,b)=>a[0]-b[0]); fr.sort((a,b)=>a[0]-b[0]);
  const exactDe = de.length && de[0][0]<1;
  const seen=new Set(); dictHits=[];
  const take=(list,n,from)=>{ for(const [,e,si] of list){ if(dictHits.length>=n) break; if(seen.has(e)) continue; seen.add(e); dictHits.push({e,from,si:si||0}); } };
  take(de, exactDe?6:4, 'de'); take(fr, 8, 'fr'); take(de, 8, 'de');
  if(!dictHits.length){ box.innerHTML=`<p class="hint">${T('take.aucun_resultat_pour',[esc(raw)])}</p>`; return; }
  const have=new Set(deck().map(dkey));
  let lastFrom='';
  box.innerHTML=dictHits.map(({e,from,si},i)=>{
    const art=entArt(e); const known=have.has((art+e.w).toLowerCase());
    const head = from!==lastFrom ? (from==='de' ? `<div class="dgroup">${T('head.mots',[L_().adjs])}</div>` : `<div class="dgroup">${T('head.mots_qui_se_traduisent_par',[L_().adjs,esc(raw)])}</div><p class="hint dnote">${T('head.ce_sont_des_synonymes_ou',[L_().dictDefinitions?` ${T('head.la_definition_en_en_italique',[L_().adj])}`:''])}</p>`) : ''; lastFrom=from;
    return `${head}<button type="button" class="dhit" data-dpick="${i}">
      <span class="dw">${art?`<span class="art ${entCls(e)}">${esc(art)}</span>${/['’]$/.test(art)?'':' '}`:''}<b>${esc(e.w)}</b>${e.pl?`<span class="plural">, ${esc(e.pl)}</span>`:''}</span>
      <span class="dfr">${esc(e.s[si][0])}</span>${e.s[si][1]?`<span class="ddef" lang="${LANG}">${esc(e.s[si][1])}</span>`:''}
      <span class="dmeta">${POS_LABEL[e.p]?`<small>${POS_LABEL[e.p]}</small>`:''}<small class="dest">${EST_LABEL[estOf(e.z)]}</small>${known?`<span class="pill known">${T('dictSearch.deja_dans_tes_mots')}</span>`:''}</span></button>`;
  }).join('');
}

/* ---------- pluriels allemands ---------- */
function umlautOf(w){ let last=null; const re=/au|Au|a|o|u|A|O|U/g; let m; while((m=re.exec(w))) last=m; if(!last) return w;
  const map={a:'ä',o:'ö',u:'ü',au:'äu',A:'Ä',O:'Ö',U:'Ü',Au:'Äu'}; return w.slice(0,last.index)+map[last[0]]+w.slice(last.index+last[0].length); }
function pluralOf(de,pl){
  pl=(pl||'').trim(); if(!pl) return null;
  if(/^[A-ZÄÖÜ][a-zäöüß]+$/.test(pl)) return pl;
  const um=pl.startsWith('¨'); const suf=pl.replace(/^¨/,'').replace(/^-/,'').trim();
  if(!/^[a-zäöüß]*$/.test(suf)) return null;
  const base=um?umlautOf(de):de; if(um && base===de) return null; return base+suf;
}
